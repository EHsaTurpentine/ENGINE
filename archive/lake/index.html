<script type="text/plain" id="w-selfinterview">Claude, I have a series of images I want to use for a multimodal memoir project. The images were produced in a digital coloring book app on my iPad called Lake. I had a serious health incident 4 years ago which required 2 emergency surgeries on June 27, 2022 to save my life and 4 surgeries over about 10 months total; the fourth surgery was successfully completed in April of 2023. As I recovered from the first 2 surgeries in the hospital, I began using Lake for a number of reasons; one of those reasons was to document the recovery of my fine motor skills; reading and writing and even thinking were all things I had to relearn.

As I continued to make myself use Lake during that time in the hospital, I knew I was amassing material I'd use later. It wasn't until well after I got out of the hospital for good I realized what the images were in one regard was an actual trauma journal, if for no other reason than THESE ARE THE VERY IMAGES I MADE when I was actively experiencing an actual trauma.

I've already written about BUNNY COLVIN in other pieces you've used in other projects we've made, but the key thing about him is he came to me while I was in the hospital and I know the exact date I made that image of him with the diamond map and green lizard and yellow daffodils: July 22, 2022. I'd been released on July 20 but my blood pressure started spiking and so I went back to the hospital 2 days later and was, in a single word, FURIOUS about going back. But I had no choice and no one was to blame and I had to deal with all of that and it was that very first night, July 22, when I opened up the Lake app and created that first image of him.

This project isn't about him, though. What I want to do is give you these images and then roleplay with me as a talking/typing therapist. I want you to ask me at least 5 different questions about any or all of the images I created in Lake, and then I'll use our conversation in a new text-image piece. The deliverable in this is a Markdown document that reads like an actual interview transcription.

Something to inform our conversation (but not necessarily important to explicitly discuss in our conversation) is this: I had a therapist who worked magic for me before and also during the pandemic; unfortunately, he died suddenly right after the pandemic was over, no doubt the result of how he handled his practice: he was always available to his patients and put himself at remarkable risk to serve us. Eric Bergreen was his name and his obituary is probably still somewhere on the web; he had a practice in Oregon City, OR and I was his patient off and on for the better part of a decade.
</script>
<script type="text/plain" id="w-thawing">I’d lost complete track of time and reality by the time I’m coloring pages in LAKE and teaching myself not just how to hold a pencil and move it again but to try to keep doing it no matter how pointless and fruitless it was. It’s significant these begin after I’ve already proven to myself I’d live long enough to get the fuck out of that hospital. I didn’t sleep the entire time I was in there, almost four full weeks. I was beyond delirious when I fell asleep for the first time back in Gresham; they’d let me go earlier than they should have because I was coming more and more unraveled the longer I stayed on the 4th floor and the days didn’t distinguish themselves anymore. 

Which happened almost instantly; I think it was like Thursday of that first full week when I started considering the rise and fall of the sun as marking what others were living as lives, literally one day at a time. 

Every day T would come to the hospital as early as she could and every afternoon she would fall asleep in the chair and I would tell her she needed to rest and to go home and when she did that’s when the hardest parts were by a lot. 

When I look at this first one, it still feels like I’m stuck in that first room just opposite the elevator. The room where I watched the walls run and shit-talked myself right into a Valium nap at like 3 am one of the first full nights I was on the floor and badgering the nurses to just talk to me and distract me from the night terrors that would set in like gravity right around nightfall, when my hypervigilance goes into overdrive and always has because I quite really taught myself how to see in the dark. 

How to imagine the worst things possible occupying every square millimeter of any space I’m trapped in at any given time, and then steel myself for the very worst possibilities given the circumstances, at least as far as I can gather in any given moment. 

This is why being in the hospital broke my brain and darkened my spirit so quickly; as soon as Dr. Z told me he was going to “TRY” and save my life, I couldn’t unhear that one simple word, those three simple letters, that first word of the three word slogan we’d all adapted to survive the pandemic: 

TRY. FAIL. LEARN. 

In the hospital, there was zero more room for error and I knew it. I didn’t ever realize how close I’d come to dying. I still haven’t. My brain shattered in the realization that it still depends on this busted body, and unleashed my deepest self-hatreds and self-resentments. I fought with myself every second I was in there in ways I had never fought myself before. I found strengths I didn’t know I had but they were quickly deflated by weaknesses I didn’t know I had, either; the debilitation I felt from the bag that every single second saved my fucking life was beyond total; when I got home to the full length mirror in the same bathroom where I almost and very much should have died, I couldn’t and wouldn’t believe anything that I ever saw and it took months for me to even look myself in the face in the mirror when I brushed my teeth. I stopped exaggerating entirely and talking mostly. I didn’t eat any substantial for the better part of two years. Parts of me died in the hospital that needed to die, be cut out, etc. 

The rest of me, though, lived.

When I took at this first one, I can still feel how slow my thoughts and responses arrived to any and everything around me. I couldn’t believe for a single second what was really happening for almost two full years. And still. I’ll never understand it and I’ll never get over it. When Matthew Perry died, I was heartbroken. But also jealous. Getting reversal surgery doesn’t take any of that stuff away, either. No, I don’t wear the bag anymore and I’m fucking lucky as fuck I got to wear one for a year in the first place. That’s the reasonable part of me that’s still left of me to be reasonable. For weeks upon months I stewed and cussed my own existence. I never completely learned how to stop doing that kind of constant self-loathing; there will always be a part of me that never leaves the hospital, because I know I’ll be lucky to be in one when I die. 

Not if, either.

I’d been home and back already. T was terrified my blood pressure wouldn’t stabilize and the drains were still pulling years of infection out of my almost-dead whatever. Husk isn’t the right word for how it felt because there isn’t a word for how it felt. People who’ve had near death experiences talk about an absence of feeling that displaces the constant anxiety we have because we are so very conscious that we are going to die and will largely do anything within and even beyond our powers to delay the inevitable. When I agreed to go back in the hospital, I knew it wasn’t really a choice. They’d sent me home the first time because I couldn’t and wouldn’t sleep; quite really, I wouldn’t and couldn’t until I was back in the spaces where I shouldn’t have taken further steps, breathes, drags, etc. etc. Proof of concept, I guess. I’d pretty much given up on the idea of ever sleeping ever again by the end of the first week anyway; as the nights stacked up, the nursing staff tolerated more and more of my evening outbursts. You cannot pay the people who do this work enough. Not in money, not in respect, not in benefits, not in any way. The people who worked in the hospital that summer constantly talked and calmed me down in ways that nothing else has ever been able to; the emergent justification for all those IV drugs sprouted that PICC line in my arm that I very much considered a blessing and miracle and still very much do. 

Still, the absence in this first one is hard to deal with. All that white space. Not so much quiet or still as just empty. That’s how I felt every single second. It wasn’t the first time I’d ever felt that way, either. Not by a lot. I can’t remember the first time I felt it, an emptiness that is beyond the capacity of the word. Cliche and cop out, yeah. That doesn’t change the reality of it feeling exactly like that, though. An empty beyond empty. 

It’s significant there’s a whole word I’ve completed in this one. The word is significant, too. The majority of my life has been encased in ice, frozen in some way. This isn’t unique to me but I don’t have another frame of reference; if I did, I’m sure it would be like picking up someone else’s eyeglasses or pushing someone else’s contact lenses against my eyeballs an expecting to see everything another human being sees. 

I’d been proving Dr. Z and everyone right for 11 days straight when I started coloring this. I remember being particularly delirious the morning of July 11 when they handed me a little tray with a tube of yogurt and a banana under a heavy domed lid made of that antibacterial plastic stuff, that sterilite or whatever it’s called because every fucking thing in the hospital is made out of it, everything every where plastic and plastic and plastic with just splashes of stainless and surgical steels; the illusion that everything in your room is sterile evaporated within hours of that first full day; they didn’t “deep” clean the room until after they’d moved me across and then further down the hall, further away from the elevator and nursing station.  That was a long, long way away from July 22 still. I didn’t know what to think when they brought the tray other than I was completely terrified to put solid food back into my body again; I had already tried to bargain with Dr. Z within the first 48 hours of being there: I will eat/drink/not eat/not drink any fucking thing you tell me for the rest of my life if I can just go home and try to forget as much of this as possible pretty pretty pretty please I will do anything give anything say anything just tell me what it is and I will do it; he just laughed at me and told me I needed to calm down.

It took me two days to “finish” this one. Which really means, I started out like I’d always ended up: good intentions at best, wasting time at worst. The hospital showed me how fluid time really is, once you strip everything else away and just feel the seconds tick by, hoping each one is better than the last. Which of course it’s not. We are all of us incredible and odds defying miracles; we don’t ever feel like we are, but though, which is what gives our lives real edge: to begrudge your own miracle is to practice a particularly shitty kind of self-righteousness that is tough to beat.</script>
<script type="text/plain" id="w-bloom">When I look at this one, I can see my brain imposing its symmetry while my body digs even deeper into the soil. The calm and order of this, no question, is 100% faked. I felt nothing even remotely like this that I can remember now. But for at least this bit of evidence, there's a question mark extend of an exclamation point.

I want to rewrite this as:

BLOOM! ARE YOU PLANTED? and if so man,

WHERRRRRRRRRRRRRRRRE?

I was in the hospital the second time when I made this one. It was probably still July 22 or 23 and I was still pretty mad about it all and still pretty much am and still pretty much always will be. I was watching a lot of NAKED AND AFRAID still because there's like 15 years of footage for it on demand for you to watch when you're trapped in a hospital room indefinitely. Not too providential, that, if you think too much about it. 

Which, of course, I absolutely did. Think too much. About all of it. Every fucking second and even still; part of me truly never left; and didn't just leave; like DIED, like for reals died that night I could feel how alone and trapped in my own body I really really am. And always have been. Always will be. 

But that's the fight for all of us, right? To never quite feel exactly comfortable in our own skins. Layers of them.</script>
<script type="text/plain" id="w-colvin">I don't remember much about making any of these. But what I do remember was being beyond pissed off for being back in the hospital after barely 72 hours released. Which is the kind of pissed off that sets in once the fear of dying has deafened enough for your rage for being alive in the first place, YES THAT RAGE, to take back over again. The year I spent swimming upstream in that river of razorblades I called STACK_OVERFLOW had brought me all the way to even less than zero. I was grateful to every single person who brought me back from the brink of life; I was completely spiteful of myself, though, for being in the hospital bed and getting stuck there starting 27 JUN 2022, which I'll just never ever quite get over. 

The rage is what I'm talking about.

I was mad about every single thing there was to be mad about during that first stint. I was a terrible patient and I let my emotions run my mouth, no matter who or what was in the room. When I met a new specialist or nurse or whomever like that, I tried to warn them as best I could about who and what they were dealing with.

Everyone else gets a break from him. I never have and never will. I have to take care of him and always have and always will. That boy in the mirrored chrome of that medicine cabinet on 119 Clinton Dr. Not the one underneath. The one in the foreground. The one you want to look past so bad because you know what's up with that one and what's happening and you just don't want to ever be witness to anything like that and, well, when your body is trapped and your mind wants out EVEN MORE THAN EVER because it is indeed trapped right there and everything is sinking and the water levels only are rising.

I don't know if he colored all of these on July 22. There are ones he did, for sure. I don't think this is one of them. Or it totally/obviously is and I'm just a fucking moron and incapable of empathizing, not even on a narcissistic level, am I. 

Am I?

BUNNY COLVIN is that rage rechanneled as best and as positively as I can redirect it. It's that rage that levels buildings and takes planes out of the sky; atomic doesn't describe it and but there's no real point trying to describe it, anyway. 

BUNNY COLVIN is who steals muscle cars and drives them into the ocean.

BUNNY COLVIN is who smashed his heels through the floors when he landed back down from jumping not as high as he could but jumping so as to land as HARD as he could.

BUNNY COLVIN is who arrives when I am completely done talking, I guess you'd say. Which is a place beyond thinking for me, I guess you'd also say? Because COLVIN isn't focused on anything else; he is the purest representation of the Player 2 cowboy who died and died and died every time he spawned, and the Player 1 cowboy who laughed and laughed and laughed every time he pressed the ACTION button on his controller in the syncopated pattern that made it impossible--absolutely and electronically impossible--for him to miss the shot that would always hit its mark as long as he was still in rhythm. This could go on for hours. And did. Problem for him, though, was this: there's a larger and deeper well than shame. Which is the well Player 1 fell down the day he was born and has lived there ever since. Player 1 cowboy, because he spawns first, he automatically gets The Initiative. Or is supposed to. And at least, at the very fucking least, is completely counting on it every time he presses the ACTION button on that controller; when I think about what I suffered most from his touches, it's these mediated ones that still sting the most. Connected by wires, he humiliated me over and over and over. Second to second to second. And then he'd do it a different way entirely, over and over and over again, hour to hour to hour until I was, yes, literally MINDFUCKED as well as FOR-REALs FUCKED. There was no part of me he wanted to leave undominated when it first really ramped and he could and did used his size and strength against me in ways I know for sure my brain has protected me from my entire life. 

BUNNY COLVIN is the guarantor of that protection. 

And if you are in his presence, that is very very very bad news. But soon enough you won't be. 

One way or another.

I hadn't been reversed yet and although I was always told I would be, I never believed it.

I still don't, either. 

I've prepared myself as best I can to wake up from a years-long, drug-induced coma to find that I actually died back in 2022 and have been nothing more than a ghost. I know I'm not a ghost. But I also know someday I will be. 

In the meantime, though, I do have an inkling to conduct my own hauntings. They started that first fall break I spent in TF when I'd moved to Moscow and was at U of I and living in the dorms with Jonny V and blazing the lonely trail I've always been on to take me away from who and what and where and why I was growing up; I couldn't explain it in any other shorthand than the best word probably anyway, really:

HATE.

As in, I FUCKING HATE THE 208. If you have known me for any amount of time--5 seconds, even--it's been entirely obvious to you and I am sorry for not being able to handle myself properly when it comes to just how brass tacks, that hate. What's beyond hate? Take that and multiply by a bazillion and it might be in the ballpark.

Why I didn't dissolve into all that rage is simple and the same reason as ever: I have bills to pay. Large ones. I have had to have a job since I was 13 years old; I became financially autonomous the second I graduated high school, even though I had no idea of it. To say my parents weren't interested in helping me further my life past their own self-interests, well, I've written and made shit just like this for a good part of the last decade already; I spent 2021-2022 on academic leave doing nothing but thinking about them and trying to find the benefit *to me* of extending them such infinite and, really, an undeserved benefit of the doubt by any reasonable assessment of the entire picture. 

Like, *really*.

I couldn't afford to live in the way I really felt when I chose to stay on the planet, 27 Jun 2022. I had to find a way through all that disappointment and imperfection. I had to look at myself every day and live with it as the absolute miracle that it definitely was but in no way did it ever feel like one to look at. I completely hated myself and what my life had puddled into every morning I made myself get up and go to the bathroom and go through the routines that were necessary to keep my infections at bay. 

I was always emotionally emasculated by that fucking bag and I am not anywhere near too proud to say it. Because I did. Instantly. When the anesthesia from my two emergency surgeries wore off enough for me to come "awake" on that Sunday evening that I barely even remember now and gets foggier and foggier as the years trudge on, I didn't see the bag before I felt it against my skin and realized I wasn't dreaming about the ER visit conversation I'd had with Dr. Z right before I'd signed a form giving him the legal authority to do whatever it took to save my life; I signed the clipboard he gave me in a white panic and then all I know past that was T at that same railing of the hospital bed as I'm rolling down the hallway and into the O.R. and T is crying and really really Saying It: 

DON'T YOU DIE ON ME RIGHT NOW, TREVOR. YOU PROMISE ME YOU WON'T.

I promise. I remember saying it. 

I remember meaning it. 

I had to temper the rage because I had to go back to work. Bag and all. No one in the department except maybe three people knew I was even in the hospital, and no one at all knew the extent of what had really happened to me. 

Especially--and including--me.

I don’t know when I really finished this one; I don’t think it was in the hospital. But the proof is right there, I guess. This was when I was still falling in love but still nevertheless learning how to use the Apple stylus, which has become an important part of my workflows. Having a program like Obsidian at my disposal and synching to every device has unlocked a bunch of things I’ve been lost in the wilderness with for years and for a lot of reasons. One of the last things I did before the wheels fell completely off my second marriage was to backup all of my files to Google drive just in case but moreso for the inevitable. And let’s be completely real about what happens if I’m living in any other way with anyone else when my own inevitabilities ruptured and splattered. I saw the worst parts of her I would ever see those last few years, but we were both just getting warmed up and we were both getting ready to lock all the doors and windows and black everything out between us for good. I knew exactly what I was leaving behind; what I didn’t know was if it would ever be enough to have more than failed at something and still be able to say it was all worth it. I know now that I was always just wasting my time. Which ended up saving my life, in a way. </script>
