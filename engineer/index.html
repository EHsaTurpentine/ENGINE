<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>THE INDIFFERENCE ENGINEER.</title>
<meta name="description" content="THE INDIFFERENCE ENGINEER." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b0c;
    --line: #2a2c2f;
    --line-soft: #1a1c1e;
    --ink: #e9e7e1;
    --ink-dim: #83868a;
    --ink-faint: #4c4e51;
    --accent: #e3a548;
    --accent-dim: #6b5527;
    --hover: #9c90d9;      /* C64 bright accent — used for interactive/hover states */
    --hover-dim: #6c5eb5;  /* C64 border/text blue — dimmed companion */
    --nav-line: rgba(108, 94, 181, .55); /* C64 border/text blue, #6C5EB5, from the ENGINE site */
    --maxw: 640px;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background: var(--bg); color: var(--ink); }

  body{
    min-height:100vh;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 8vh 6vw;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 42px 42px;
    background-position: center;
  }

  main{ width:100%; max-width: var(--maxw); display:flex; flex-direction:column; align-items:center; }

  h1{
    font-family: "Unbounded", "IBM Plex Mono", sans-serif;
    font-weight: 800;
    font-size: clamp(22px, 4vw, 30px);
    letter-spacing: -0.01em;
    line-height: 1.15;
    margin: 0;
    text-align:center;
    color: var(--ink-dim);
  }

  /* hidden link to the ENGINE archive — same trick as LUX ESTO in the seal */
  .title-link{
    color: inherit;
    text-decoration: none;
    transition: color .3s ease, text-shadow .3s ease;
  }
  .title-link:hover,
  .title-link:focus{
    color: var(--hover);
    text-shadow: 0 0 8px rgba(156,144,217,.7);
  }
  .title-link:focus{ outline: none; }
  .title-link:focus-visible{
    outline: 1px solid var(--hover);
    outline-offset: 3px;
  }

  nav.links{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap: 16px;
    margin-top: 22px;
  }

  nav.links a{
    font-family:"IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color: var(--ink-dim);
    text-decoration:none;
    padding-bottom: 3px;
    border-bottom: 1px solid transparent;
    transition: color .2s ease, border-color .2s ease;
  }
  nav.links a:hover,
  nav.links a:focus-visible{
    color: var(--hover);
    border-bottom-color: var(--hover-dim);
  }
  nav.links a:focus-visible{ outline: none; }

  nav.links .sep{
    color: var(--nav-line);
    font-size: 12px;
  }

  footer{
    margin-top: 72px;
    font-size: 10.5px;
    letter-spacing: .1em;
    color: var(--ink-faint);
    text-transform:uppercase;
  }

  /* corner seal — secondary mark, stationary */
  .corner-seal{
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 2;
    opacity: .62;
    transition: opacity .3s ease;
  }
  .corner-seal:hover, .corner-seal:focus-within{ opacity: 1; }

  .corner-seal svg{ display:block; width: 100px; height:auto; }

  .seal-ring{ fill:none; stroke: var(--line); stroke-width:1; transition: stroke .3s ease; }
  .seal-mark{ stroke: var(--ink-faint); stroke-width:1; }
  .seal-dot{ fill: var(--accent-dim); transition: fill .3s ease, filter .3s ease; }

  .seal-text{
    font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px;
    letter-spacing: .14em;
    fill: var(--ink-dim);
  }

  .seal-mail{ text-decoration:none; }
  .seal-mail tspan{ fill: var(--ink-dim); transition: fill .3s ease, filter .3s ease; }
  .seal-mail:hover tspan,
  .seal-mail:focus tspan{
    fill: var(--hover);
    filter: drop-shadow(0 0 3px rgba(156,144,217,.85));
  }
  .seal-mail:focus{ outline: none; }

  /* the "circuit completes" moment — ring + mint marks light up with the hidden link */
  .corner-seal:has(.seal-mail:hover) .seal-ring,
  .corner-seal:has(.seal-mail:focus) .seal-ring{
    stroke: var(--hover-dim);
  }
  .corner-seal:has(.seal-mail:hover) .seal-dot,
  .corner-seal:has(.seal-mail:focus) .seal-dot{
    fill: var(--hover);
    filter: drop-shadow(0 0 3px rgba(156,144,217,.85));
  }

  .seal-motto{
    font-family: "Unbounded", sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: .01em;
    fill: var(--ink);
  }

  @media (max-width: 520px){
    .corner-seal{ right: 14px; bottom: 14px; }
    .corner-seal svg{ width: 78px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration: .001s !important; }
  }
</style>
</head>
<body>
<main>
  <h1>THE INDIFFERENCE&nbsp;<a class="title-link" href="https://ehsaturpentine.github.io/ENGINE/" target="_blank" rel="noopener" aria-label="ENGINE — archive">ENGINE</a>ER</h1>

  <nav class="links" aria-label="Platforms">
    <a href="https://substack.com/@ehsaturpentine" target="_blank" rel="noopener">[Substack]</a>
    <span class="sep" aria-hidden="true">&middot;</span>
    <a href="https://posttenebraslux3.wordpress.com" target="_blank" rel="noopener">[WordPress]</a>
    <span class="sep" aria-hidden="true">&middot;</span>
    <a href="https://www.youtube.com/@POSTTENEBRASLUX-m9p" target="_blank" rel="noopener">[YouTube]</a>
    <span class="sep" aria-hidden="true">&middot;</span>
    <a href="https://ehsaturpentine.github.io/ENGINE/archive/" target="_blank" rel="noopener">[Archive]</a>
    <span class="sep" aria-hidden="true">&middot;</span>
    <a href="https://stoneybrosgaming.com" target="_blank" rel="noopener">[A14PH]</a>


  </nav>


</main>

<div class="corner-seal">
  <svg viewBox="0 0 300 300" aria-hidden="false">
    <defs>
      <path id="arcTop" d="M 30,150 A 120,120 0 0 1 270,150" />
      <path id="arcBottom" d="M 30,150 A 120,120 0 0 0 270,150" />
    </defs>

    <circle class="seal-ring" cx="150" cy="150" r="120" />
    <circle class="seal-ring" cx="150" cy="150" r="98" />

    <line class="seal-mark" x1="150" y1="116" x2="150" y2="138" />
    <line class="seal-mark" x1="150" y1="164" x2="150" y2="186" />

    <circle class="seal-dot" cx="30" cy="150" r="2.2" />
    <circle class="seal-dot" cx="270" cy="150" r="2.2" />

    <text class="seal-text">
      <textPath href="#arcTop" startOffset="50%" text-anchor="middle">POST TENEBRAS LUX</textPath>
    </text>
    <text class="seal-text">
      <textPath href="#arcBottom" startOffset="50%" text-anchor="middle"><a class="seal-mail" href="mailto:lux_esto@protonmail.com" aria-label="Email"><tspan>LUX ESTO</tspan></a><tspan> UMBRAS FINDENS</tspan></textPath>
    </text>

    <text class="seal-motto" x="150" y="156" text-anchor="middle">TRY. FAIL. LEARN.</text>
  </svg>
</div>
</body>
</html>
