  jumpTime:1.03, jumpApex:7,// seconds, units                                [sim]

  spawnEvery:32/60,           // spawn check every 32 frames                   [rom]
  spawnChance:0.25,           //                                               [sim]

let S; // state

    const onSq=!S.arcade&&!S.key&&!p.sqImm&&[0,3,6].includes(p.row)&&Math.abs(p.x-T.doorX)<9;
