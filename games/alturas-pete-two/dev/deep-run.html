const cv=document.getElementById('c'),g=cv.getContext('2d');cv.width=W*2;cv.height=H*2;

const IM={};let loaded=0;const KEYS=Object.keys(IMG);
KEYS.forEach(k=>{const i=new Image();i.onload=()=>{loaded++;if(loaded===KEYS.length)boot()};i.src=IMG[k];IM[k]=i});
function boot(){
  IM.rockPat=g.createPattern(mirror(IM.rock_tex),'repeat');
  IM.plankPat=g.createPattern(mirror(IM.plank_tex,true),'repeat');
  last=performance.now();requestAnimationFrame(loop)}
function mirror(img,row){const c=document.createElement('canvas'),w=img.width,h=img.height;c.width=w*2;c.height=row?h:h*2;const x=c.getContext('2d');
  x.drawImage(img,0,0);x.save();x.translate(w*2,0);x.scale(-1,1);x.drawImage(img,0,0);x.restore();
  if(!row){x.save();x.translate(0,h*2);x.scale(1,-1);x.drawImage(c,0,0,w*2,h,0,0,w*2,h);x.restore()}return c}
/* ---------- audio ---------- */
let AC=null;function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function sq(steps,vol,type){try{const c=ac();if(!c)return;const t0=c.currentTime,o=c.createOscillator(),a=c.createGain();o.type=type||'square';let t=t0;
  steps.forEach(([f,ms])=>{o.frequency.setValueAtTime(f,t);t+=ms/1000});a.gain.setValueAtTime(vol||.07,t0);a.gain.setValueAtTime(vol||.07,t-.004);a.gain.linearRampToValueAtTime(.0001,t);
  o.connect(a);a.connect(c.destination);o.start(t0);o.stop(t+.02)}catch(e){}}
function noise(d,v){try{const c=ac();if(!c)return;const n=c.sampleRate*d,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(),gn=c.createGain();s.buffer=b;gn.gain.value=v;s.connect(gn);gn.connect(c.destination);s.start()}catch(e){}}
function selectBleep(){sq([[100,100],[200,100],[400,100],[800,100],[2400,100]],.08)}
const SFX={jump:()=>sq([[300,40],[520,50]],.06),smash:()=>{noise(.12,.25);sq([[180,50],[110,70]],.1)},boom:()=>{noise(.5,.6);sq([[90,200],[50,300]],.2)},
  pick:()=>sq([[700,50],[1000,60]],.07),key:()=>sq([[600,60],[900,60],[1300,90]],.07),door:()=>sq([[220,90],[330,90],[500,140]],.08),

  whisk:()=>sq([[900,35],[1300,35],[1800,60]],.06),warn:()=>sq([[800,20]],.05),fuse:()=>noise(.06,.08),rumble:()=>{noise(.7,.5);sq([[70,400]],.15)}};
/* ---------- input ---------- */
const K={};let btnDown=false,btnT=0,btnPressed=false,btnReleased=false,touch=false;
const joy={x:0,y:0,id:null,ox:0,oy:0};
addEventListener('keydown',e=>{ac();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
  if(!K[e.code]){if(['Space','KeyZ','KeyX','Enter'].includes(e.code))pressBtn();anyKey()}K[e.code]=1});
addEventListener('keyup',e=>{K[e.code]=0;if(['Space','KeyZ','KeyX','Enter'].includes(e.code))releaseBtn()});
function pressBtn(){if(!btnDown){btnDown=true;btnT=0;btnPressed=true}}
function releaseBtn(){if(btnDown){btnDown=false;btnReleased=true}}
function dirX(){const k=(K.ArrowRight||K.KeyD?1:0)-(K.ArrowLeft||K.KeyA?1:0);return k||joy.x}
function dirY(){const k=(K.ArrowDown||K.KeyS?1:0)-(K.ArrowUp||K.KeyW?1:0);return k||joy.y}
function cvPt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
cv.addEventListener('pointerdown',e=>{touch=true;ac();anyKey();const[x,y]=cvPt(e);
  if(x>W*.55&&y>H*.62){pressBtn();cv.setPointerCapture(e.pointerId);btn_id=e.pointerId}
  else if(joy.id===null){joy.id=e.pointerId;joy.ox=x;joy.oy=y;cv.setPointerCapture(e.pointerId)}});

/* ---------- rng / world ---------- */
let seed=1;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1))}

function fy(k){return TOP+k*FH}
function inGap(f,x,m){m=m||0;for(const gp of f.gaps)if(x>gp[0]+m&&x<gp[1]-m)return true;return false}
function build(){
  seed=(Date.now()&0xffff)+7;floors=[];ladders=[];items=[];
  for(let k=0;k<NF;k++){const landing=k>0&&k%6===0,f={k,y:fy(k),gaps:[],landing,door:null};
    if(landing){f.door=ri(70,290)}
    else if(k<NF-1){const n=k<2?1:ri(1,2);let tries=0;while(f.gaps.length<n&&tries++<20){const w=ri(54,70),x=ri(LW+30,RW-30-w);
      if(f.gaps.every(gp=>x>gp[1]+60||x+w<gp[0]-60))f.gaps.push([x,x+w])}
      if(rnd()<.55){let x,t=0;do{x=ri(LW+34,RW-34)}while(inGap(f,x,-26)&&t++<30);if(t<30)ladders.push({k,x})}}
    floors.push(f)}

  for(let c=0;c<4;c++){const b=c*6;
    const pk=b+ri(1,3);items.push({t:'pickstand',k:pk,x:ri(60,300),got:false});
    const kk=b+ri(2,5);items.push({t:'key',k:kk,x:ri(50,310),got:false,chunk:c});
    items.push({t:'crate',k:b+ri(1,5),x:ri(50,310),got:false})}
  items.forEach(it=>{const f=floors[it.k];let t=0;while((inGap(f,it.x,-10))&&t++<30)it.x=ri(50,310);it.y=f.y})
}

  boulders=[];parts=[];pops=[];shots=[];booms=[];nuggets=[];banners=[];
  const lk=S.landingK;P={x:W/2,y:fy(lk),vy:0,face:1,st:'stand',onLadder:null,duck:false,dead:0,anim:0,charge:0,throwT:0,fireT:0,inv:1.2,hasPick:false};
  S.hasKey=false;S.chain=1;S.chainT=0;S.pickT=0;S.spawnT=1.5;S.cam=cameraTarget()}
function cameraTarget(){return Math.max(0,P.y-H*.58)}

function floorIdx(y){return Math.round((y-TOP)/FH)}

const BT={roller:{r:17,sp:78,pts:30,img:'rock_gray',h:44},bouncer:{r:15,sp:92,pts:50,img:'rock_white',h:40},gold:{r:16,sp:118,pts:30,img:'rock_dark',h:42}};
function spawnBoulder(){
  const pk=floorIdx(P.y),lo=Math.max(0,pk-4),hi=Math.min(NF-2,pk+2);let tries=0,k;
  do{k=ri(lo,hi)}while((floors[k].landing&&false)&&tries++<5);

function stepBoulder(b,dt){
  const bt=BT[b.type];
  if(b.vy!==0||b.air){}
  // vertical
  if(b.air){b.vy+=GRAV*dt*(b.type==='bouncer'?.85:1);const ny=b.y+b.vy*dt;
    for(let k=0;k<NF;k++){const f=floors[k];if(f.y>=b.y-1&&f.y<=ny&&!inGap(f,b.x)){b.y=f.y;b.vy=b.type==='bouncer'&&!b.landedOnce?-280:0;b.landedOnce=true;b.air=b.vy<0;b.fk=k;break}}
    if(b.air)b.y=Math.max(b.y,ny);if(b.vy>0&&b.y>fy(NF)+200)b.alive=false}

    else if(b.type==='bouncer'){b.hop=(b.hop||0)-dt;if(b.hop<=0){b.air=true;b.vy=-260;b.hop=.9;b.landedOnce=true}}}
  b.x+=b.vx*dt;b.ang+=b.vx*dt/b.r;
  if(b.x<LW+b.r*.3){b.x=LW+b.r*.3;b.vx=Math.abs(b.vx)}else if(b.x>RW-b.r*.3){b.x=RW-b.r*.3;b.vx=-Math.abs(b.vx)}

function smashBoulder(b,why){

  if(b.type==='gold'){const n=why==='boom'?ri(6,8):ri(3,5);for(let i=0;i<n;i++)nuggets.push({x:b.x,y:b.y-b.r,vx:(Math.random()-.5)*220,vy:-120-Math.random()*160,t:0,alive:true,fk:b.fk,air:true})}
  else if(b.type==='roller'&&why==='pick'&&Math.random()<.14)items.push({t:'pickstand',k:b.fk,x:b.x,y:fy(b.fk),got:false,drop:true});

const PH=44;
function peteBox(){const h=P.duck?24:PH;return{x0:P.x-9,x1:P.x+9,y0:P.y-h,y1:P.y}}
function killPete(){if(P.dead>0||P.inv>0)return;P.dead=1.6;SFX.die();P.st='dead';S.shake=.3;S.lives--;burst(P.x,P.y-24,14,['#d13a2c','#f6d84a','#fff'],200);S.chain=1;S.chainT=0}
function standOn(k){P.y=fy(k);P.vy=0;if(P.st==='air'||P.st==='fall')P.st='stand'}
function updatePete(dt){
  if(P.dead>0){P.dead-=dt;if(P.dead<=0){if(S.lives<=0){S.over='GAME OVER'}else respawn()}return}
  P.anim+=dt;P.inv=Math.max(0,P.inv-dt);S.pickT=Math.max(0,S.pickT-dt);P.hasPick=S.pickT>0;P.throwT=Math.max(0,P.throwT-dt);S.fire=Math.max(0,S.fire-dt);

  if(btnDown){btnT+=dt;if(btnT>.2&&S.dyn>0&&P.st!=='climb')P.charge=Math.min(1,(btnT-.2)/1);}
  const tap=btnReleased&&btnT<=.2;
  if(btnReleased){
    if(P.charge>0&&S.dyn>0){throwDyn(P.charge)}
    else if(tap&&P.st!=='climb'){if(P.st==='stand'||P.st==='walk'){P.vy=-300;P.st='air';SFX.jump()}}
    else if(tap&&P.st==='climb'){P.st='air';P.onLadder=null;P.vy=-150}
    P.charge=0}
  if(!btnDown&&P.charge>0)P.charge=0;
  if(P.st==='climb'){
    const L=P.onLadder,top=fy(L.k),bot=fy(L.k+1);P.y+=dy*110*dt;
    if(dy===0&&dx!==0){}
    if(P.y<=top){P.y=top;P.st='stand';P.onLadder=null}else if(P.y>=bot){P.y=bot;P.st='stand';P.onLadder=null}
    if(P.st==='climb')P.face=1;return}
  // ladders
  if(P.st==='stand'||P.st==='walk'){const k=floorIdx(P.y);
    if(dy<0){const L=ladders.find(l=>l.k===k-1&&Math.abs(l.x-P.x)<13);if(L){P.st='climb';P.onLadder=L;P.x=L.x;return}}
    if(dy>0){const L=ladders.find(l=>l.k===k&&Math.abs(l.x-P.x)<13);if(L){P.st='climb';P.onLadder=L;P.x=L.x;return}}}
  P.duck=(P.st==='stand'||P.st==='walk')&&dy>0&&!ladders.some(l=>l.k===floorIdx(P.y)&&Math.abs(l.x-P.x)<13);
  if(P.st==='stand'||P.st==='walk'){
    const sp=P.duck?0:128;P.x+=dx*sp*dt;if(dx)P.face=dx;P.st=dx&&!P.duck?'walk':'stand';
    const f=floors[floorIdx(P.y)];if(f&&inGap(f,P.x)){P.st='air';P.vy=0;P.fall=true}
  }else if(P.st==='air'){
    P.x+=dx*105*dt;if(dx)P.face=dx;P.vy+=GRAV*dt;const ny=P.y+P.vy*dt;
    if(P.vy>0)for(const f of floors){if(f.y>=P.y-1&&f.y<=ny&&!inGap(f,P.x)){P.y=f.y;P.vy=0;P.st='stand';P.fall=false;break}}
    if(P.st==='air')P.y=ny;

  P.x=Math.max(LW+8,Math.min(RW-8,P.x));
  if(P.y>S.depthMax)S.depthMax=P.y;
}
function respawn(){const k=Math.max(0,Math.floor(floorIdx(P.y)/6)*6);S.landingK=Math.min(k,S.landingK>k?S.landingK:k);reset(false);banner('TRY AGAIN','#ff9a3a')}
function throwDyn(c){S.dyn--;P.throwT=.3;SFX.throw();
  shots.push({x:P.x+P.face*10,y:P.y-34,vx:P.face*(110+250*c)+(dirX()*30),vy:-(180+140*c),t:0,fuse:1.5,air:true,rest:false,fk:floorIdx(P.y)})}
function explode(s){
  SFX.boom();S.shake=.45;S.flash=.12;booms.push({x:s.x,y:s.y-8,t:0});S.rumble++;
  burst(s.x,s.y-10,30,['#ffdf5a','#ff8a20','#d13a2c','#5a5048'],380);

function updateShots(dt){

      if(s.x<LW+4){s.x=LW+4;s.vx=Math.abs(s.vx)*.4}if(s.x>RW-4){s.x=RW-4;s.vx=-Math.abs(s.vx)*.4}
      if(s.vy>0)for(const f of floors){if(f.y>=s.y-1&&f.y<=ny&&!inGap(f,s.x)){s.y=f.y;s.air=false;s.fk=f.k;s.vx=0;break}}
      if(s.air)s.y=ny;if(s.y>fy(NF)+300)s.dead=true}
    else{const f=floors[s.fk];if(inGap(f,s.x)){s.air=true;s.vy=0}}
    if(s.fuse<=0&&!s.dead){s.dead=true;explode(s)}
    else if(Math.random()<dt*30){parts.push({x:s.x,y:s.y-14,vx:(Math.random()-.5)*60,vy:-60-Math.random()*60,t:0,l:.3,c:'#ffdf5a',r:2})}}

/* ---------- main update ---------- */
function update(dt){
  S.t+=dt;
  if(S.mode==='title'){if(btnPressed||anyPressed){S.mode='play';S.startT=0;reset(true);S.mode='play';selectBleep()}return}
  if(S.over){if(btnPressed&&S.t-S.overT>.6){reset(true);S.mode='play'}return}
  S.chainT=Math.max(0,S.chainT-dt);if(S.chainT<=0&&S.chain>1)S.chain=1;
  updatePete(dt);updateShots(dt);
  // spawn
  S.spawnT-=dt;if(S.spawnT<=0&&P.dead<=0){spawnBoulder();S.spawnT=2.2+rnd()*1.8}
  if(S.crack)S.crack.t-=dt;
  // boulders
  for(const b of boulders){if(!b.alive)continue;stepBoulder(b,dt)}
  // pick sound only while visible
  if(S.pickT>0&&S.pickT<3.4){const vis=((S.pickT*3)%1)<.4;S.warnT=(S.warnT||0)-dt;if(S.warnT<=0){S.warnT=.12;if(vis)SFX.warn()}}
  // pick + collisions
  if(P.dead<=0){const bx=peteBox();
    for(const b of boulders){if(!b.alive)continue;const cy=b.y-b.r;
      if(S.pickT>0&&P.st!=='climb'){const px0=P.face>0?P.x+4:P.x-44,px1=px0+40,py0=P.y-48,py1=P.y-4;
        if(b.x+b.r>px0&&b.x-b.r<px1&&cy+b.r>py0&&cy-b.r<py1){smashBoulder(b,'pick');continue}}
      // whisker
      if(!b.whisk&&Math.abs(b.x-P.x)<b.r+6&&(P.st==='air'||P.duck)&&b.y===fy(b.fk)){
        const top=b.y-b.r*2;const clear=P.duck?(P.y-24)-b.y*0+0:top-P.y;
        if(P.st==='air'&&P.y<top&&top-P.y<8){b.whisk=true;S.score+=25*S.chain;pop('WHISKER! +'+25*S.chain,P.x,P.y-60,'#7cf');SFX.whisk();S.chainT=Math.max(S.chainT,1.2);if(S.chain<10)S.chain++}}
      const dx=Math.max(bx.x0-b.x,0,b.x-bx.x1),dy=Math.max(bx.y0-cy,0,cy-bx.y1);
      if(dx*dx+dy*dy<(b.r*.9)*(b.r*.9))killPete()}}
  boulders=boulders.filter(b=>b.alive);
  // nuggets
  for(const n of nuggets){if(!n.alive)continue;n.t+=dt;if(n.air){n.vy+=GRAV*dt;n.x+=n.vx*dt;const ny=n.y+n.vy*dt;
      if(n.x<LW+4||n.x>RW-4)n.vx*=-.5;
      if(n.vy>0)for(const f of floors){if(f.y>=n.y-1&&f.y<=ny&&!inGap(f,n.x)){n.y=f.y;n.air=false;n.fk=f.k;break}}
      if(n.air)n.y=ny;if(n.y>fy(NF)+100)n.alive=false}
    if(n.t>9)n.alive=false;
    if(P.dead<=0&&Math.hypot(n.x-P.x,(n.y-8)-(P.y-22))<22){n.alive=false;S.score+=10;pop('+10',n.x,n.y-18,'#f6d84a');SFX.nug()}}
  nuggets=nuggets.filter(n=>n.alive);
  // items
  for(const it of items){if(it.got)continue;
    if(P.dead<=0&&Math.abs(it.x-P.x)<16&&Math.abs(it.y-P.y)<14){
      if(it.t==='pickstand'){it.got=true;S.pickT=10;S.score+=5;SFX.pick();pop('PICK!',P.x,P.y-64,'#f6d84a')}
      else if(it.t==='key'){it.got=true;S.hasKey=true;S.score+=10;SFX.key();pop('KEY!',P.x,P.y-64,'#f6d84a')}
      else if(it.t==='crate'){it.got=true;S.dyn=Math.min(5,S.dyn+1);SFX.pick();pop('DYNAMITE!',P.x,P.y-64,'#ff7a5a')}}}
  // doors
  const kk=floorIdx(P.y),f=floors[kk];
  if(f&&f.landing&&P.dead<=0&&(P.st==='stand'||P.st==='walk')&&Math.abs(P.x-f.door)<18){
    if(S.hasKey&&dirY()<0||S.hasKey&&Math.abs(P.x-f.door)<10){S.hasKey=false;SFX.door();S.score+=500*1;pop('+500',P.x,P.y-70,'#f6d84a');S.dyn=Math.min(5,S.dyn+1);f.opened=true;
      if(kk===NF-1){S.over='SHAFT CLEARED!';S.overT=S.t;S.cleared=true;return}
      // open door => drop stairs hole: walk into the door to descend
      f.gaps.push([f.door-22,f.door+22]);banner('DOOR OPEN');}}
  if(f&&f.landing&&f.door&&!S.hasKey&&Math.abs(P.x-f.door)<10&&!f.msgT&&P.dead<=0){f.msgT=3;pop('NEED KEY',P.x,P.y-70,'#ff9a3a')}
  if(f&&f.msgT){f.msgT-=dt;if(f.msgT<=0)f.msgT=0}
  if(S.over&&!S.overT)S.overT=S.t;

  const ct=cameraTarget();S.cam+=(ct-S.cam)*Math.min(1,dt*5);
}

  else if(it.t==='crate'){g.save();g.translate(x,y);g.fillStyle='#7a5430';g.fillRect(-11,-18,22,18);g.fillStyle='#4a3018';g.fillRect(-11,-18,22,3);g.fillRect(-11,-3,22,3);
    g.fillStyle='#d13a2c';g.fillRect(-7,-14,4,10);g.fillRect(-1,-14,4,10);g.fillRect(5,-14,4,10);g.restore()}}}
function drawDyn(x,y,a){g.save();g.translate(x,y);g.rotate(a||0);g.fillStyle='#c4281c';g.fillRect(-4,-14,8,18);g.fillStyle='#ffdf8a';g.fillRect(-4,-8,8,3);g.fillStyle='#2a1a0c';g.fillRect(-1,-18,2,5);
  g.fillStyle='#ffdf5a';g.beginPath();g.arc(0,-20,2.5+Math.random()*1.5,0,6.3);g.fill();g.restore()}
function drawBoulder(b){const bt=BT[b.type],im=IM[bt.img],h=bt.h,w=im.width*h/im.height;
  g.save();g.translate(b.x,b.y-b.r);g.rotate(b.ang);g.drawImage(im,-w/2,-h/2,w,h);
  if(b.type==='gold'){g.fillStyle='#ffd83a';for(let i=0;i<5;i++){const a=i*1.3,rr=7+i%2*5;g.fillRect(Math.cos(a)*rr-1.5,Math.sin(a)*rr-1.5,3,3)}}g.restore();
  g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(b.x,b.y+1,b.r*.8,3,0,0,6.3);g.fill()}
function drawPete(){
  if(P.dead>0){const t=1.6-P.dead;if(t<.9){g.save();g.translate(P.x,P.y-20+t*30);g.rotate(t*6);g.globalAlpha=Math.max(0,1-t);g.drawImage(IM.pete_idle,-18,-30,36,60);g.restore()}return}
  if(P.inv>0&&Math.floor(P.inv*12)%2)return;
  let im=IM.pete_idle,hh=62,sx=P.face,bob=0,rot=0,sy=1;
  if(P.st==='walk'){bob=-Math.abs(Math.sin(P.anim*14))*3;rot=Math.sin(P.anim*14)*.07}
  if(P.st==='air'){sy=1.06;rot=P.face*.1}
  if(P.duck){sy=.62}
  if(P.st==='climb'){im=IM.pete_ladder;sx=Math.floor(P.anim*7)%2?1:-1;bob=0}
  if(P.throwT>0||P.charge>0)im=IM.pete_throw;
  const w=im.width*hh/im.height;g.save();g.translate(P.x,P.y+bob);g.rotate(rot);g.scale(sx*(im===IM.pete_throw?1:1),sy);
  if(im===IM.pete_throw){g.scale(P.face*sx>0?1:1,1)}
  g.drawImage(im,-w/2,-hh,w,hh);g.restore();
  // pick
  if(S.pickT>0&&(S.pickT>3.4||((S.pickT*3)%1)<.4)){g.save();g.translate(P.x+P.face*16,P.y-(P.duck?18:34));g.scale(P.face,1);
    g.strokeStyle='#8a5a2a';g.lineWidth=3;g.beginPath();g.moveTo(0,10);g.lineTo(18,-12);g.stroke();g.strokeStyle='#ffd83a';g.lineWidth=4;g.beginPath();g.moveTo(8,-14);g.quadraticCurveTo(24,-24,36,-8);g.stroke();
    g.strokeStyle='#8a6a10';g.lineWidth=1;g.stroke();g.restore()}
  // fire on beard
  if(S.fire>0){for(let i=0;i<5;i++){const fx=P.x+(i-2)*4+(Math.random()-.5)*3,fyy=P.y-(P.duck?16:30)-Math.random()*10;g.fillStyle=i%2?'#ffdf5a':'#ff7a20';g.beginPath();g.moveTo(fx-3,fyy+4);g.quadraticCurveTo(fx,fyy-12-Math.random()*6,fx+3,fyy+4);g.fill()}}
  // aim arc
  if(P.charge>0){const c=P.charge;let x=P.x+P.face*10,y=P.y-34,vx=P.face*(110+250*c)+dirX()*30,vy=-(180+140*c);g.fillStyle='rgba(255,230,120,.9)';
    for(let i=0;i<14;i++){const dt=.045;for(let j=0;j<2;j++){vy+=GRAV*.8*dt;x+=vx*dt;y+=vy*dt}g.beginPath();g.arc(x,y,2.2-i*.08,0,6.3);g.fill()}}
}
function drawBoom(b){const t=b.t/.5,r=20+t*55;g.save();g.translate(b.x,b.y);g.globalAlpha=1-t*.8;
  g.fillStyle='#ff7a20';star(0,0,r,r*.55,12);g.fill();g.fillStyle='#ffdf5a';star(0,0,r*.65,r*.35,10,.3);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(0,0,Math.max(0,r*.3*(1-t)),0,6.3);g.fill();
  g.strokeStyle='rgba(255,255,255,'+(.7-t)+')';g.lineWidth=3;g.beginPath();g.arc(0,0,r*1.2,0,6.3);g.stroke();g.restore()}
function star(x,y,R,r,n,rot){g.beginPath();for(let i=0;i<n*2;i++){const a=(rot||0)+i*Math.PI/n,rr=i%2?r:R;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath()}
function txt(s,x,y,col,size,al){g.font='bold '+size+'px '+SANS;g.textAlign=al||'center';g.lineJoin='round';g.lineWidth=size*.22;g.strokeStyle='rgba(0,0,0,.85)';g.strokeText(s,x,y);g.fillStyle=col;g.fillText(s,x,y)}
function draw(){
  g.setTransform(2,0,0,2,0,0);g.fillStyle='#000';g.fillRect(0,0,W,H);
  if(S.mode==='title'){drawTitle();return}
  const sh=S.shake>0?S.shake*14:0,ox=(Math.random()-.5)*sh,oy=(Math.random()-.5)*sh;
  g.save();g.translate(ox,-S.cam+oy);
  drawBG();
  const k0=Math.max(0,Math.floor((S.cam-TOP)/FH)-1),k1=Math.min(NF-1,Math.ceil((S.cam+H-TOP)/FH)+1);
  for(let k=k0;k<=k1;k++){if(k%3===1)drawLantern(k%2?60:300,fy(k)-70)}
  ladders.forEach(l=>{if(l.k>=k0-1&&l.k<=k1)drawLadder(l)});
  for(let k=k0;k<=k1;k++)drawFloor(floors[k]);
  if(S.crack&&S.crack.t>0){g.fillStyle='rgba(255,200,90,'+S.crack.t+')';g.fillRect(S.crack.x-6,S.crack.y-34,12,34)}
  drawItems();
  nuggets.forEach(n=>{g.fillStyle='#ffd83a';g.beginPath();g.arc(n.x,n.y-4,4,0,6.3);g.fill();g.fillStyle='#fff6a8';g.fillRect(n.x-2,n.y-6,2,2)});
  boulders.forEach(drawBoulder);
  shots.forEach(s=>drawDyn(s.x,s.y,s.air?s.t*9:1.2));
  drawPete();
  booms.forEach(drawBoom);
  parts.forEach(p=>{g.globalAlpha=Math.max(0,1-p.t/p.l);g.fillStyle=p.c;g.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);g.globalAlpha=1});
  pops.forEach(p=>{g.globalAlpha=Math.max(0,1-p.a/1.1);txt(p.t,p.x,p.y-p.a*30,p.c,12);g.globalAlpha=1});
  g.restore();
  if(S.flash>0){g.fillStyle='rgba(255,240,200,'+S.flash*5+')';g.fillRect(0,0,W,H)}
  drawHUD();
  if(S.over)drawOver();
}
function drawHUD(){
  g.fillStyle='rgba(8,12,20,.78)';g.fillRect(0,0,W,40);g.fillStyle='#f6d84a';g.fillRect(0,40,W,2);
  txt('SCORE',10,14,'#9fb4d0',9,'left');txt(String(S.score).padStart(6,'0'),10,32,'#fff',18,'left');
  const ft=Math.max(0,Math.round((P.y-TOP)/FH*40));txt('DEPTH',W/2,14,'#9fb4d0',9);txt(ft+' FT',W/2,32,'#fff',16);
  txt('x'+S.chain,W-12,32,S.chain>1?'#ffdf5a':'#7b8aa0',18,'right');txt('CHAIN',W-12,14,'#9fb4d0',9,'right');
  // lives, dynamite, key, pick
  for(let i=0;i<S.lives;i++){g.fillStyle='#d13a2c';g.fillRect(10+i*14,48,10,8);g.fillStyle='#e8d8b8';g.fillRect(11+i*14,44,8,5)}
  for(let i=0;i<S.dyn;i++){g.save();g.translate(W-14-i*13,58);g.rotate(.3);g.fillStyle='#c4281c';g.fillRect(-3,-9,6,13);g.fillStyle='#ffdf8a';g.fillRect(-3,-4,6,2);g.restore()}
  if(S.hasKey)txt('KEY',W/2,58,'#ffd83a',11);
  if(S.pickT>0){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(W/2-40,64,80,6);g.fillStyle='#ffd83a';g.fillRect(W/2-39,65,78*S.pickT/10,4)}
  if(S.rumble>0){txt('RUMBLE '+'!'.repeat(S.rumble),10,76,'#ff9a3a',9,'left')}
  for(const b of banners){const t=b.a,sc=t<.2?.6+t*2:1;g.save();g.translate(W/2,H*.3);g.scale(sc,sc);g.globalAlpha=Math.min(1,(1.6-t)*2);txt(b.t,0,0,b.c,28);g.restore()}
  if(touch)drawTouch();
}
function drawTouch(){g.globalAlpha=.4;g.fillStyle='#fff';
  const cx=joy.id!==null?joy.ox:70,cy=joy.id!==null?joy.oy:H-90;g.beginPath();g.arc(cx,cy,38,0,6.3);g.fill();g.fillStyle='#000';g.beginPath();g.arc(cx+joy.x*18,cy+joy.y*18,16,0,6.3);g.fill();
  g.fillStyle=btnDown?'#ffdf5a':'#fff';g.beginPath();g.arc(W-62,H-84,38,0,6.3);g.fill();g.globalAlpha=1;txt('A',W-62,H-76,'#000',22)}
function drawOver(){g.fillStyle='rgba(0,0,0,.72)';g.fillRect(0,0,W,H);
  txt(S.over,W/2,H*.34,S.cleared?'#7dff9a':'#d81818',34);txt('SCORE '+S.score,W/2,H*.34+50,'#fff',24);
  txt('DEPTH '+Math.round((S.depthMax-TOP)/FH*40)+' FT',W/2,H*.34+82,'#9fb4d0',16);
  if(S.t-S.overT>.6)txt('PRESS ANY KEY TO PLAY AGAIN',W/2,H*.34+130,'#f6f2e8',13);
  if(S.cleared)txt('SLICE 1 COMPLETE - CAVE-IN BOSS COMES NEXT',W/2,H*.34+160,'#f6d84a',10)}
function drawTitle(){
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#101826');gr.addColorStop(1,'#050810');g.fillStyle=gr;g.fillRect(0,0,W,H);
  const pw=IM.pete_idle.width*210/IM.pete_idle.height;g.drawImage(IM.pete_idle,W/2-pw/2,H*.32,pw,210);
  g.fillStyle='#42a4e8';rr(24,70,W-48,120,18);g.fill();g.fillStyle='#0a1420';rr(30,76,W-60,108,14);g.fill();g.fillStyle='#3ea6ea';rr(34,80,W-68,100,11);g.fill();
  txt('ALTURAS PETE!',W/2,112,'#0a2a50',26);txt('DEEP RUN',W/2,150,'#fff',34);txt('SLICE 1 - ONE SHAFT',W/2,172,'#06284f',11);
  if(Math.floor(S.t*2)%2===0){g.fillStyle='rgba(0,0,0,.72)';rr(W/2-100,H*.78,200,30,8);g.fill();txt('PRESS ANY KEY',W/2,H*.78+21,'#f6f2e8',15)}
  txt('ARROWS/WASD MOVE  -  SPACE: JUMP (TAP) / THROW DYNAMITE (HOLD)',W/2,H-30,'#9fb4d0',8);txt('DOWN = DUCK  -  UP/DOWN ON LADDERS',W/2,H-18,'#9fb4d0',8)}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
/* ---------- loop ---------- */
let last=0,anyPressed=false;function anyKey(){anyPressed=true}
reset(true);S.mode='title';
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  try{update(dt);draw()}catch(e){console.error(e);window.__err=String(e&&e.stack||e)}
  btnPressed=btnReleased=anyPressed=false;requestAnimationFrame(loop)}
window.__dbg={get S(){return S},get P(){return P},floors:()=>floors,boulders:()=>boulders,shots:()=>shots,K,pressBtn,releaseBtn,items:()=>items,ladders:()=>ladders};
</script></body></html>
