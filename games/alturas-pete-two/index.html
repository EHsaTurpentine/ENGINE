/* the console's SELECT GAME bleep, measured from the user's capture: square wave, five 0.1 s steps at 100, 200, 400, 800 and 2400 Hz */
function selectBleep(){sqSeq([[100,100],[200,100],[400,100],[800,100],[2400,100]],.08)}
function bootSfx(k){if(k==='select'){selectBleep();return}if(S.arcade)return;
  if(k==='clunk'){noiseBurst(.14,.16);sqSeq([[90,90]],.14)}
  else if(k==='click')sqSeq([[1900,10],[700,20]],.1);
  else if(k==='powerup')sqSeq([[200,60],[300,60],[450,60],[700,60],[1000,80],[1500,120]],.07);

function stepBoot(){
  S.bootT++;
  if(S.bootT<BT.POWER&&bootPoke)S.bootT=BT.POWER;
  bootPoke=false;
  if(S.bootT===108){bootSfx('clunk');for(let i=0;i<26;i++)bootDust.push({x:28+Math.random()*104,y:146,vx:(Math.random()-.5)*3,vy:-Math.random()*2.2,l:20+Math.random()*14})}
  if(S.bootT===BT.PRESS)bootSfx('click');
  if(S.bootT===BT.POWER)bootSfx('powerup');
  if(S.bootT>=BT.SWITCH){S.mode='cover';S.coverT=0}
  for(let i=bootDust.length-1;i>=0;i--){const d=bootDust[i];d.x+=d.vx;d.y+=d.vy;d.vy+=.08;d.l-=1;if(d.l<=0)bootDust.splice(i,1)}
}

  R(fx-14,ft-72,28,4,'#111');R(fx-13,ft-72,26,3,'#e8e8f0');
  R(fx-13,ft-70,26,30,'#111');R(fx-12,ft-70,24,29,'#f0b890');R(fx+8,ft-70,4,29,'#d89868');
  R(fx-20,ft-62,9,12,'#111');R(fx-19,ft-61,8,10,'#f0b890');
  R(fx-7,ft-44,14,44,'#111');R(fx-5,ft-1,10,2,'#111');
  R(fx-6,ft-44,12,43,'#f0b890');R(fx-4,ft-1,8,1,'#f0b890');R(fx+3,ft-44,3,43,'#d89868');

function drawBoot(){
  R(0,0,320,224,'#fff');const t=S.bootT;let shake=0;if(t>=108&&t<124)shake=(124-t)/8;
  g.save();g.translate(80,0);
  if(shake)g.translate(Math.round((Math.random()-.5)*2*shake),Math.round((Math.random()-.5)*shake));
  const pressed=t>=BT.PRESS&&t<BT.PRESS+26;
  g.drawImage(BI.cons,4,140);
  const bx=18,by=145+(pressed?2:0);g.drawImage(BI.btn,bx,by,18,19);if(pressed){g.fillStyle='rgba(0,0,0,.28)';g.fillRect(bx+2,by+2,14,11)}
  let cy;if(t<20)cy=-130;else if(t<80)cy=-130+140*bEase((t-20)/60);else if(t<BT.SLAM)cy=10+Math.sin(t*.5)*2;else if(t<108){const k=(t-BT.SLAM)/8;cy=10+58*k*k}else cy=68;
  g.save();g.beginPath();g.rect(0,0,160,145);g.clip();g.drawImage(BI.cart,38,Math.round(cy));g.restore();
  if(t>=128&&t<224){let ft;if(t<BT.PRESS-6)ft=-40+(147+40)*bEase((t-128)/38);else if(t<BT.PRESS)ft=147;else if(t<BT.PRESS+26)ft=149;else ft=149-(t-(BT.PRESS+26))*5;drawBootFinger(Math.round(ft))}

const VDC_FR=.02;
function vdcWave(c,a7,a8,a9,aa){const hi=(aa&0x20)?4800:14400,n=Math.round(c.sampleRate/hi*24);const noise=aa&0x10;const len=noise?c.sampleRate:Math.round(24*c.sampleRate/hi);
  const b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);const bits=(a7<<16)|(a8<<8)|a9;
  if(noise){const hold=Math.max(1,Math.round(c.sampleRate/hi));let v=1;for(let i=0;i<len;i++){if(i%hold===0)v=Math.random()<.5?-1:1;d[i]=v}}
  else for(let i=0;i<len;i++){const k=Math.floor(i*hi/c.sampleRate)%24;d[i]=((bits>>(23-k))&1)?1:-1}
  return b}
function vdcPlay(seq,gain){try{const c=o2ctx(),t0=c.currentTime+.005;let src=null,g=null;const G=gain||.12;
  const stop=t=>{if(src){try{g.gain.setValueAtTime(0,t);src.stop(t+.001)}catch(e){}src=null}};
  for(const [fr,a7,a8,a9,aa] of seq){const t=t0+fr*VDC_FR;stop(t);if(!(aa&0x80))continue;
    src=c.createBufferSource();g=c.createGain();src.buffer=vdcWave(c,a7,a8,a9,aa);src.loop=true;g.gain.setValueAtTime(G*((aa&15)/15),t);src.connect(g);g.connect(c.destination);src.start(t)}
  if(src){const last=seq[seq.length-1][0]+1;stop(t0+last*VDC_FR)}}catch(e){}}

function joyPick(){const gps=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[];return gps.find(q=>q.connected)||null}

// The Odyssey2 joystick: eight directions, ONE button. Any button on the pad is that button; the stick is read as pure on/off, never analog.
function pollPad(){pad={};const gp=joyPick();
  if(!gp){if(joyId!==null){joyId=null;joyMsg={t:3.5,text:'JOYSTICK UNPLUGGED'};if(S.mode==='play')joyLost=true}return}
  if(joyId!==gp.index){joyId=gp.index;joyMsg={t:3.5,text:'JOYSTICK 1 PLUGGED IN'};joyLost=false;try{beep(300,.04,'square');setTimeout(()=>beep(420,.05,'square'),70)}catch(e){}}
  const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
  let x=gp.axes[0]||0,y=gp.axes[1]||0,L=b(14),R=b(15),U=b(12),D=b(13);
  const m=Math.hypot(x,y);if(m>.5){if(Math.abs(x)>.38*m){if(x<0)L=true;else R=true}if(Math.abs(y)>.38*m){if(y<0)U=true;else D=true}}
  const hat=gp.axes[9];if(gp.mapping!=='standard'&&hat!==undefined&&hat>=-1.01&&hat<=1.01){const i=Math.round((hat+1)*3.5);
    if([0,1,7].includes(i))U=true;if([1,2,3].includes(i))R=true;if([3,4,5].includes(i))D=true;if([5,6,7].includes(i))L=true}
  if(L&&!R)pad.left=1;if(R&&!L)pad.right=1;if(U&&!D)pad.up=1;if(D&&!U)pad.down=1;
  for(let i=0;i<8;i++)if(b(i))pad.fire=1;
  if(b(8)||b(9))pad.start=1}
