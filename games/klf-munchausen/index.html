let joyId=null,joyMsg=null,joyLost=false;
function joyPick(){const gps=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[];return gps.find(q=>q.connected)||null}

/* ENGINE² homage touch stick (shared by K.L.F. MÜNCHÄÜSËN, ALTURAS PETE TWO and SHOWDOWN IN 2026 A.D.; keys and real joysticks stay as the console had them).
   Digital like the console's stick. A touch on the stick starts from its centre; a touch anywhere else on the left side starts where the finger lands.
   The anchor trails the finger at TH px, so a short flick in a new direction (a turn, or a quick fake back) registers after about TH px of travel,
   wherever the thumb has drifted to. Diagonals only inside the middle 30 degrees between two axes, so straight pushes stay straight. */
const TH=9,TWAYS=4;   // maze game: one direction at a time (on the console a diagonal is a coin flip)
let tAnc=null,tDir='';
function tSet(d){tDir=d;touch.left=touch.right=touch.up=touch.down=0;for(const k of d.split('-'))if(k)touch[k]=1;
  const R=joyEl.getBoundingClientRect().width*.34,vx=(touch.right?1:0)-(touch.left?1:0),vy=(touch.down?1:0)-(touch.up?1:0),n=Math.hypot(vx,vy)||1;joyKnob.style.transform='translate('+vx/n*R+'px,'+vy/n*R+'px)'}
function joyMove(e){const x=e.clientX,y=e.clientY,dx=x-tAnc.x,dy=y-tAnc.y,m=Math.hypot(dx,dy);if(m<TH)return;
  const ax=Math.abs(dx),ay=Math.abs(dy),h=dx<0?'left':'right',v=dy<0?'up':'down';
  const d=(TWAYS===8&&Math.min(ax,ay)>.577*Math.max(ax,ay))?v+'-'+h:(ax>=ay?h:v);if(d!==tDir)tSet(d);
  tAnc.x=x-dx/m*TH;tAnc.y=y-dy/m*TH}
function joyStart(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  tAnc=Math.hypot(e.clientX-cx,e.clientY-cy)<=r.width/2?{x:cx,y:cy}:{x:e.clientX,y:e.clientY};tDir='';joyMove(e)}
function joyReset(){tJoyId=-1;tAnc=null;tDir='';joyKnob.style.transform='';touch.left=touch.right=touch.up=touch.down=0}
function joyZone(e){if(e.pointerType!=='touch'||!tOn||tJoyId!==-1)return false;if(e.target.closest&&e.target.closest('button'))return false;return e.clientX<innerWidth*.55}
