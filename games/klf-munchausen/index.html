// ------------------------------------------------------------------ draw

function drawBottom(nameCol){txt(String(hi).padStart(4,'0'),38,198,COL.hs);R(103,205,12,2,COL.arrow);R(111,201,2,10,COL.arrow);R(113,203,2,6,COL.arrow);

const KCS={left:'be6c78e0703c1e00',right:'7d361e070e3c7800',up:'81c3e7b7fe7c9000',down:'907cfeb7e7c38100',closed:'183c7eff7e3c1800',face:'815a3c5affbd423c'};

  for(let r=0;r<7;r++)txt('ABCDEFG'[r],26,31+24*r,b.L==='ABCDEFG'[r]?COL.white:COL.red);

// ------------------------------------------------------------------ gamepad (one-button joystick) and touch, as in ALTURAS PETE TWO / SHOWDOWN
let joyId=null,joyMsg=null,joyLost=false;
function joyPick(){const gps=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[];return gps.find(q=>q.connected)||null}
function pollPad(){pad={};const gp=joyPick();
  if(!gp){if(joyId!==null){joyId=null;joyMsg={t:210,text:'JOYSTICK UNPLUGGED'};if(S.mode==='play')joyLost=true}return}
  if(joyId!==gp.index){joyId=gp.index;joyMsg={t:210,text:'JOYSTICK 1 PLUGGED IN'};joyLost=false;sqSeq([[300,40],[420,50]],.05)}
  const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);let x=gp.axes[0]||0,y=gp.axes[1]||0,L=b(14),Rr=b(15),U=b(12),D=b(13);
  const m=Math.hypot(x,y);if(m>.5){if(Math.abs(x)>.38*m){if(x<0)L=true;else Rr=true}if(Math.abs(y)>.38*m){if(y<0)U=true;else D=true}}
  const hat=gp.axes[9];if(gp.mapping!=='standard'&&hat!==undefined&&hat>=-1.01&&hat<=1.01){const i=Math.round((hat+1)*3.5);if([0,1,7].includes(i))U=true;if([1,2,3].includes(i))Rr=true;if([3,4,5].includes(i))D=true;if([5,6,7].includes(i))L=true}
  if(L&&!Rr)pad.left=1;if(Rr&&!L)pad.right=1;if(U&&!D)pad.up=1;if(D&&!U)pad.down=1;for(let i=0;i<8;i++)if(b(i))pad.fire=1;if(b(8)||b(9))pad.start=1}
addEventListener('keydown',()=>{joyLost=false});
let tOn=false,tPaused=false,tJoyId=-1,tFireId=-1,playBtn=null;const tuiEl=document.getElementById('tui'),joyEl=document.getElementById('joy'),joyKnob=joyEl.querySelector('.jk');let tPauseBtn=null;

function tDirs(dx,dy,Rr){touch.left=touch.right=touch.up=touch.down=0;const d=Math.hypot(dx,dy);if(d>Rr*.35){if(Math.abs(dx)>.38*d){if(dx<0)touch.left=1;else touch.right=1}if(Math.abs(dy)>.38*d){if(dy<0)touch.up=1;else touch.down=1}}}
function joyMove(e){const r=joyEl.getBoundingClientRect(),Rr=r.width*.34;let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=Math.hypot(dx,dy);const kx=m>Rr?dx*Rr/m:dx,ky=m>Rr?dy*Rr/m:dy;joyKnob.style.transform='translate('+kx+'px,'+ky+'px)';tDirs(dx,dy,Rr)}
function joyReset(){tJoyId=-1;joyKnob.style.transform='';touch.left=touch.right=touch.up=touch.down=0}

// ------------------------------------------------------------------ main loop: fixed 60 steps per second
function tick(){if(S.mode==='boot')stepBoot();else if(S.mode==='cover')updateCover();else if(S.mode==='select')updateSelect();
  else if(S.mode==='play'){if(typed.includes('ESC')||edge('start')){S.mode='select';S.selT=0;selectBleep()}else update()}else if(S.mode==='name')updateName();else if(S.mode==='builder')updateBuilder();
  typed=[];prev={};for(const n of ['left','right','up','down','fire','start'])prev[n]=!!press(n)}

  if(tPaused||joyLost)acc=0;let n=0;while(acc>=1/60&&n<4){acc-=1/60;tick();n++}
