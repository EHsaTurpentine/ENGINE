// A hit: the shooter's kill count goes up (a ricochet that kills its own shooter counts for the opponent).
function landPlayerHit(shooter, victim, bullet, isMelee) {
  const selfShot = !!(bullet && bullet.owner === victim);
  const rel = bullet ? (bullet.y + BULLET_SIZE / 2 - players[victim].y) : 99;
  const head = !selfShot && rel < HEAD_ROWS;                 // bullet centre in the hat/head rows
  hitHead = head;
  scores[shooter] += 1;
  kd[shooter] += 1;
  if (mode === 1) { careerKD[shooter === 0 ? 0 : 1] += 1; saveKD(); }
  roundHits += 1;
  struck[victim] = true;
  players[victim].anim.hitT = 0;          // start the spin-and-fall animation
  if (variant === 'arcade') {
    lives[victim] = Math.max(0, lives[victim] - 1);
    awardPoints(shooter, victim, bullet);
  }
  if (isMelee) {
    const fin = !!melee.fin, bonus = fin ? 10000 : 1000;
    if (!fin) sfx('superkill');
    else { resetBullets(); if (variant === 'classic') scores[shooter] = Math.max(scores[shooter], KILLS_TO_WIN); else lives[victim] = 0; }
    if (variant === 'arcade') { addPoints(shooter, bonus); popups.push({ x: players[victim].x - 14, y: players[victim].y - 10, text: '+' + bonus, age: 0, color: '#ffd23f' }); }
  } else if (head) {
    headshots[shooter] += 1;
    if (shooter === 0) { careerHeads += 1; try { localStorage.setItem(HEADS_KEY, String(careerHeads)); } catch (e) { /* ignore */ } }
    popups.push({ x: players[victim].x - 14, y: players[victim].y - 2, text: 'HEADSHOT', age: 0, color: '#ffd23f' });
    if (variant === 'classic') {
      const r = (bullet && bullet.ric) || 0;
      trick = { line1: 'HEADSHOT!', line2: r > 0 ? r + (r > 1 ? ' BOUNCES' : ' BOUNCE') : 'CLEAN SHOT', age: 0, owner: shooter };
    }
    sfx('headshot');
  } else sfx('hit');

}

function loadHiScore() {

function updatePopups() {            // render-frame driven

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// ------------------------------------------------------------------
// Stage 2 logic — bullets: fire, move, edge bounce, horizontal death
// ------------------------------------------------------------------
// Aim rule: shots always leave STRAIGHT across (dy = 0). Only ricochets change a
// bullet's path: block deflections take their angle from the velocity table
// ([ROM]: a bullet touching an obstacle is re-aimed from the table), and a
// bullet that has been deflected off-axis then bounces off the top/bottom edges.
// The stick (up/down) moves the figure but does not change the shot angle.
const BULLET_STRAIGHT = { dx: BULLET_ANGLES[3].dx, dy: 0 };   // 3 px/step, level

function pickAimAngle(index, ctrl) {
  return BULLET_STRAIGHT;
}

function tryFire(index, ctrl) {
  let slot = null;
  for (let i = 0; i < bullets.length; i++) {
    if (!bullets[i].live) { slot = bullets[i]; break; }
  }
  if (slot === null) return;   // all 4 slots busy: this press is ignored
  const p = players[index];
  if (variant === 'classic' && ammo[index] <= 0) {      // empty: dry click (rate-limited)
    if (!(p.anim.dryT > 0)) { sfx('click'); p.anim.dryT = 18; }
    return;
  }
  if (variant === 'classic') ammo[index] -= 1;
  const angle = pickAimAngle(index, ctrl);
  slot.live = true;
  slot.owner = index;                                 // Stage 3: who fired it (SELF_HIT check)
  slot.lastObs = -1;                                  // Stage 3: obstacle re-trigger guard
  slot.obsCd = 0;
  slot.ric = 0;                                       // Stage 6: ricochet counter (display-only)
  slot.tree = 0;                                      // arcade: tree ricochets (each doubles the points)
  slot.dx = (index === 0) ? angle.dx : -angle.dx;      // P1 right, P2 left (straight across)
  slot.dy = angle.dy;
  slot.x = (index === 0) ? p.x + FIG_W : p.x - BULLET_SIZE;  // shooter's gun side
  slot.y = p.y + Math.round((FIG_H - BULLET_SIZE) / 2);      // figure mid-height
  p.anim.fireTimer = 8;   // Stage 4: show figure_fire for 8 logic steps
  sfx('fire');            // Stage 7
}

function updateBullets() {
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    if (!b.live) continue;
    if (b.obsCd > 0) b.obsCd -= 1;                    // Stage 3: obstacle cooldown counts down
    b.x += b.dx;
    b.y += b.dy;
    // Bounce off the top/bottom edge: reverse dy, keep dx
    if (b.y < 0) {
      b.y = 0;
      b.dy = -b.dy;
      b.ric = (b.ric || 0) + 1;
      sfx('bounce');
    } else if (b.y > PLAYFIELD_H - BULLET_SIZE) {
      b.y = PLAYFIELD_H - BULLET_SIZE;
      b.dy = -b.dy;
      b.ric = (b.ric || 0) + 1;
      sfx('bounce');
    }
    if (colvin) shieldDeflect(b);                      // COLVIN MODE: riot shield bounces P2's bullets back, faster
    // Stage 3: deflect off scenery first; otherwise check the opposing figure
    if (!deflectOffObstacles(b)) {
      const victim = bulletHitPlayer(b);
      if (victim !== -1) {
        b.live = false;
        landPlayerHit(victim === b.owner ? 1 - b.owner : b.owner, victim, b);   // a self-hit scores for the opponent
      }
    }
    // Die when it leaves the playfield horizontally
    if (b.x < 0 || b.x > PLAYFIELD_W) b.live = false;
  }
}

// Stage 3: bullet vs scenery block. On overlap the bullet bounces horizontally
// (dx reversed) and its dy is taken from the BULLET_ANGLES row chosen by where
// it hit the block (top part -> up angle, bottom part -> down angle, middle ->
// shallow, keeping the incoming vertical direction). Obstacles are scenery:
// OBSTACLE_HP = Infinity, so they never disappear. A bullet cannot re-trigger
// the same block on the very next step (OBSTACLE_HIT_COOLDOWN).
// Returns true if the bullet deflected this step (player check skipped).
function deflectOffObstacles(b) {
  for (let i = 0; i < obstacles.length; i++) {
    if (b.lastObs === i && b.obsCd > 0) continue;     // still cooling off against this block
    const ob = obstacles[i];
    if (!rectsOverlap(b.x, b.y, BULLET_SIZE, BULLET_SIZE, ob.x, ob.y, OBSTACLE_W, OBSTACLE_H)) continue;
    const offset = (b.y + BULLET_SIZE / 2) - (ob.y + OBSTACLE_H / 2);   // hit point vs block center
    let idx;
    if (offset < -OBSTACLE_MID_BAND)      idx = OBSTACLE_ANGLE_UP;                    // top part
    else if (offset > OBSTACLE_MID_BAND)  idx = OBSTACLE_ANGLE_DOWN;                  // bottom part
    else                  idx = (b.dy < 0) ? OBSTACLE_ANGLE_SHAL_UP : OBSTACLE_ANGLE_SHAL_DN;
    b.dx = -b.dx;                                                    // horizontal bounce
    b.dy = BULLET_ANGLES[idx].dy;                                    // vertical speed from the table
    ob.hp -= 1;                                                      // Infinity: never actually dies
    obstacleHitCount += 1;
    treeFlashFrames = TREE_FLASH_FRAMES;                             // whole-screen flash in the tree's colour
    treeFlashColor = TREE_COLORS[ob.color % TREE_COLORS.length];
    b.ric = (b.ric || 0) + 1;
    b.tree = Math.min(TREE_DOUBLE_MAX, (b.tree || 0) + 1);
    if (variant === 'arcade') {
      popups.push({ x: Math.round(b.x) - 4, y: Math.round(b.y) + 12, text: 'X' + (1 << b.tree), age: 0, color: treeFlashColor });
      sfx('combo', b.tree);
    }
    sfx('deflect');
    b.lastObs = i;
    b.obsCd = OBSTACLE_HIT_COOLDOWN;
    if (ob.hp <= 0) obstacles.splice(i, 1);                          // unreachable while OBSTACLE_HP = Infinity
    return true;                                                     // deflect once per step
  }
  return false;
}

function drawGlyph(ch, x, y, color) {
  const rows = GLYPHS[ch];
  if (!rows) return;
  ctx.fillStyle = color;
  for (let r = 0; r < GLYPH_H; r++) {
    const row = rows[r];
    for (let c = 0; c < GLYPH_W; c++) {
      if (row[c] === '#') ctx.fillRect(x + c, y + r, 1, 1);
    }
  }
}

function drawGlyphLine(letters, x, y) {
  let cursor = x;
  for (const letter of letters) {

    cursor += GLYPH_ADV;
  }
}

function fillBlack() {

// Draws a struck cowboy mid-spin / lying down. Rotation is in exact quarter turns
// about the sprite centre, so the pixels stay crisp.
function drawStruckFigure(i) {
  const p = players[i];
  const T = p.anim.hitT;
  const u = Math.min(T, HIT_AIR_STEPS) / HIT_AIR_STEPS;           // 0..1 through the flight
  const lift = Math.round(HIT_AIR_HEIGHT * 4 * u * (1 - u));      // parabola: up then down
  const drift = Math.round((i === 0 ? -1 : 1) * HIT_DRIFT_PX * u);
  const landed = T >= HIT_AIR_STEPS;
  const quarter = landed ? 1 : (Math.floor(T / HIT_SPIN_STEPS) % 4);
  const cx = Math.max(8, Math.min(PLAYFIELD_W - 8, p.x + FIG_W / 2 + drift));
  const cy = p.y + FIG_H / 2 - lift;
  const img = spriteCache.figure_hit[i];
  ctx.save();
  ctx.translate(Math.round(cx), Math.round(cy));
  if (i === 1) ctx.scale(-1, 1);                                  // P2 faces left
  ctx.rotate(quarter * Math.PI / 2 * (i === 1 ? -1 : 1));
  ctx.drawImage(img, -FIG_W / 2, -FIG_H / 2);
  ctx.restore();
}

function updateTreeFlash() { if (treeFlashFrames > 0) treeFlashFrames -= 1; }

// Ammo bar: every bullet each player has, always visible (filled = in the magazine, hollow = spent)
function drawAmmo(x, y, count, color, rightAlign) {
  const bw = 3, gap = 2, total = AMMO_MAX * bw + (AMMO_MAX - 1) * gap;
  const x0 = rightAlign ? x - total : x;
  for (let i = 0; i < AMMO_MAX; i++) {

    const idx = rightAlign ? (AMMO_MAX - 1 - i) : i;

// HUD numbers: the same bold 2x glyphs (each drawn twice, 1 px apart) as the SELECT GAME title, so they are the biggest thing on screen.

  drawBigNum(k1, 3, 2, PLAYER_BODY[0], 13, false);
  drawBigNum(k2, PLAYFIELD_W - 3 - w2, 2, PLAYER_BODY[1], 13, false);
  drawAmmoMini(3 + w1 + 3, 4, ammo[0], PLAYER_BODY[0], false);
  drawAmmoMini(PLAYFIELD_W - 3 - w2 - 3 - 14, 4, ammo[1], PLAYER_BODY[1], true);
  const t = 'FIRST TO ' + KILLS_TO_WIN;
  drawText(t, Math.floor((PLAYFIELD_W - textWidth(t)) / 2), 3, COLOR.tan);
  drawText('ROUND ' + roundNumber, Math.floor((PLAYFIELD_W - textWidth('ROUND ' + roundNumber)) / 2), 13, '#3a6d73');
  ctx.fillStyle = COLOR.border;
  ctx.fillRect(0, HUD_H - 1, PLAYFIELD_W, 1);
}

function drawBanner() {
  if (roundState !== ROUND_READY) return;
  const text = (roundStateTimer <= DRAW_BANNER_STEPS) ? 'DRAW!' : 'ROUND ' + roundNumber;
  const w = textWidth(text);
  const x = Math.floor((PLAYFIELD_W - w) / 2), y = Math.floor((PLAYFIELD_H - GLYPH_H) / 2);
  ctx.fillStyle = COLOR.black;
  ctx.fillRect(x - 3, y - 3, w + 6, GLYPH_H + 6);
  drawText(text, x, y, COLOR.white);
  if (colvin) { const cm = 'COLVIN MODE', cw = textWidth(cm); ctx.fillStyle = COLOR.black; ctx.fillRect(Math.floor((PLAYFIELD_W - cw) / 2) - 3, y - 17, cw + 6, GLYPH_H + 6); drawText(cm, Math.floor((PLAYFIELD_W - cw) / 2), y - 14, (roundStateTimer >> 3) & 1 ? '#ff2a2a' : COLOR.white); }
}

function drawPopups() {
  for (let i = 0; i < popups.length; i++) {
    const p = popups[i];
    const w = textWidth(p.text);
    const x = Math.max(1, Math.min(PLAYFIELD_W - w - 1, Math.round(p.x + FIG_W / 2 - w / 2)));
    drawText(p.text, x, Math.round(p.y - 9 - p.age * POPUP_RISE_PX), p.color || COLOR.white);
  }
}

// GAME OVER overlay (and the STAGE CLEAR overlay)
function centerBox(lines, h) {
  const y = Math.floor((PLAYFIELD_H - h) / 2);
  ctx.fillStyle = COLOR.black;
  ctx.fillRect(Math.floor((PLAYFIELD_W - 104) / 2), y - 4, 104, h + 8);
  lines.forEach(function (l, i) { drawText(l.t, Math.floor((PLAYFIELD_W - textWidth(l.t)) / 2), y + i * 11, l.c); });
}

function drawMatchOverClassic() {
  const who = (winningIndex === 0 && p1Name) ? p1Name + ' WINS' : ((mode === 1) ? (winningIndex === 0 ? 'YOU WIN' : 'PLAYER 2 WINS') : 'P' + (winningIndex + 1) + ' WINS');
  centerBox([{ t: 'MATCH OVER', c: COLOR.white },
             { t: who, c: PLAYER_BODY[winningIndex] },
             { t: scores[0] + ' - ' + scores[1], c: COLOR.cyan }], 29);
}

function drawBullets() {
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    if (!b.live) continue;
    drawSprite('bullet', b.x, b.y, {});
  }
}

const BOOT_CART_X = 38, BOOT_CONS_X = 4, BOOT_CONS_Y = 140, BOOT_SLOT_Y = 145;
function drawBootCart(cy) {
  ctx.drawImage(bootDecode('cart'), BOOT_CART_X, Math.round(cy));
}

function drawBootConsole(press) {
  ctx.drawImage(bootDecode('cons'), BOOT_CONS_X, BOOT_CONS_Y);
  // fat red POWER button on the front lip
  const bx = 18, by = 145 + (press ? 2 : 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(bootDecode('btn'), bx, by, 18, 19);

}

function drawBootFinger(ft) {
  const fx = 27;
  // arm / sleeve (comes from above)
  R(fx - 14, ft - 160, 28, 90, '#111'); R(fx - 13, ft - 160, 26, 90, '#3558b0'); R(fx - 13, ft - 160, 4, 90, '#4a73d8');
  R(fx - 14, ft - 72, 28, 4, '#111'); R(fx - 13, ft - 72, 26, 3, '#e8e8f0');      // cuff
  // hand
  R(fx - 13, ft - 70, 26, 30, '#111'); R(fx - 12, ft - 70, 24, 29, '#f0b890'); R(fx + 8, ft - 70, 4, 29, '#d89868');
  R(fx - 20, ft - 62, 9, 12, '#111'); R(fx - 19, ft - 61, 8, 10, '#f0b890');      // thumb
  // pointing finger
  R(fx - 7, ft - 44, 14, 44, '#111');
  R(fx - 5, ft - 1, 10, 2, '#111');
  R(fx - 6, ft - 44, 12, 43, '#f0b890'); R(fx - 4, ft - 1, 8, 1, '#f0b890');
  R(fx + 3, ft - 44, 3, 43, '#d89868');
  R(fx - 3, ft - 12, 6, 8, '#fbe3d0');                                              // nail

}

function drawBoot() {
  R(0, 0, PLAYFIELD_W, TOTAL_H, '#ffffff');
  const t = bootT;
  let shake = 0;
  if (t >= 108 && t < 124) shake = (124 - t) / 8;
  ctx.save();
  if (shake) ctx.translate(Math.round((Math.random() - 0.5) * 2 * shake), Math.round((Math.random() - 0.5) * shake));
  // console
  const pressed = t >= BOOT_T_PRESS && t < BOOT_T_PRESS + 26;
  drawBootConsole(pressed);
  // cartridge (clipped by the deck so its lower part is inside the slot)
  let cy;
  if (t < 20) cy = -130;
  else if (t < 80) cy = -130 + 140 * bootEase((t - 20) / 60);
  else if (t < BOOT_T_SLAM) cy = 10 + Math.sin(t * 0.5) * 2;
  else if (t < 108) { const k = (t - BOOT_T_SLAM) / 8; cy = 10 + 58 * k * k; }

  ctx.beginPath(); ctx.rect(0, 0, PLAYFIELD_W, BOOT_SLOT_Y); ctx.clip();
  drawBootCart(cy);
  ctx.restore();
  // finger
  if (t >= 128 && t < 224) {
    let ft;
    if (t < BOOT_T_PRESS - 6) ft = -40 + (147 + 40) * bootEase((t - 128) / 38);
    else if (t < BOOT_T_PRESS) ft = 147;
    else if (t < BOOT_T_PRESS + 26) ft = 149;
    else ft = 149 - (t - (BOOT_T_PRESS + 26)) * 5;
    drawBootFinger(Math.round(ft));
  }
  // dust
  for (const d of bootDust) R(d.x, d.y, 2, 2, d.l > 8 ? '#9a9aa4' : '#c9c9d0');
  ctx.restore();
  // power-on: CRT iris closes to a line, then opens onto SELECT GAME
  if (t >= BOOT_T_POWER) {
    const k = Math.min(1, (t - BOOT_T_POWER) / 20);
    const half = Math.round((TOTAL_H / 2) * (1 - bootEase(k)));
    R(0, 0, PLAYFIELD_W, TOTAL_H / 2 - half, '#000'); R(0, TOTAL_H / 2 + half, PLAYFIELD_W, TOTAL_H / 2 - half, '#000');
    if (k > 0.85) R(0, TOTAL_H / 2 - 1, PLAYFIELD_W, 2, '#fff');
  }
}

const HS_REPLAY_TIMEOUT_STEPS = 1800;

function startReplay() {
  musicStop();
  hs.t = 0;
  screen = SCREEN_HISCORE;
}

function updateReplay() {
  hs.t += 1;
  const k = keysPressedThisStep;
  if (hs.t <= 20) return;
  if (k.has('KeyK') && reelAvailable()) { enterReel(); return; }
  if (k.has('Digit1') || k.has('Numpad1') || k.has('Enter') || k.has('NumpadEnter') || k.has('Space') || padEdge.a || padEdge.start) { sfx('select'); startGame(mode); }
  else if (arcadeUnlocked && (k.has('Digit3') || k.has('Numpad3'))) { sfx('select'); startGame(1, 'arcade'); }
  else if (k.has('Digit2') || k.has('Numpad2') || k.has('Escape') || k.has('Backspace') || padEdge.b || hs.t > HS_REPLAY_TIMEOUT_STEPS) setScreen(SCREEN_SELECT);
}

// Arcade: HIGH SCORE registry (top 8, initials) + REPLAY GAME? screen
// ------------------------------------------------------------------
let hsTable = [];
const hs = { phase: 'TABLE', cands: [], ci: 0, letters: [0, 0, 0], pos: 0, t: 0, entry: null, upPrev: false, downPrev: false };
const HS_DEFAULTS = [['ENG', 8000], ['ODY', 6000], ['MAG', 4000], ['RIC', 2500], ['TRE', 1500], ['DRW', 1000], ['HAT', 600], ['COW', 300]];
const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

function loadTable() {
  hsTable = [];
  try {
    const j = JSON.parse(localStorage.getItem(HS_KEY));
    if (Array.isArray(j)) hsTable = j.filter(function (e) { return e && typeof e.s === 'number' && typeof e.n === 'string'; }).slice(0, HS_ROWS);
  } catch (e) { hsTable = []; }
  if (hsTable.length === 0) hsTable = HS_DEFAULTS.map(function (d) { return { n: d[0], s: d[1], m: 0 }; });
  hsTable.sort(function (a, b) { return b.s - a.s; });
  if (hsTable[0].s > hiScore) hiScore = hsTable[0].s;
}
function saveTable() { try { localStorage.setItem(HS_KEY, JSON.stringify(hsTable)); } catch (e) { /* blocked */ } }
function qualifies(v) { return v > 0 && (hsTable.length < HS_ROWS || v > hsTable[hsTable.length - 1].s); }

function startHiscore() {
  musicStop();
  hs.cands = [];
  const n = (mode === 1) ? 1 : 2;
  for (let i = 0; i < n; i++) if (qualifies(points[i])) hs.cands.push(i);
  hs.ci = 0; hs.letters = [0, 0, 0]; hs.pos = 0; hs.t = 0; hs.entry = null;
  hs.phase = hs.cands.length ? 'INIT' : 'TABLE';
  screen = SCREEN_HISCORE;
  if (hs.phase === 'INIT') sfx('win');
}

function hsAdvanceCandidate() {
  hs.ci += 1;
  hs.letters = [0, 0, 0]; hs.pos = 0;
  while (hs.ci < hs.cands.length && !qualifies(points[hs.cands[hs.ci]])) hs.ci += 1;
  if (hs.ci >= hs.cands.length) { hs.phase = 'TABLE'; hs.t = 0; }
}

function updateHiscoreA() {
  hs.t += 1;
  const k = keysPressedThisStep;
  const pad = pads[0];
  const padUp = !!(pad && pad.up), padDown = !!(pad && pad.down);
  const up = k.has('ArrowUp') || k.has('KeyW') || (padUp && !hs.upPrev);
  const down = k.has('ArrowDown') || k.has('KeyS') || (padDown && !hs.downPrev);
  hs.upPrev = padUp; hs.downPrev = padDown;
  const confirm = k.has('Enter') || k.has('NumpadEnter') || k.has('Space') || padEdge.a || padEdge.start;
  if (hs.phase === 'INIT') {
    if (up) { hs.letters[hs.pos] = (hs.letters[hs.pos] + 1) % 26; sfx('bounce'); }
    if (down) { hs.letters[hs.pos] = (hs.letters[hs.pos] + 25) % 26; sfx('bounce'); }
    if (k.has('ArrowRight') || k.has('KeyD')) { if (hs.pos < 2) hs.pos += 1; }
    if (k.has('ArrowLeft') || k.has('KeyA') || k.has('Backspace') || padEdge.b) { if (hs.pos > 0) hs.pos -= 1; }
    if (confirm) {
      if (hs.pos < 2) { hs.pos += 1; sfx('select'); }
      else {
        const who = hs.cands[hs.ci];
        const entry = { n: hs.letters.map(function (i) { return ALPHA[i]; }).join(''), s: points[who], m: mode };
        let at = hsTable.findIndex(function (e) { return e.s < entry.s; });
        if (at < 0) at = hsTable.length;
        hsTable.splice(at, 0, entry);
        hsTable.length = Math.min(hsTable.length, HS_ROWS);
        hs.entry = entry;
        saveTable();
        if (entry.s > hiScore) hiScore = entry.s;
        sfx('win');
        hsAdvanceCandidate();
      }
    }
  } else {
    if (hs.t > 20) {
      if (k.has('KeyK') && reelAvailable()) { enterReel(); return; }
      if (k.has('Digit1') || k.has('Numpad1') || k.has('Enter') || k.has('NumpadEnter') || k.has('Space') || padEdge.a || padEdge.start) { sfx('select'); startGame(mode); }
      else if (k.has('Digit2') || k.has('Numpad2') || k.has('Escape') || k.has('Backspace') || padEdge.b || hs.t > HS_REPLAY_TIMEOUT) { setScreen(SCREEN_SELECT); }
    }
  }
}

function drawGlyphScaled(ch, x, y, color, sc) {
  const rows = GLYPHS[ch]; if (!rows) return;
  ctx.fillStyle = color;
  for (let r = 0; r < GLYPH_H; r++) for (let c = 0; c < GLYPH_W; c++) if (rows[r][c] === '#') ctx.fillRect(x + c * sc, y + r * sc, sc, sc);
}

function drawCenter(t, y, col) { drawText(t, Math.floor((PLAYFIELD_W - textWidth(t)) / 2), y, col); }

function drawHiscoreA() {
  fillBlack();
  // rainbow title
  const title = 'HIGH SCORES';
  const tx = Math.floor((PLAYFIELD_W - textWidth(title)) / 2);
  for (let i = 0; i < title.length; i++) if (title[i] !== ' ') drawGlyph(title[i], tx + i * GLYPH_ADV, 8, TREE_COLORS[(i + Math.floor(hs.t / 6)) % TREE_COLORS.length]);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(10, 19, PLAYFIELD_W - 20, 1);
  const blink = (Math.floor(hs.t / 15) % 2 === 0);
  const top = (hs.phase === 'INIT') ? 108 : 26;
  const gap = (hs.phase === 'INIT') ? 9 : 12;
  for (let i = 0; i < hsTable.length; i++) {
    const e = hsTable[i];
    const mine = (e === hs.entry);
    const col = mine ? (blink ? '#ffd23f' : COLOR.white) : (i < 3 ? '#ffd23f' : (i < 6 ? '#e8e8e8' : '#9a9a9a'));
    const line = (i + 1) + ' ' + e.n + ' ' + pad5(e.s);
    drawText(line, Math.floor((PLAYFIELD_W - textWidth(line)) / 2), top + i * gap, col);
  }
  if (hs.phase === 'INIT') {
    const who = hs.cands[hs.ci];
    const pc = PLAYER_BODY[who];
    drawCenter(((who === 0 && p1Name) ? p1Name : (mode === 1 ? 'YOU' : 'P' + (who + 1))) + ' NEW HIGH SCORE', 26, pc);
    drawCenter(pad5(points[who]), 37, COLOR.white);
    drawCenter('ENTER YOUR INITIALS', 50, COLOR.cyan);

  if (pc.head) add(5, 'HATS OFF', 'BETWEEN THE EYES');

    else drawCenter((reel.order.length > 1 ? '#' + (reel.order.length - reel.cur) + ' OF TOP ' + reel.order.length : 'BEST KILL') + ' BY ' + who, sy + 3, PLAYER_BODY[c.owner]);
    drawCenter(touch.enabled ? 'TAP ARROWS FOR CLIPS' : 'ARROWS CLIP  S ' + (reel.mode === 'deaths' ? 'KILLS' : 'DEATHS'), sy + 13, COLOR.cyan);
    drawCenter(reel.msgT > 0 ? reel.msg : (touch.enabled ? 'SAVE GIF OR VIDEO BELOW' : 'D GIF  V VIDEO  ESC EXIT'), sy + 23, reel.msgT > 0 ? '#ffd23f' : COLOR.cyan);
  }
}

// ---- save the reel as a video (records the canvas while the whole reel plays) ----
function reelVideoFrame() {
  if (!reel.vctx) return;
  const c = reel.vctx, k = GIF_SCALE;
  c.fillStyle = '#000'; c.fillRect(0, 0, reel.vc.width, reel.vc.height);
  c.drawImage(gameCanvas, -Math.round(reel.sx) * k, -Math.round(reel.sy) * k, PLAYFIELD_W * k, TOTAL_H * k);
}

function reelStartVideoExport() {
  reel.kind = 'video';
  if (!window.MediaRecorder) { reel.msg = 'SAVE NEEDS CHROME'; reel.msgT = 180; return; }
  try {
    // record the clean game picture at an exact 3x (480x672), not the full-resolution CRT canvas: far smaller files
    const vc = document.createElement('canvas'); vc.width = PLAYFIELD_W * GIF_SCALE; vc.height = TOTAL_H * GIF_SCALE;
    vc.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1';
    document.body.appendChild(vc);                           // Safari only records canvases that are in the page
    reel.vc = vc; reel.vctx = vc.getContext('2d'); reel.vctx.imageSmoothingEnabled = false;
    reelVideoFrame();
    const stream = vc.captureStream(30);
    if (audioCtx && audioMaster && audioCtx.createMediaStreamDestination) {
      reel.dest = audioCtx.createMediaStreamDestination();
      audioMaster.connect(reel.dest);
      reel.dest.stream.getAudioTracks().forEach(function (t) { stream.addTrack(t); });
    }
    // MP4 (H.264) first where the browser can record it; otherwise WebM
    const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9', 'video/webm'];
    let mt = ''; for (let i = 0; i < types.length; i++) if (MediaRecorder.isTypeSupported(types[i])) { mt = types[i]; break; }
    reel.chunks = [];
    reel.ext = (mt.indexOf('mp4') >= 0) ? 'mp4' : 'webm';
    reel.mime = reel.ext === 'mp4' ? 'video/mp4' : 'video/webm';
    reel.rec = new MediaRecorder(stream, mt ? { mimeType: mt, videoBitsPerSecond: 2000000 } : { videoBitsPerSecond: 2000000 });
    reel.rec.ondataavailable = function (e) { if (e.data && e.data.size) reel.chunks.push(e.data); };
    reel.rec.onstop = function () {
      if (reel.discard) { reel.discard = false; return; }
      const blob = new Blob(reel.chunks, { type: reel.mime });
      if (blob.size < 2000) { reel.msg = 'VIDEO FAILED - TRY SAVE GIF'; reel.msgT = 300; return; }   // empty recording: say so instead of saving a dud
      const how = deliverFile(blob, 'SHOWDOWN_TOP_' + reel.order.length + '_' + reelNoun() + '.' + reel.ext); saveDone('video', how);
      reel.msg = (how === 'share') ? 'TAP SAVE BUTTON TO KEEP IT' : 'SAVED VIDEO TO DOWNLOADS'; reel.msgT = 260;
    };
    reel.title0 = document.title; document.title = 'REC - SAVING KILL REEL';
    reel.exporting = true; reel.discard = false;
    reelStartClip(0);
    reel.rec.onerror = function () { reel.msg = 'VIDEO FAILED - TRY SAVE GIF'; reel.msgT = 300; try { reelStopExport(true); } catch (e2) { /* ignore */ } };
    reel.rec.start(250);
  } catch (e) { reel.exporting = false; reel.msg = 'SAVE FAILED'; reel.msgT = 180; }
}


// ------------------------------------------------------------------
// GIF export (built-in encoder, no libraries): captures the clean game picture at 25 fps while the
// reel plays, keeps only what changes between frames, and writes a looping GIF.
// ------------------------------------------------------------------
const GIF_SCALE = 3;                 // 160x224 -> 480x672
const GIF_MIN_MS = 40;               // 25 fps
const gifCap = { on: false, frames: [], times: [], pal: [], map: new Map(), cache: new Map(), last: 0, tmp: null, tctx: null };

function gifColorIndex(r, g, b) {
  const key = (r << 16) | (g << 8) | b;
  let i = gifCap.map.get(key);
  if (i !== undefined) return i;
  if (gifCap.pal.length < 255) { gifCap.pal.push([r, g, b]); i = gifCap.pal.length; gifCap.map.set(key, i); return i; }   // index 0 is the transparent slot
  i = gifCap.cache.get(key);
  if (i !== undefined) return i;
  let best = 1, bd = 1e9;
  for (let k = 0; k < gifCap.pal.length; k++) {
    const q = gifCap.pal[k], dr = q[0] - r, dg = q[1] - g, db = q[2] - b, d = dr * dr + dg * dg + db * db;
    if (d < bd) { bd = d; best = k + 1; }
  }
  gifCap.cache.set(key, best);
  return best;
}

function gifBegin() {
  gifCap.frames = []; gifCap.times = []; gifCap.pal = []; gifCap.map = new Map(); gifCap.cache = new Map(); gifCap.last = 0;
  if (!gifCap.tmp) { gifCap.tmp = document.createElement('canvas'); gifCap.tmp.width = PLAYFIELD_W; gifCap.tmp.height = TOTAL_H; gifCap.tctx = gifCap.tmp.getContext('2d', { willReadFrequently: true }); }
  gifCap.on = true;
}

// called every render frame while a GIF export is running (after the game picture is drawn)
function gifCapture() {
  if (!gifCap.on) return;
  const now = performance.now();
  if (gifCap.last && now - gifCap.last < GIF_MIN_MS) return;
  gifCap.last = now;
  const t = gifCap.tctx;
  t.fillStyle = '#000'; t.fillRect(0, 0, PLAYFIELD_W, TOTAL_H);
  t.drawImage(gameCanvas, -Math.round(reel.sx), -Math.round(reel.sy));          // keeps the camera shake in the GIF
  const d = t.getImageData(0, 0, PLAYFIELD_W, TOTAL_H).data;
  const px = new Uint8Array(PLAYFIELD_W * TOTAL_H);
  for (let i = 0, j = 0; i < px.length; i++, j += 4) px[i] = gifColorIndex(d[j], d[j + 1], d[j + 2]);
  gifCap.frames.push(px); gifCap.times.push(now);
}

function gifLzw(px, out) {            // px: Uint8Array of palette indices; appends LZW sub-blocks to out (array)
  const CLEAR = 256, EOI = 257;
  let codeSize = 9, maxcode = 511, next = 258, dict = new Map();
  let cur = 0, bits = 0; const bytes = [];
  function emit(code) { cur |= code << bits; bits += codeSize; while (bits >= 8) { bytes.push(cur & 255); cur >>>= 8; bits -= 8; } }
  function bump() { if (next > maxcode && codeSize < 12) { codeSize++; maxcode = (1 << codeSize) - 1; } }
  emit(CLEAR);
  let prefix = px[0];
  for (let i = 1; i < px.length; i++) {
    const c = px[i], key = (prefix << 8) | c, v = dict.get(key);
    if (v !== undefined) { prefix = v; continue; }
    emit(prefix); bump();
    if (next < 4096) dict.set(key, next++);
    else { emit(CLEAR); dict.clear(); next = 258; codeSize = 9; maxcode = 511; }
    prefix = c;
  }
  emit(prefix); bump(); emit(EOI);
  if (bits > 0) bytes.push(cur & 255);
  out.push(8);                                         // LZW minimum code size
  for (let i = 0; i < bytes.length; i += 255) {
    const n = Math.min(255, bytes.length - i);
    out.push(n);
    for (let k = 0; k < n; k++) out.push(bytes[i + k]);
  }
  out.push(0);
}

function gifEncode() {
  const W = PLAYFIELD_W, H = TOTAL_H, S = GIF_SCALE, frames = gifCap.frames, times = gifCap.times;
  const out = [];
  const w16 = function (v) { out.push(v & 255, (v >> 8) & 255); };
  'GIF89a'.split('').forEach(function (ch) { out.push(ch.charCodeAt(0)); });
  w16(W * S); w16(H * S);
  out.push(0xF7, 0, 0);                                // global colour table, 256 entries
  out.push(0, 0, 0);                                   // index 0: transparent slot
  for (let i = 0; i < 255; i++) { const c = gifCap.pal[i] || [0, 0, 0]; out.push(c[0], c[1], c[2]); }
  out.push(0x21, 0xFF, 0x0B); 'NETSCAPE2.0'.split('').forEach(function (ch) { out.push(ch.charCodeAt(0)); });
  out.push(3, 1, 0, 0, 0);                             // loop forever
  for (let f = 0; f < frames.length; f++) {
    const cur = frames[f], prev = f ? frames[f - 1] : null;
    let x0 = 0, y0 = 0, x1 = W - 1, y1 = H - 1;
    if (prev) {                                        // bounding box of what changed
      x0 = W; y0 = H; x1 = -1; y1 = -1;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (cur[y * W + x] !== prev[y * W + x]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      if (x1 < 0) { x0 = 0; y0 = 0; x1 = 0; y1 = 0; }
    }
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    const sw = bw * S, sh = bh * S, pix = new Uint8Array(sw * sh);
    for (let y = 0; y < bh; y++) {
      for (let x = 0; x < bw; x++) {
        const i = (y0 + y) * W + (x0 + x);
        const v = (prev && cur[i] === prev[i]) ? 0 : cur[i];          // unchanged pixel -> transparent
        for (let sy = 0; sy < S; sy++) { const row = (y * S + sy) * sw + x * S; for (let sx = 0; sx < S; sx++) pix[row + sx] = v; }
      }
    }
    const dt = (f + 1 < times.length) ? times[f + 1] - times[f] : 700;
    const delay = Math.max(2, Math.round(dt / 10));
    out.push(0x21, 0xF9, 4, 0x05, delay & 255, (delay >> 8) & 255, 0, 0);   // keep previous frame, index 0 transparent
    out.push(0x2C); w16(x0 * S); w16(y0 * S); w16(sw); w16(sh); out.push(0);
    gifLzw(pix, out);
  }
  out.push(0x3B);
  return new Blob([new Uint8Array(out)], { type: 'image/gif' });
}

function gifFinish() {
  gifCap.on = false;
  reel.exporting = false; reel.encoding = true;
  reel.msg = 'MAKING GIF...'; reel.msgT = 9999; reel.kind = 'gif';
  setTimeout(function () {                              // let the screen show the message first
    try {
      const blob = gifEncode();
      const how = deliverFile(blob, 'SHOWDOWN_TOP_' + reel.order.length + '_' + reelNoun() + '.gif'); saveDone('gif', how);
      reel.msg = (how === 'share') ? 'TAP SAVE BUTTON TO KEEP IT' : 'SAVED GIF TO DOWNLOADS'; reel.msgT = 260;
    } catch (e) {
      reel.msg = 'GIF FAILED'; reel.msgT = 200;
      reel.encoding = false; gifCap.frames = [];
      reelStartVideoExport();                           // fallback: MP4, then WebM
      return;
    }
    reel.encoding = false; gifCap.frames = []; gifCap.times = [];
    if (reel.title0) document.title = reel.title0;
    reelStartClip(0); reel.pos = reel.order[0].frames.length;
  }, 80);
}

function reelStartExport() {
  try { gifBegin(); }
  catch (e) { reelStartVideoExport(); return; }       // GIF can't run here -> video
  reel.kind = 'gif';
  reel.title0 = reel.title0 || document.title; document.title = 'REC - SAVING KILL REEL';
  reel.exporting = true;
  reelStartClip(0);
}

function reelStopExport(discard) {
  if (reel.kind === 'gif' && gifCap.on) {
    if (discard) { gifCap.on = false; gifCap.frames = []; reel.exporting = false; if (reel.title0) document.title = reel.title0; }
    else gifFinish();
    return;
  }
  reelStopRecording(discard);
}

function reelStopRecording(discard) {
  reel.discard = !!discard;
  try { if (reel.rec && reel.rec.state !== 'inactive') reel.rec.stop(); } catch (e) { /* ignore */ }
  try { if (reel.dest && audioMaster) audioMaster.disconnect(reel.dest); } catch (e) { /* ignore */ }
  reel.dest = null; reel.exporting = false; reel.vctx = null; if (reel.vc && reel.vc.parentNode) reel.vc.parentNode.removeChild(reel.vc); reel.vc = null;
  if (reel.title0) document.title = reel.title0;
  if (!discard) { reel.msg = 'SAVED REEL TO DOWNLOADS'; reel.msgT = 240; reelStartClip(0); reel.pos = reel.order[0].frames.length; }
}

function update() {
  pollGamepads();
  if (screen === SCREEN_BOOT) updateBoot();
  else if (screen === SCREEN_TITLE) updateTitle();
  else if (screen === SCREEN_HISCORE) updateHiscore();
  else if (screen === SCREEN_SELECT) updateSelect();
  else if (screen === SCREEN_CONTROLS) updateControls();
  else if (screen === SCREEN_PLAY) { updatePlay(); recordStep(); }
  else if (screen === SCREEN_REEL) updateReel();
  // Reset to the SELECT GAME screen, like the console powering up
  if (screen !== SCREEN_BOOT && screen !== SCREEN_TITLE && screen !== SCREEN_REEL && !(screen === SCREEN_HISCORE && variant === 'arcade' && hs.phase === 'INIT') && ((keysPressedThisStep.has('KeyR') && !(screen === SCREEN_CONTROLS && ctl.editing)) || padEdge.back)) setScreen(SCREEN_SELECT);
  keysPressedThisStep.clear();
}

function draw() {
  if (screen === SCREEN_BOOT) drawBoot();
  else if (screen === SCREEN_TITLE) drawTitle();
  else if (screen === SCREEN_HISCORE) drawHiscore();
  else if (screen === SCREEN_SELECT) drawSelect();
  else if (screen === SCREEN_CONTROLS) drawControls();
  else if (screen === SCREEN_PLAY) drawPlay();
  else if (screen === SCREEN_REEL) drawReel();
  if (bootOpenT > 0 && (screen === SCREEN_SELECT || screen === SCREEN_TITLE)) {      // CRT opens back out after power-on
    const half = Math.round((TOTAL_H / 2) * (bootOpenT / 12));
    R(0, 0, PLAYFIELD_W, half, '#000'); R(0, TOTAL_H - half, PLAYFIELD_W, half, '#000');
  }
}

let lastTime = 0;
let accumulator = 0;
function loop(now) {
  if (lastTime === 0) lastTime = now;
  let frameMs = now - lastTime;
  lastTime = now;
  if (frameMs > 250) frameMs = 250;          // avoid spiral of death after tab switch
  accumulator += frameMs;
  if (touch.paused) accumulator = 0;           // touch pause: the game logic stands still
  else while (accumulator >= STEP_MS) {
    update();
    accumulator -= STEP_MS;
  }
  draw();
  touchUIUpdate();
  saveUIUpdate();
  if (gifCap.on) gifCapture();
  if (reel.vctx) reelVideoFrame();
  if (bootOpenT > 0) bootOpenT -= 1;
  updateTreeFlash();   // tree-shot screen flash timing (render frames)
  updatePopups();  // Stage 6: popup timing, driven by render frames
  updateHitFx();   // Stage 5: hit feedback timing, driven by render frames
  updateMouseCursor();
  present();       // Stage 5: copy the game canvas to the visible canvas
  requestAnimationFrame(loop);
}

// ------------------------------------------------------------------
// Boot
// ------------------------------------------------------------------
function boot() {
  buildSpriteCache();
  initAtlasImage();
  loadHiScore();     // Stage 6
  loadTable();       // arcade registry
  try { arcadeUnlocked = localStorage.getItem(UNLOCK_KEY) === '1'; } catch (e) { arcadeUnlocked = false; }
  loadMute();        // Stage 7
  window.addEventListener('keydown', function (e) {
    const isStartKey = (e.code === 'Digit1' || e.code === 'Digit2' || e.code === 'Numpad1' || e.code === 'Numpad2');
    audioUnlock(!isStartKey && e.code !== 'KeyM' ? true : false);
    if (e.code === 'KeyM' && !e.repeat && !(screen === SCREEN_CONTROLS && ctl.editing)) { toggleMute(); if (audioCtx && screen === SCREEN_SELECT) musicStart(); }
  });
  window.addEventListener('pointerdown', function () { bootPoke = true; audioUnlock(screen !== SCREEN_BOOT); });
  loadEffects();     // Stage 5: restore saved effect toggles (defaults if none)
  setupCanvas();
  initInput();
  initMouse();
  initTouch(); setupCanvas();
  screen = SCREEN_BOOT;
  requestAnimationFrame(loop);
}

boot();
</script>
</body>
