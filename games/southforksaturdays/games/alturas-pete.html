  const dx = (outCv.width - dw) / 2, dy = (outCv.height - dh) / 2;
  outCtx.fillStyle = '#0e0a06';
  outCtx.fillRect(0, 0, outCv.width, outCv.height);
  outCtx.drawImage(buf, 0, 0, buf.width, buf.height, dx, dy, dw, dh);
}


// 7b. AUDIO -- procedural, no audio files. PURE mirrors the Odyssey2's
//     single-voice square/noise reality; ENRICHED (default) layers a
//     couple of oscillators for a fuller chiptune feel. M/N mute
//     music/SFX independently (checked in the keydown handler above).
// ---------------------------------------------------------------
let audioMode = 'ENRICHED'; // 'ENRICHED' | 'PURE'
let musicMuted = false, sfxMuted = false;
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  // Autoplay policy frequently creates (or leaves) the context 'suspended' since our
  // sounds fire from the game loop reading key state a frame later, not synchronously
  // inside the original keydown event -- resume() is a safe no-op once already running,
  // but skipping it here silently drops every sound with no error thrown.
  if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume().catch(() => {}); }
  return audioCtx;
}

function playTone(freq, dur, wave, gain) {
  const ctx = ensureAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = wave; osc.frequency.value = freq;
  g.gain.value = gain;
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + dur);
}

function playNoise(dur, gain) {
  const ctx = ensureAudio();
  if (!ctx) return;
  const bufLen = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufLen);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const g = ctx.createGain(); g.gain.value = gain;
  src.connect(g); g.connect(ctx.destination);
  src.start();
}

// name -> { freq, dur, wave } for ENRICHED; PURE collapses everything to a plain square blip.
const SFX_DEF = {
  jump:          { freq: 320, dur: 0.08, wave: 'square' },
  duck:          { freq: 180, dur: 0.06, wave: 'square' },
  pickSwing:     { freq: 500, dur: 0.05, wave: 'triangle' },
  pickStrike:    { freq: 720, dur: 0.09, wave: 'square' },
  pickWarn:      { freq: 260, dur: 0.05, wave: 'square' },
  pickShatter:   { freq: 90,  dur: 0.30, wave: 'sawtooth', noise: true },
  pickup:        { freq: 660, dur: 0.10, wave: 'triangle' },
  keyPickup:     { freq: 880, dur: 0.14, wave: 'triangle' },
  boulderSpawn:  { freq: 150, dur: 0.10, wave: 'sawtooth' },
  wallHit:       { freq: 100, dur: 0.06, wave: 'square' },
  boulderCollide:{ freq: 110, dur: 0.16, wave: 'square', noise: true },
  pickSpawn:     { freq: 520, dur: 0.08, wave: 'triangle' },
  keySpawn:      { freq: 780, dur: 0.10, wave: 'triangle' },
  doorStuck:     { freq: 140, dur: 0.20, wave: 'sawtooth' },
  doorUnlock:    { freq: 1000, dur: 0.22, wave: 'square' },
  death:         { freq: 200, dur: 0.5, wave: 'sawtooth', noise: true },
  ladderStep:    { freq: 400, dur: 0.03, wave: 'square' },
  menuMove:      { freq: 440, dur: 0.04, wave: 'square' },
  menuConfirm:   { freq: 660, dur: 0.10, wave: 'square' },
};

function sfx(name) {
  if (sfxMuted) return;
  const def = SFX_DEF[name];
  if (!def) return;
  if (audioMode === 'PURE') {
    playTone(def.freq, Math.min(def.dur, 0.12), 'square', 0.08);
    return;
  }
  playTone(def.freq, def.dur, def.wave, 0.13);
  if (def.noise) playNoise(def.dur, 0.09);
}

// Music: a short 4-note ostinato that transposes down and speeds up with depth --
// "the same tune gone claustrophobic" ten fields in, per the GDD. Kept deliberately
// quiet relative to SFX (see gain below) so it sits behind the action, not on top of it.
const MOTIF = [0, 3, 5, 7];
let musicTimer = null, musicStep = 0;
function noteFreq(semis) { return 220 * Math.pow(2, semis / 12); }
function startMusic() {
  stopMusic();
  if (musicMuted) return;
  const stepMs = Math.max(140, 220 - fieldIndex() * 8) * (audioMode === 'PURE' ? 1.15 : 1);
  musicTimer = setInterval(() => {
    if (musicMuted) return;
    const semis = MOTIF[musicStep % MOTIF.length] - fieldIndex();
    playTone(noteFreq(semis), stepMs / 1000 * 0.4, audioMode === 'PURE' ? 'square' : 'triangle', 0.014);
    musicStep++;
  }, stepMs);
}
function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } musicStep = 0; }

// ---------------------------------------------------------------
// 7c. HIGH SCORES -- localStorage, with a graceful no-op if unavailable.
// ---------------------------------------------------------------
const HS_KEY = 'alturasPeteHighScores_v1';
function loadHighScores() {
  try {
    const raw = localStorage.getItem(HS_KEY);
    if (!raw) return { DIG: [], PICKOFF: [], SHIFT: [] };
    const parsed = JSON.parse(raw);
    return { DIG: parsed.DIG || [], PICKOFF: parsed.PICKOFF || [], SHIFT: parsed.SHIFT || [] };
  } catch (e) { return { DIG: [], PICKOFF: [], SHIFT: [] }; }
}
function saveHighScores() {
  try { localStorage.setItem(HS_KEY, JSON.stringify(highScores)); } catch (e) { /* graceful no-op */ }
}
let highScores = loadHighScores();

function qualifiesForHighScore(mode, score) {
  const list = highScores[mode] || [];
  if (score <= 0) return false;
  if (list.length < TUNING.highScoreSlots) return true;
  return score > Math.min(...list.map(e => e.score));
}
function insertHighScore(mode, name, score) {
  const list = highScores[mode] || (highScores[mode] = []);
  list.push({ name, score });
  list.sort((a, b) => b.score - a.score);
  highScores[mode] = list.slice(0, TUNING.highScoreSlots);
  saveHighScores();
}
function topScore(mode) {
  const list = highScores[mode] || [];
  return list.length ? list[0] : null;
}

// ---------------------------------------------------------------
// 7d. SCREEN / MODE STATE MACHINE
// ---------------------------------------------------------------
// uiScreen: TITLE | MODESELECT | PLAYERS | PLAY | SCOREPLATE | NAMEENTRY | SHIFTRESULTS | ATTRACT
let uiScreen = 'TITLE';
let idleT = 0;
let deathFreezeT = 0;
let gameMode = 'DIG'; // DIG | PICKOFF | SHIFT
const pickOff = { timeLeft: 0 };
const shift = { numPlayers: 2, activeIndex: 0, scores: [] };
const menu = { modeIndex: 0 }; // MODESELECT cursor
const nameEntry = { chars: ['A','A','A','A','A','A'], cursor: 0, pendingMode: 'DIG', pendingScore: 0 };
const MODE_LIST = ['DIG', 'PICKOFF', 'SHIFT'];
const MODE_LABEL = { DIG: 'DIG', PICKOFF: 'PICK-OFF', SHIFT: 'SHIFT ROTATION' };
const attract = { t: 0 };

function goTitle() {
  uiScreen = 'TITLE';
  idleT = 0;
  stopMusic();
}

function startRun() {
  resetGame();
  deathFreezeT = 0;
  if (gameMode === 'PICKOFF') pickOff.timeLeft = TUNING.pickOffSec;
  uiScreen = 'PLAY';
  startMusic();
}

// deterministic synthetic input for ATTRACT -- same seed + same formula = same demo every time
function attractInputAt(t) {
  const cyc = t % 4;
  return {
    ArrowLeft: cyc < 1,
    ArrowRight: cyc >= 1 && cyc < 2,
    ArrowUp: cyc >= 2 && cyc < 2.6,
    ArrowDown: cyc >= 2.6 && cyc < 3,
    Space: Math.floor(t * 3) % 5 === 0,
  };
}

// The actual gameplay tick, run for both real PLAY and scripted ATTRACT.
function tickPlay(dt) {
  simTime += dt;

  if (game.state === 'DEAD') {
    deathFreezeT -= dt;
    if (deathFreezeT > 0) return;
    if (uiScreen === 'PLAY') onRunEnded(); // ATTRACT just sits dead; tick()'s ATTRACT branch loops it
    return;
  }

  if (gameMode === 'PICKOFF' && uiScreen === 'PLAY') {
    pickOff.timeLeft -= dt;
    if (pickOff.timeLeft <= 0) { pickOff.timeLeft = 0; game.state = 'DEAD'; deathFreezeT = 0; onRunEnded(); return; }
  }

  if (game.transitionT > 0) {
    game.transitionT = Math.max(0, game.transitionT - dt);
    if (game.transitionT === 0) startMusic(); // re-pitch for the new field
  } else {
    updateDoorSpawn(dt);
    updateLadders(dt);
    updateBoulders(dt);
    updateBoulderCollisions();
    updateGates();
    updatePete(dt);
    updatePickHits();
    checkDoorTouch();
    checkCollisions();
    updatePickups(dt);
    updatePick(dt);
  }
  updateFloaters(dt);
}

// Restart on the CURRENT field without touching depth (score is preserved by the
// caller) -- used by PICK-OFF's death penalty. Deliberately does NOT call resetGame(),
// which would reseed ladders/gates for depth 0 before depth got restored, leaving the
// visible field looking right but the underlying tuning wrong.
function restartFieldKeepingProgress() {
  boulders = []; pickups = []; floaters = [];
  game.keyHeld = false; game.transitionT = 0; game.state = 'PLAY';
  resetPick();
  seedLadders(); seedGates();
  doorSpawnT = currentField().spawnMs / 1000;
  pete.x = 120; pete.y = GEO.floorY[3]; pete.floorIdx = 3; pete.facing = 1;
  pete.state = 'WALK'; pete.climbGap = -1; pete.jumpT = 0; pete.jumpDir = 0;
  pete.duckHoldMs = 0; pete.swingFlashT = 0; pete.stuckT = 0; pete.stuckDoorX = 0; pete.gateCooldown = 0;
}

// Called once a death (or PICK-OFF time-up) has actually resolved -- routes to whatever
// comes next depending on the active mode.
function onRunEnded() {
  if (gameMode === 'PICKOFF' && pickOff.timeLeft > 0) {
    // ordinary death mid-attempt: costs time, continues on the SAME field, score kept
    pickOff.timeLeft = Math.max(0, pickOff.timeLeft - TUNING.pickOffPenaltySec);
    restartFieldKeepingProgress();
    return;
  }
  if (gameMode === 'SHIFT') {
    shift.scores[shift.activeIndex] = game.score;
    shift.activeIndex++;
    if (shift.activeIndex < shift.numPlayers) {
      resetGame();
      uiScreen = 'PLAY'; // next player's turn, fresh run
      startMusic();
    } else {
      stopMusic();
      uiScreen = 'SHIFTRESULTS';
    }
    return;
  }
  // DIG, or PICKOFF whose clock just ran out
  stopMusic();
  const finalScore = game.score;
  if (qualifiesForHighScore(gameMode, finalScore)) {
    nameEntry.pendingMode = gameMode;
    nameEntry.pendingScore = finalScore;
    nameEntry.chars = ['A','A','A','A','A','A'];
    nameEntry.cursor = 0;
    uiScreen = 'SCOREPLATE_NEW'; // score plate that leads into name entry on Enter
  } else {
    uiScreen = 'SCOREPLATE';
  }
}

function updateMenus(dt) {
  if (uiScreen === 'TITLE') {
    idleT += dt;
    if (justPressed('Enter')) { sfx('menuConfirm'); uiScreen = 'MODESELECT'; idleT = 0; }
    else if (justPressed('ArrowUp','ArrowDown','ArrowLeft','ArrowRight')) { idleT = 0; }
    if (idleT >= TUNING.idleAttractSec) {
      rng = mulberry32(987654321); // fixed seed -- same demo every time
      gameMode = 'DIG';
      resetGame();
      attract.t = 0;
      uiScreen = 'ATTRACT';
      anyKeyThisFrame = false;
    }
  } else if (uiScreen === 'ATTRACT') {
    // handled in tick() -- scripted playback, not real menu input
  } else if (uiScreen === 'MODESELECT') {
    if (justPressed('ArrowUp')) { menu.modeIndex = (menu.modeIndex + MODE_LIST.length - 1) % MODE_LIST.length; sfx('menuMove'); }
    if (justPressed('ArrowDown')) { menu.modeIndex = (menu.modeIndex + 1) % MODE_LIST.length; sfx('menuMove'); }
    if (justPressed('Enter')) {
      sfx('menuConfirm');
      gameMode = MODE_LIST[menu.modeIndex];
      if (gameMode === 'SHIFT') { uiScreen = 'PLAYERS'; }
      else { startRun(); }
    }
  } else if (uiScreen === 'PLAYERS') {
    if (justPressed('ArrowLeft')) { shift.numPlayers = Math.max(TUNING.shiftMinPlayers, shift.numPlayers - 1); sfx('menuMove'); }
    if (justPressed('ArrowRight')) { shift.numPlayers = Math.min(TUNING.shiftMaxPlayers, shift.numPlayers + 1); sfx('menuMove'); }
    if (justPressed('Enter')) {
      sfx('menuConfirm');
      shift.activeIndex = 0;
      shift.scores = new Array(shift.numPlayers).fill(0);
      startRun();
    }
  } else if (uiScreen === 'SCOREPLATE') {
    if (justPressed('Enter')) { sfx('menuConfirm'); goTitle(); }
  } else if (uiScreen === 'SCOREPLATE_NEW') {
    if (justPressed('Enter')) { sfx('menuConfirm'); uiScreen = 'NAMEENTRY'; }
  } else if (uiScreen === 'NAMEENTRY') {
    if (justPressed('ArrowUp')) { nameEntry.cursor = (nameEntry.cursor + 5) % 6; sfx('menuMove'); }
    if (justPressed('ArrowDown')) { nameEntry.cursor = (nameEntry.cursor + 1) % 6; sfx('menuMove'); }
    if (justPressed('ArrowLeft') || justPressed('ArrowRight')) {
      const dir = justPressed('ArrowRight') ? 1 : -1;
      const cur = nameEntry.chars[nameEntry.cursor];
      const A = 'A'.charCodeAt(0), Z = 'Z'.charCodeAt(0);
      let code = cur.charCodeAt(0) + dir;
      if (code > Z) code = A; if (code < A) code = Z;
      nameEntry.chars[nameEntry.cursor] = String.fromCharCode(code);
      sfx('menuMove');
    }
    if (justPressed('Enter')) {
      sfx('menuConfirm');
      insertHighScore(nameEntry.pendingMode, nameEntry.chars.join(''), nameEntry.pendingScore);
      goTitle();
    }
  } else if (uiScreen === 'SHIFTRESULTS') {
    if (justPressed('Enter')) {
      sfx('menuConfirm');
      const bestScore = Math.max(...shift.scores);
      if (qualifiesForHighScore('SHIFT', bestScore)) {
        nameEntry.pendingMode = 'SHIFT';
        nameEntry.pendingScore = bestScore;
        nameEntry.chars = ['A','A','A','A','A','A'];
        nameEntry.cursor = 0;
        uiScreen = 'NAMEENTRY';
      } else {
        goTitle();
      }
    }
  }
}


const STEP = 1 / 60;
let acc = 0, lastT = performance.now();

// Top-level router: PLAY and ATTRACT run the deterministic fixed-step simulation;
// every menu screen updates once per real frame (no physics determinism needed there).
function tick(dt) {
  if (uiScreen === 'PLAY') {
    tickPlay(dt);
  } else if (uiScreen === 'ATTRACT') {
    if (anyKeyThisFrame) {
      stopMusic();
      rng = mulberry32(Date.now() & 0xffffffff); // restore real randomness for actual play
      goTitle();
      return;
    }
    attract.t += dt;
    const scripted = attractInputAt(attract.t);
    keys['ArrowLeft'] = scripted.ArrowLeft;
    keys['ArrowRight'] = scripted.ArrowRight;
    keys['ArrowUp'] = scripted.ArrowUp;
    keys['ArrowDown'] = scripted.ArrowDown;
    keys['Space'] = scripted.Space;
    tickPlay(dt);
    if (game.state === 'DEAD' && deathFreezeT <= -0.8) { // freeze elapsed + a beat to see the death, then loop
      rng = mulberry32(987654321);
      resetGame();
      attract.t = 0;
    }
  }
}

function frame(now) {
  let frameDt = (now - lastT) / 1000;
  lastT = now;
  frameDt = clamp(frameDt, 0, 0.25); // guard against tab-away spikes

  if (uiScreen === 'PLAY' || uiScreen === 'ATTRACT') {
    acc += frameDt;
    while (acc >= STEP) {
      tick(STEP);
      acc -= STEP;
    }
  } else {
    acc = 0;
    updateMenus(frameDt);
  }

  render();
  snapshotKeyEdges();
  anyKeyThisFrame = false;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------
// 9. HEADLESS SELF-TEST (checkpoint 5 scope: full sim including the
//    shell's tickPlay path -- movement, climbing, boulders, passive
//    pick, boulder-boulder collisions/pickups, doors/keys/descent,
//    doorstuck, death/run-ended routing, mode/screen consistency)
//    Runs once on load, logs to console, does not affect rendering.
// ---------------------------------------------------------------
(function selfTest() {
  try {
    let errors = 0;
    let runEnds = 0, restarts = 0, pickupsSeen = 0, descents = 0, doorStucks = 0;
    const VALID_SCREENS = ['TITLE','MODESELECT','PLAYERS','PLAY','SCOREPLATE','SCOREPLATE_NEW','NAMEENTRY','SHIFTRESULTS','ATTRACT'];
    gameMode = 'DIG';
    startRun(); // enters uiScreen='PLAY' via the real shell path, not a raw resetGame()
    for (let i = 0; i < 20000; i++) {
      keys['ArrowLeft'] = (i % 37 < 9);
      keys['ArrowRight'] = (i % 37 >= 9 && i % 37 < 18);
      keys['ArrowUp'] = (i % 37 >= 18 && i % 37 < 24);
      keys['ArrowDown'] = (i % 37 >= 24 && i % 37 < 28);
      keys['Space'] = (i % 11 === 0);

      const depthBefore = game.depth;
      const screenBefore = uiScreen;
      tick(STEP);
      if (game.depth > depthBefore) descents++;
      if (pete.state === 'DOORSTUCK') doorStucks++;
      if (uiScreen !== screenBefore && screenBefore === 'PLAY') runEnds++;

      if (pete.x < GEO.wallL - 1 || pete.x > GEO.wallR + 1) errors++;
      if (pete.floorIdx < 0 || pete.floorIdx >= FLOORS) errors++;
      if (!isFinite(pete.x) || !isFinite(pete.y)) errors++;
      for (const b of boulders) {
        if (b.floorIdx < 0 || b.floorIdx > FLOORS) errors++;
        if (!isFinite(b.x)) errors++;
      }
      for (const p of pickups) {
        pickupsSeen++;
        if (!isFinite(p.x) || !isFinite(p.y)) errors++;
        if (p.y < -50 || p.y > TUNING.bufH + 50) errors++; // way out of bounds, filter should have caught it
      }
      if (!VALID_SCREENS.includes(uiScreen)) errors++;
      if (game.state !== 'PLAY' && game.state !== 'DEAD') errors++;
      if (game.depth < 0) errors++;

      // whatever screen a run-end landed on, jump straight back into PLAY so the
      // stress test keeps exercising the simulation rather than sitting in a menu
      if (uiScreen !== 'PLAY' && uiScreen !== 'ATTRACT') {
        gameMode = 'DIG';
        startRun();
        restarts++;
      }
    }
    keys['ArrowLeft'] = keys['ArrowRight'] = keys['ArrowUp'] = keys['ArrowDown'] = keys['Space'] = false;
    gameMode = 'DIG';
    goTitle();
    console.log(`[ALTURAS PETE self-test] 20000 ticks, ${errors} bounds/NaN/state errors, ` +
      `${runEnds} run-ends, ${restarts} restarts-into-play, ${descents} descents, ${doorStucks} doorstuck-frames, ` +
      `${pickupsSeen} pickup-ticks observed.`);
