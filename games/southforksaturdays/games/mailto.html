  ctx.closePath(); ctx.fill();
  // shaded side + lit side for volume
  ctx.fillStyle = "rgba(0,0,0,0.20)";
  ctx.beginPath();
  ctx.moveTo(-10, coatTop); ctx.lineTo(-3, coatTop); ctx.lineTo(-4, coatBot); ctx.lineTo(-13, coatBot);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.16)";
  ctx.beginPath();
  ctx.moveTo(6, coatTop); ctx.lineTo(10, coatTop); ctx.lineTo(13, coatBot); ctx.lineTo(8, coatBot);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle="#2b1d10"; ctx.lineWidth=1.6; ctx.lineJoin="round";
  ctx.beginPath();
  ctx.moveTo(-10, coatTop); ctx.lineTo(10, coatTop); ctx.lineTo(13, coatBot); ctx.lineTo(-13, coatBot);
  ctx.closePath(); ctx.stroke();
  // coat buttons
  ctx.fillStyle = "#e8d24a";
  ctx.beginPath(); ctx.arc(2, coatTop+8, 1.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(2, coatTop+15, 1.3, 0, Math.PI*2); ctx.fill();

  // ---- satchel (the actual point of the game) ----
  const satY = coatTop + 10;
  ctx.fillStyle = "#7a5430";
  ctx.fillRect(-17, satY, 10, 13);
  ctx.fillStyle = "#5c3d20";
  ctx.fillRect(-17, satY, 10, 4);
  ctx.strokeStyle = "#3a2712"; ctx.lineWidth = 1.4;
  ctx.strokeRect(-17, satY, 10, 13);
  // strap across the chest
  ctx.strokeStyle = "#5c3d20"; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(-12, satY); ctx.lineTo(5, coatTop+3); ctx.stroke();
  // brass buckle
  ctx.fillStyle = "#e8d24a";
  ctx.fillRect(-13.5, satY+5, 3, 2.5);

  // ---- scarf, trailing in the wind ----
  ctx.fillStyle = c.scarf;
  ctx.fillRect(-8, coatTop-2, 16, 5);
  const flick = Math.sin(world.time*0.16)*3 + (moving?-4:0);
  ctx.beginPath();
  ctx.moveTo(-7, coatTop-1);
  ctx.quadraticCurveTo(-16, coatTop+2+flick*0.4, -21-Math.abs(p.vx)*1.4, coatTop+6+flick);
  ctx.lineTo(-19-Math.abs(p.vx)*1.4, coatTop+10+flick);
  ctx.quadraticCurveTo(-14, coatTop+8, -7, coatTop+4);
  ctx.closePath(); ctx.fill();

  // ---- arms ----
  ctx.strokeStyle = c.coat; ctx.lineWidth=5.5; ctx.lineCap="round";
  const armY = coatTop+7;
  if (mounted) {
    ctx.beginPath();
    ctx.moveTo(-6,armY); ctx.lineTo(9,armY+7);
    ctx.moveTo(6,armY); ctx.lineTo(14,armY+6);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(-9,armY); ctx.lineTo(-13+stride*4, armY+13);
    ctx.moveTo(9,armY); ctx.lineTo(13-stride*4, armY+13);
    ctx.stroke();
  }
  // mittens
  ctx.fillStyle = "#2b1d10";
  ctx.beginPath(); ctx.arc(-13+stride*4, armY+13, 2.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(13-stride*4, armY+13, 2.6, 0, Math.PI*2); ctx.fill();

  // ---- head ----
  const headY = coatTop-6;
  ctx.fillStyle = c.skin;
  ctx.beginPath(); ctx.arc(0, headY, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath(); ctx.arc(-2.5, headY, 8, Math.PI*0.5, Math.PI*1.5); ctx.fill();
  // cheek color — cold, or heat-flushed on the dredge
  ctx.fillStyle = isDry(lv) ? "rgba(200,110,80,0.35)" : "rgba(210,120,110,0.40)";
  ctx.beginPath(); ctx.arc(4, headY+2.5, 2.6, 0, Math.PI*2); ctx.fill();
  // eye
  ctx.fillStyle="#2b1d10";
  ctx.beginPath(); ctx.arc(4.5, headY-0.5, 1.3, 0, Math.PI*2); ctx.fill();

  // ---- hat: fur-trimmed in cold, brimmed in heat ----
  if (lv.key==='dredge') {
    ctx.fillStyle = "#8a6a3a";
    ctx.beginPath(); ctx.ellipse(0, headY-5, 12, 3.4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#7a5c30";
    ctx.beginPath(); ctx.ellipse(0, headY-8, 7, 5, 0, Math.PI, 0); ctx.fill();
    ctx.fillRect(-7, headY-8, 14, 4);
  } else {
    ctx.fillStyle = "#2b1d10";
    ctx.beginPath(); ctx.ellipse(0, headY-7, 9.5, 4.6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(-9.5, headY-10, 19, 5);
    // fur trim
    ctx.fillStyle = "#cbbba0";
    ctx.beginPath(); ctx.ellipse(0, headY-5.5, 10, 2.6, 0, 0, Math.PI*2); ctx.fill();
    // ear flap
    ctx.fillStyle = "#2b1d10";
    ctx.beginPath(); ctx.ellipse(-8, headY+1, 3, 5, 0, 0, Math.PI*2); ctx.fill();
  }

  // ---- breath fog in the cold ----
  if (!isDry(lv) && Math.sin(world.time*0.06)>0.72) {
    ctx.globalAlpha *= 0.4;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(11, headY+1, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(15, headY-0.5, 2.2, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha /= 0.4;
  }

  ctx.restore();  // lean
  ctx.restore();  // sprite transform
  ctx.globalAlpha = 1;
}

function drawMount(lv){
  const weasel = lv.key==='roads' && lv.vehicleLabel==='WEASEL';
  const jeep = (lv.key==='roads' && !weasel) || lv.key==='construction';
  const cart = lv.key==='dredge' || lv.key==='decline';
  const boat = lv.key==='reservoir';
  const roll = world.x*0.12;

  ctx.strokeStyle = "#2b1d10"; ctx.lineWidth=3; ctx.lineJoin="round";

  if (boat) {
    // a plain wooden rowboat, riding low with a set of oars
    const bob = Math.sin(world.time*0.09)*1.6;
    ctx.save(); ctx.translate(0, bob);
    // hull, clinker-built planking
    ctx.fillStyle = lv.vehicleBody;
    ctx.beginPath();
    ctx.moveTo(-30,4); ctx.quadraticCurveTo(-30,-10,-16,-12);
    ctx.lineTo(16,-12); ctx.quadraticCurveTo(30,-10,30,4);
    ctx.quadraticCurveTo(0,12,-30,4);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "rgba(0,0,0,0.22)"; ctx.lineWidth=1.2;
    for (const py of [-6,-1,4]) { ctx.beginPath(); ctx.moveTo(-27,py); ctx.lineTo(27,py); ctx.stroke(); }
    // gunwale rim
    ctx.strokeStyle = lv.vehicleRunner; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(-30,-11); ctx.quadraticCurveTo(0,-16,30,-11); ctx.stroke();
    // bench seat + satchel resting on it
    ctx.fillStyle = lv.vehicleRunner;
    ctx.fillRect(-10,-14,20,4);
    // oars, dipping with the bob cycle
    const oarA = Math.sin(world.time*0.09)*0.3;
    ctx.strokeStyle = "#5c3d20"; ctx.lineWidth=3; ctx.lineCap="round";
    ctx.save(); ctx.translate(-14,-10); ctx.rotate(-0.5+oarA);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-26,6); ctx.stroke();
    ctx.fillStyle="#5c3d20"; ctx.beginPath(); ctx.ellipse(-27,7,6,3,0.2,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(14,-10); ctx.rotate(0.5-oarA);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(26,6); ctx.stroke();
    ctx.fillStyle="#5c3d20"; ctx.beginPath(); ctx.ellipse(27,7,6,3,-0.2,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.restore();
    // small wake ripples off the stern
    ctx.strokeStyle = "rgba(232,240,240,0.4)"; ctx.lineWidth=1.2;
    for (let i=0;i<2;i++){
      const t=(world.time*2+i*20)%40;
      ctx.globalAlpha = 1-t/40;
      ctx.beginPath(); ctx.ellipse(-30-t, 6+bob, 6+t*0.3, 2, 0,0,Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (cart) {
    // ore cart: riveted tub on a rail truck
    ctx.fillStyle = lv.vehicleBody;
    ctx.beginPath();
    ctx.moveTo(-19,-20); ctx.lineTo(21,-20); ctx.lineTo(17,2); ctx.lineTo(-15,2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.fillRect(-15,-18,7,19);
    ctx.fillStyle = "#8a7a5a";
    for (let i=-14;i<18;i+=8){ ctx.beginPath(); ctx.arc(i,-17,1.3,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle = lv.vehicleRunner;
    ctx.fillRect(-18,2,11,11); ctx.fillRect(8,2,11,11);
    ctx.strokeRect(-18,2,11,11); ctx.strokeRect(8,2,11,11);
  } else if (weasel) {
    // M29 Weasel: boxy tracked hull
    ctx.fillStyle = lv.vehicleBody;
    ctx.beginPath();
    ctx.moveTo(-27,-22); ctx.lineTo(19,-22); ctx.lineTo(25,-9); ctx.lineTo(25,2); ctx.lineTo(-27,2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // windscreen
    ctx.fillStyle = "rgba(190,215,230,0.55)";
    ctx.beginPath(); ctx.moveTo(8,-21); ctx.lineTo(18,-21); ctx.lineTo(23,-11); ctx.lineTo(8,-11);
    ctx.closePath(); ctx.fill();
    // track skirt + rollers
    ctx.fillStyle = lv.vehicleRunner;
    ctx.beginPath(); ctx.moveTo(-29,2); ctx.lineTo(27,2); ctx.lineTo(27,12); ctx.lineTo(-29,12);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#3d3d3d";
    for (let i=-26; i<26; i+=7){
      const tx = i + ((roll % 7) + 7) % 7;
      if (tx > -28 && tx < 26) ctx.fillRect(tx, 4, 4, 6);
    }
    ctx.fillStyle = "#6a6a6a";
    ctx.beginPath(); ctx.arc(-20,7,3.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(18,7,3.4,0,Math.PI*2); ctx.fill();
  } else if (jeep) {
    // Mail Jeep: open-body flat fender
    ctx.fillStyle = lv.vehicleBody;
    ctx.beginPath();
    ctx.moveTo(-24,-18); ctx.lineTo(-6,-18); ctx.lineTo(-4,-26); ctx.lineTo(14,-26);
    ctx.lineTo(22,-14); ctx.lineTo(24,0); ctx.lineTo(-24,0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // windscreen frame
    ctx.strokeStyle = "#2b1d10"; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(-4,-26); ctx.lineTo(14,-26); ctx.stroke();
    // seven-slot grille
    ctx.fillStyle = "#d8cfae";
    for (let i=0;i<5;i++) ctx.fillRect(16+i*1.9, -12, 1.1, 9);
    // headlamp
    ctx.fillStyle = "#ffe98a";
    ctx.beginPath(); ctx.arc(21,-15,2.6,0,Math.PI*2); ctx.fill();
    // mail star on the door
    ctx.fillStyle = "#f2ead8";
    ctx.beginPath();
    for (let i=0;i<10;i++){
      const a=(i/10)*Math.PI*2 - Math.PI/2, r=(i%2===0)?4.6:2;
      i===0?ctx.moveTo(-8+Math.cos(a)*r,-8+Math.sin(a)*r):ctx.lineTo(-8+Math.cos(a)*r,-8+Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill();
    // wheels with rotating spokes
    ctx.fillStyle = "#1f1f1f";
    for (const wxp of [-15, 15]) {
      ctx.beginPath(); ctx.arc(wxp, 3, 9, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#8a8a8a";
      ctx.beginPath(); ctx.arc(wxp, 3, 3.6, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = "#8a8a8a"; ctx.lineWidth=1.5;
      for (let k=0;k<4;k++){
        const a = roll*0.09 + k*Math.PI/2;
        ctx.beginPath();
        ctx.moveTo(wxp+Math.cos(a)*3, 3+Math.sin(a)*3);
        ctx.lineTo(wxp+Math.cos(a)*8, 3+Math.sin(a)*8);
        ctx.stroke();
      }
      ctx.fillStyle = "#1f1f1f";
    }
  } else {
    // horse-drawn sled: bentwood runners
    ctx.strokeStyle = "#2b1d10"; ctx.lineWidth=3.4;
    ctx.beginPath();
    ctx.moveTo(-24,8); ctx.lineTo(-18,-12); ctx.lineTo(18,-12);
    ctx.quadraticCurveTo(27,-12, 26,2); ctx.stroke();
    ctx.fillStyle = lv.vehicleBody;
    ctx.beginPath();
    ctx.moveTo(-18,-20); ctx.lineTo(18,-20); ctx.lineTo(20,-10); ctx.lineTo(-18,-10);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // slat detail
    ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth=1.2;
    for (let i=-14;i<18;i+=7){ ctx.beginPath(); ctx.moveTo(i,-19); ctx.lineTo(i,-11); ctx.stroke(); }
    // runners
    ctx.strokeStyle = lv.vehicleRunner; ctx.lineWidth=3.4;
    ctx.beginPath(); ctx.moveTo(-26,9); ctx.lineTo(20,9);
    ctx.quadraticCurveTo(28,9, 27,3); ctx.stroke();
    // traces to the (offscreen) horse
    ctx.strokeStyle = "#5c3d20"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(20,-14); ctx.lineTo(38,-18); ctx.stroke();
  }
}

function drawParticles(){
  for (const pt of particles) {
    const k = clamp(pt.life/34,0,1);
    ctx.globalAlpha = k*0.9;
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r*(0.35+k*0.65), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}


function drawSnow(){
  const lv = curLevel();
  const dredge = lv.key==='dredge';
  const reservoir = lv.key==='reservoir';
  const dry = isDry(lv) && !dredge;
  const n = 46 + world.storm*1.7;

  // two depth layers of precipitation/grit, different speed and size
  for (let layer=0; layer<2; layer++){
    const speed = layer===0 ? 1.0 : 2.1;
    const size  = layer===0 ? 1.8 : 3.0;
    ctx.globalAlpha = layer===0 ? (reservoir?0.22:0.35) : (reservoir?0.4:0.7);
    ctx.fillStyle = dredge ? "#8b8060" : reservoir ? "#c4d2d4" : (dry ? "#c8a86a" : "#ffffff");
    for (let i=0;i<n;i++){
      const drift = (world.storm/100)*40;
      const sx = ((i*97 + world.time*(1.1+layer*1.3)*speed + i*13) % (W+40)) - 20
               + Math.sin((world.time*0.02)+i)*drift*0.2;
      const sy = (i*53 + world.time*(1.9+(i%5))*speed) % (H+20);
      if (dredge || dry) ctx.fillRect(sx, sy, size, size);
      else {
        // snow / mist: soft round flakes, slight sideways drift
        ctx.beginPath();
        ctx.arc(sx + Math.sin(world.time*0.04+i)*6, sy, size*(reservoir?1.4:0.7), 0, Math.PI*2);
        ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;

  // whiteout / dust-haze intensity as the danger meter climbs
  if (world.storm > 32) {
    const k = (world.storm-32)/68;
    ctx.fillStyle = dredge ? `rgba(150,140,104,${k*0.34})`
                  : reservoir ? `rgba(180,196,200,${k*0.36})`
                  : dry    ? `rgba(214,180,120,${k*0.30})`
                           : `rgba(238,246,252,${k*0.40})`;
    ctx.fillRect(0,0,W,H);
  }

  // vignette — focuses the eye and deepens the frame
  const vg = ctx.createRadialGradient(W/2, H*0.48, H*0.34, W/2, H*0.5, H*0.95);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(16,20,28,0.42)");
  ctx.fillStyle = vg;
  ctx.fillRect(0,0,W,H);
}

function drawAvalanche(){
  if (!world.avalanche) return;
  const lv = curLevel();
  const wx = world.avalanche.wx - world.x;
  const dredge = lv.key==='dredge';
  const dry = isDry(lv) && !dredge;
  const body = dredge ? "#8c8268" : (dry ? "#c9762e" : "#eef6fb");
  const froth = dredge ? "#a89b78" : (dry ? "#ffb14d" : "#ffffff");

  // churning mass
  ctx.save();
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(wx-340, H);
  for (let i=0;i<=10;i++){
    const yy = H - 50 - Math.sin(i*1.3 + world.time*0.22)*34 - i*34;
    ctx.lineTo(wx-340+i*36, Math.max(10,yy));
  }
  ctx.lineTo(wx, H);
  ctx.closePath();
  ctx.fill();
  // rolling froth lobes on the leading edge
  ctx.fillStyle = froth;
  for (let i=0;i<9;i++){
    const t = world.time*0.3 + i*1.7;
    const lx = wx - 30 - i*30 + Math.sin(t)*12;
    const ly = H - 60 - i*30 + Math.cos(t*1.2)*16;
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(lx, ly, 22 + Math.sin(t*0.7)*7, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // debris flung ahead of the wall
  ctx.fillStyle = dredge ? "#5a5240" : (dry ? "#7a3a12" : "#b9cdd8");
  for (let i=0;i<10;i++){
    const t = (world.time*2.2 + i*37) % 150;
    const dx = wx + t*1.1;
    const dy = H - 90 - Math.sin(t*0.09+i)*70 + i*8;
    if (dx < W+20) { ctx.fillRect(dx, dy, 5, 5); }
  }

  // corner warning chevrons — wordless "it's behind you, go"
  const a = 0.55 + Math.sin(world.time*0.3)*0.45;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = "#c9302c";
  for (let i=0;i<3;i++){
    const bx2 = 30 + i*26;
    ctx.beginPath();
    ctx.moveTo(bx2, 30); ctx.lineTo(bx2+16, 44); ctx.lineTo(bx2, 58);
    ctx.lineTo(bx2+7, 44); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // red edge flash on the trailing side of the screen
  const eg = ctx.createLinearGradient(0,0,150,0);
  eg.addColorStop(0, `rgba(201,48,44,${a*0.42})`);
  eg.addColorStop(1, "rgba(201,48,44,0)");
  ctx.fillStyle = eg;
  ctx.fillRect(0,0,150,H);
}

function drawHUD(){
  const lv = curLevel();
  const px = 18, pw = 176;

  // panel backing so the HUD reads over snow and rock alike
  ctx.save();
  ctx.fillStyle = "rgba(28,22,14,0.34)";
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(10, 12, pw+42, player.vehicle==='sled'?116:96, 8)
                : ctx.rect(10, 12, pw+42, 96);
  ctx.fill();
  ctx.restore();

  // resource: warmth / stamina / gasoline — icon instead of a word
  hudBar(px+26, 20, pw, 13, player.warmth/100,
         player.warmth<25 ? "#e0603f" : "#4a9edb");
  hudGlyph(px+11, 26.5, lv.fuelMode ? 'can' : (isDry(lv) ? 'sun' : 'flame'));

  // the mail itself
  hudBar(px+26, 38, pw, 13, player.mail/100, "#c98a2b");
  hudGlyph(px+11, 44.5, 'satchel');

  // ambient danger meter
  hudBar(px+26, 56, pw, 13, world.storm/100, "#b23b2e");
  hudGlyph(px+11, 62.5, lv.key==='roads' && !lv.phase2Active ? 'flame' : 'storm');

  // weapon: shell pips, filled = available
  hudGlyph(px+11, 82, 'shell');
  const maxPips = 6;
  for (let i=0;i<maxPips;i++){
    const bx = px+26+i*15, by = 76;
    const has = i < player.flares;
    ctx.fillStyle = has ? WEAPON_TIERS[player.weaponTier].color : "rgba(240,232,214,0.16)";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(bx, by, 10, 12, 2.5) : ctx.rect(bx, by, 10, 12);
    ctx.fill();
    if (has) { ctx.fillStyle="rgba(0,0,0,0.35)"; ctx.fillRect(bx, by, 10, 3.5); }
  }
  // tier pips
  for (let i=0;i<3;i++){
    ctx.fillStyle = i<=player.weaponTier ? "#ffcf6b" : "rgba(240,232,214,0.18)";
    ctx.beginPath(); ctx.arc(px+124+i*10, 82, 3, 0, Math.PI*2); ctx.fill();
  }

  // vehicle condition
  if (player.vehicle==='sled') {
    hudBar(px+26, 96, pw, 10, player.sledHP/100,
           player.sledHP<34 ? "#e0603f" : lv.vehicleRunner);
    hudGlyph(px+11, 101, 'wheel');
  }

  // stalled warning — pulsing icon, no words
  if (player.vehicleStalled) {
    const a = 0.55 + Math.sin(world.time*0.2)*0.45;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(W/2, 74);
    ctx.scale(1.15,1.15);
    drawIconGlyph('fuelout');
    ctx.restore();
  }

  // ---- route progress: a trail line with a carrier pip ----
  const progress = clamp(world.x/world.length,0,1);
  const rx = W-238, ry = 30, rw = 214;
  ctx.save();
  ctx.fillStyle="rgba(28,22,14,0.34)";
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(rx-12, 14, rw+26, 40, 8) : ctx.rect(rx-12, 14, rw+26, 40);
  ctx.fill();
  ctx.restore();
  // track
  ctx.strokeStyle="rgba(240,232,214,0.28)"; ctx.lineWidth=4; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx+rw, ry); ctx.stroke();
  ctx.strokeStyle="#e8b23c"; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx+rw*progress, ry); ctx.stroke();
  // origin + destination markers
  ctx.fillStyle="rgba(240,232,214,0.6)";
  ctx.beginPath(); ctx.arc(rx, ry, 4, 0, Math.PI*2); ctx.fill();
  // destination: little post-office flag
  ctx.fillStyle="#b23b2e";
  ctx.fillRect(rx+rw-1, ry-13, 2.5, 15);
  ctx.beginPath();
  ctx.moveTo(rx+rw+1.5, ry-13); ctx.lineTo(rx+rw+13, ry-9); ctx.lineTo(rx+rw+1.5, ry-5);
  ctx.closePath(); ctx.fill();
  // carrier pip
  const cx = rx + rw*progress;
  ctx.fillStyle="#f2ead8";
  ctx.beginPath(); ctx.arc(cx, ry, 6, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle="#2b1d10"; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle="#7a5430";
  ctx.fillRect(cx-2.5, ry-2, 5, 5);
  // level pips beneath
  for (let i=0;i<LEVELS.length;i++){
    ctx.fillStyle = (i+1)<world.levelIdx ? "#e8b23c"
                  : (i+1)===world.levelIdx ? "#f2ead8" : "rgba(240,232,214,0.25)";
    ctx.beginPath(); ctx.arc(rx+rw-4-i*11, ry+16, 3.2, 0, Math.PI*2); ctx.fill();
  }
}

function hudGlyph(x, y, kind){
  ctx.save();
  ctx.translate(x, y);
  ctx.lineCap="round"; ctx.lineJoin="round";
  switch(kind){
    case 'flame':
      ctx.fillStyle="#ffb14d";
      ctx.beginPath();
      ctx.moveTo(0,-7); ctx.quadraticCurveTo(5.5,-0.5,2.6,4);
      ctx.quadraticCurveTo(0,7,-2.6,4); ctx.quadraticCurveTo(-5.5,-0.5,0,-7);
      ctx.fill(); break;
    case 'sun':
      ctx.fillStyle="#ffb14d";
      ctx.beginPath(); ctx.arc(0,0,3.6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#ffb14d"; ctx.lineWidth=1.6;
      for (let i=0;i<8;i++){
        const a=(i/8)*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*5.2, Math.sin(a)*5.2);
        ctx.lineTo(Math.cos(a)*7.6, Math.sin(a)*7.6);
        ctx.stroke();
      }
      break;
    case 'can':
      ctx.fillStyle="#e8b23c";
      ctx.fillRect(-5,-6,9,12);
      ctx.fillStyle="#2b1d10"; ctx.fillRect(-3.4,-4.4,6,5);
      ctx.fillStyle="#e8b23c"; ctx.fillRect(4,-4.5,3,3);
      break;
    case 'satchel':
      ctx.fillStyle="#c98a2b";
      ctx.fillRect(-6,-4,12,10);
      ctx.fillStyle="#8a5f22"; ctx.fillRect(-6,-4,12,3.4);
      ctx.strokeStyle="#8a5f22"; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(-3,-4); ctx.lineTo(-3,-7.5);
      ctx.moveTo(3,-4); ctx.lineTo(3,-7.5); ctx.stroke();
      break;
    case 'storm':
      ctx.fillStyle="#cfd8e0";
      ctx.beginPath(); ctx.arc(-2,-2,4,0,Math.PI*2); ctx.arc(2.5,-1,3.4,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#b23b2e"; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.moveTo(-2,3); ctx.lineTo(-3.5,7);
      ctx.moveTo(2,3); ctx.lineTo(0.5,7); ctx.stroke();
      break;
    case 'shell':
      ctx.fillStyle="#ffcf6b"; ctx.fillRect(-3.5,-2,7,8);
      ctx.fillStyle="#b23b2e"; ctx.fillRect(-3.5,-7,7,5);
      break;
    case 'wheel':
      ctx.strokeStyle="#cfd8e0"; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.arc(0,0,5.2,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,-5.2); ctx.lineTo(0,5.2);
      ctx.moveTo(-5.2,0); ctx.lineTo(5.2,0); ctx.stroke();
      break;
  }
  ctx.restore();
}

function hudBar(x,y,w,h,frac,color){
  // recessed track
  ctx.fillStyle="rgba(18,14,9,0.55)";
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x,y,w,h,h/2) : ctx.rect(x,y,w,h);
  ctx.fill();
  // fill
  const f = clamp(frac,0,1);
  if (f > 0.01) {
    ctx.save();
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x,y,w,h,h/2) : ctx.rect(x,y,w,h);
    ctx.clip();
    const g = ctx.createLinearGradient(x,y,x,y+h);
    g.addColorStop(0, color);
    g.addColorStop(1, "rgba(0,0,0,0.35)");
    ctx.fillStyle=g;
    ctx.fillRect(x,y,w*f,h);
    ctx.fillStyle="rgba(255,255,255,0.28)";
    ctx.fillRect(x,y+1.5,w*f,h*0.32);
    ctx.restore();
  }
  ctx.strokeStyle="rgba(240,232,214,0.35)"; ctx.lineWidth=1.4;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x,y,w,h,h/2) : ctx.rect(x,y,w,h);
  ctx.stroke();
}

function wrapText(text,cx,y,maxW,lh){
  const words = text.split(' ');
  let line='', ly=y;
  for (const w of words){
    const test = line+w+' ';
    if (ctx.measureText(test).width>maxW && line){
      ctx.fillText(line, cx, ly); line=w+' '; ly+=lh;
    } else line = test;
  }
  ctx.fillText(line, cx, ly);
}

// ============================================================
// SECRET LEVEL — "PICK AXE PETE" homage
// Magnavox Odyssey² (1982, Ed Averett). Single static mine shaft,
// 7 floors, ladders that come and go, 3 doors that spew boulders.
// Triggered from the title screen with the Konami code.
// Rules per the original manual: evade a boulder = 1pt, destroy one
// with the pick = 3pts, the pick wears out, colliding boulders can
// drop a fresh pick or a key, a key lets you take a door deeper
// (and recolors the level to match the door), no key at a door and
// you get stuck — at the mercy of the next boulder through.
// ============================================================
const PA_FLOORS = 7;
const PA_FLOOR_Y = [];
for (let i=0;i<PA_FLOORS;i++) PA_FLOOR_Y.push(110+i*60);
const PA_LADDER_X = [130,300,470,640,810];
const PA_DOOR_FLOOR = 1;
const PA_DOORS = [
  { x:220, color:"#c9302c" },
  { x:480, color:"#2b6cb0" },
  { x:740, color:"#d4a017" },
];

function paReset(){
  const gaps = [];
  for (let g=0; g<PA_FLOORS-1; g++){
    const slot = {};
    PA_LADDER_X.forEach(x => { slot[x] = chance(0.55); });
    if (!Object.values(slot).some(v=>v)) slot[PA_LADDER_X[Math.floor(rand(0,PA_LADDER_X.length))]] = true;
    gaps.push(slot);
  }
  pa = {
    score: 0,
    depth: 1,
    theme: "#8a6338",
    time: 0,
    introT: 110,
    spawnT: 110,
    spawnInterval: 150,
    ladderGaps: gaps,
    ladderTimer: 240,
    boulders: [],
    pickups: [],
    pete: { floorIdx:3, x: W/2, facing:1, hasAxe:true, axeCharges:6, hasKey:false, jumpT:0, stuckT:0 },
  };
  paParticles = []; paFloaters = [];
  paState = 'PLAY';
}

function paNearLadder(x, gapIdx){
  const gap = pa.ladderGaps[gapIdx];
  for (const xStr in gap) if (gap[xStr] && Math.abs(Number(xStr)-x) < 16) return true;
  return false;
}
function paSpawnPickup(x){
  if (chance(0.55)) pa.pickups.push({ type:'pick', x, floorIdx: PA_FLOORS-1, life: 500 });
  else pa.pickups.push({ type:'key', x, y: PA_FLOOR_Y[PA_FLOORS-1], floorIdx: PA_FLOORS-1, life: 600 });
}
function paPuff(x,y){
  for (let i=0;i<8;i++) paParticles.push({ x, y, vx:rand(-1,1), vy:rand(-1.5,-0.2), life:rand(12,20), color:"#e8b23c" });
}
function paFloat(x,y,text,color){ paFloaters.push({ x, y, text, color, life:60 }); }
function paGameOver(){ paState = 'GAMEOVER'; }

function updatePA(dt){
  if (paState !== 'PLAY') return;
  pa.time += dt;
  if (pa.introT > 0) pa.introT -= dt;

  pa.ladderTimer -= dt;
  if (pa.ladderTimer <= 0) {
    pa.ladderTimer = rand(180,260);
    const g = Math.floor(rand(0, pa.ladderGaps.length));
    const slot = PA_LADDER_X[Math.floor(rand(0, PA_LADDER_X.length))];
    pa.ladderGaps[g][slot] = !pa.ladderGaps[g][slot];
    if (!Object.values(pa.ladderGaps[g]).some(v=>v)) pa.ladderGaps[g][slot] = true;
  }

  const pete = pa.pete;
  const left = keys['ArrowLeft']||keys['KeyA'];
  const right = keys['ArrowRight']||keys['KeyD'];
  const up = keys['ArrowUp']||keys['KeyW'];
  const down = keys['ArrowDown']||keys['KeyS'];
  const action = keys['Space'];

  if (pete.stuckT > 0) pete.stuckT -= dt;
  else if (pete.jumpT > 0) pete.jumpT -= dt;
  else {
    const canUp = pete.floorIdx>0 && paNearLadder(pete.x, pete.floorIdx-1);
    const canDown = pete.floorIdx<PA_FLOORS-1 && paNearLadder(pete.x, pete.floorIdx);
    if (up && canUp) pete.floorIdx--;
    else if (down && canDown) pete.floorIdx++;
    else {
      if (left) { pete.x -= 2.6*dt; pete.facing=-1; }
      if (right) { pete.x += 2.6*dt; pete.facing=1; }
    }
    pete.x = clamp(pete.x, 50, W-50);
  }

  if (action && !pete._actionLatch) {
    pete._actionLatch = true;
    if (pete.jumpT<=0 && pete.stuckT<=0) {
      let hit = null, bestD = 40;
      if (pete.hasAxe) {
        for (const b of pa.boulders) {
          if (b.floorIdx===pete.floorIdx) {
            const d = (b.x-pete.x)*pete.facing;
            if (d>0 && d<bestD) { bestD=d; hit=b; }
          }
        }
      }
      if (hit) {
        hit._dead = true;
        pa.score += 3;
        pete.axeCharges--;
        paPuff(hit.x, PA_FLOOR_Y[hit.floorIdx]);
        if (pete.axeCharges<=0) pete.hasAxe = false;
      } else {
        pete.jumpT = 16;
      }
    }
  }
  if (!action) pete._actionLatch = false;

  if (pete.floorIdx===PA_DOOR_FLOOR) {
    let atDoor = null;
    for (const d of PA_DOORS) if (Math.abs(pete.x-d.x)<18) atDoor = d;
    if (atDoor && pete.stuckT<=0 && pete.jumpT<=0 && !pete._doorLatch) {
      pete._doorLatch = true;
      if (pete.hasKey) {
        pete.hasKey = false;
        pa.score += 20;
        pa.depth++;
        pa.theme = atDoor.color;
        pa.boulders = [];
        pa.spawnInterval = Math.max(70, 150 - pa.depth*4);
        pa.spawnT = 70;
        paFloat(pete.x, PA_FLOOR_Y[pete.floorIdx]-24, "DEEPER — LEVEL "+pa.depth, atDoor.color);
      } else {
        pete.stuckT = 50;
        paFloat(pete.x, PA_FLOOR_Y[pete.floorIdx]-24, "STUCK!", "#ff8b6b");
      }
    } else if (!atDoor) pete._doorLatch = false;
  } else pete._doorLatch = false;

  pa.spawnT -= dt;
  if (pa.introT<=0 && pa.spawnT<=0) {
    pa.spawnT = pa.spawnInterval;
    pa.spawnInterval = Math.max(55, pa.spawnInterval - 1.4);
    const d = PA_DOORS[Math.floor(rand(0,PA_DOORS.length))];
    pa.boulders.push({ x:d.x, floorIdx: PA_DOOR_FLOOR, dir: chance(0.5)?1:-1, vx: rand(1.3,1.9) });
  }

  for (const b of pa.boulders) {
    b.x += b.dir*b.vx*dt;
    if (b.x < 60 || b.x > W-60) {
      b.x = clamp(b.x, 60, W-60);
      if (b.floorIdx < PA_FLOORS-1) { b.floorIdx++; b.dir *= -1; }
      else { b._dead = true; if (chance(0.4)) paSpawnPickup(b.x); }
    }
    if (!b._dead && b.floorIdx===pete.floorIdx && Math.abs(b.x-pete.x)<16 && pete.jumpT<=0) {
      paGameOver();
    }
  }
  pa.boulders = pa.boulders.filter(b=>!b._dead);

  for (const pk of pa.pickups) {
    if (pk.type==='key') {
      pk.y -= 0.9*dt;
      for (let i=0;i<PA_FLOOR_Y.length;i++) if (Math.abs(PA_FLOOR_Y[i]-pk.y)<10) pk.floorIdx = i;
    }
    pk.life -= dt;
    if (pk.floorIdx===pete.floorIdx && Math.abs(pk.x-pete.x)<18 && pete.jumpT<=0) {
      if (pk.type==='pick') { pete.hasAxe=true; pete.axeCharges=6; pa.score+=5; paFloat(pete.x,PA_FLOOR_Y[pete.floorIdx]-18,"NEW PICK +5","#e8b23c"); }
      else { pete.hasKey=true; pa.score+=2; paFloat(pete.x,PA_FLOOR_Y[pete.floorIdx]-18,"KEY!","#ffe98a"); }
      pk._dead = true;
    }
  }
  pa.pickups = pa.pickups.filter(pk=>!pk._dead && pk.life>0);

  for (const f of paFloaters) f.life -= dt;
  paFloaters = paFloaters.filter(f=>f.life>0);
  for (const pt of paParticles) { pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.life-=dt; }
  paParticles = paParticles.filter(pt=>pt.life>0);
}

function drawPA(){
  ctx.fillStyle = "#000000";
  ctx.fillRect(0,0,W,H);

  for (let i=0;i<PA_FLOORS;i++) {
    ctx.fillStyle = pa.theme;
    ctx.fillRect(40, PA_FLOOR_Y[i], W-80, 8);
  }

  ctx.strokeStyle = "#e8d24a"; ctx.lineWidth=4;
  for (let g=0; g<pa.ladderGaps.length; g++){
    for (const xStr in pa.ladderGaps[g]) {
      if (!pa.ladderGaps[g][xStr]) continue;
      const x = Number(xStr), y0 = PA_FLOOR_Y[g], y1 = PA_FLOOR_Y[g+1];
      ctx.beginPath(); ctx.moveTo(x-8,y0); ctx.lineTo(x-8,y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+8,y0); ctx.lineTo(x+8,y1); ctx.stroke();
      for (let ry=y0+10; ry<y1; ry+=10) { ctx.beginPath(); ctx.moveTo(x-8,ry); ctx.lineTo(x+8,ry); ctx.stroke(); }
    }
  }

  for (const d of PA_DOORS) {
    ctx.fillStyle = d.color;
    ctx.fillRect(d.x-14, PA_FLOOR_Y[PA_DOOR_FLOOR]-38, 28, 38);
    ctx.fillStyle = "#000000";
    ctx.fillRect(d.x-14, PA_FLOOR_Y[PA_DOOR_FLOOR]-38, 28, 4);
    ctx.fillRect(d.x-3, PA_FLOOR_Y[PA_DOOR_FLOOR]-20, 6, 6);
  }

  for (const b of pa.boulders) {
    ctx.fillStyle = "#d4622b";
    ctx.fillRect(b.x-10, PA_FLOOR_Y[b.floorIdx]-16, 20, 16);
  }

  for (const pk of pa.pickups) {
    ctx.fillStyle = pk.type==='pick' ? "#c9c9c9" : "#ffe98a";
    ctx.fillRect(pk.x-6, (pk.y!==undefined?pk.y:PA_FLOOR_Y[pk.floorIdx])-14, 12, 14);
  }

  const pete = pa.pete;
  const hop = pete.jumpT>0 ? 16*Math.sin(clamp(pete.jumpT/16,0,1)*Math.PI) : 0;
  const py = PA_FLOOR_Y[pete.floorIdx] - hop;
  ctx.fillStyle = (pete.stuckT>0 && Math.floor(pete.stuckT/4)%2===0) ? "#ff8b6b" : "#f2ead8";
  ctx.fillRect(pete.x-8, py-28, 16, 24);
  ctx.fillStyle="#e8b23c";
  ctx.fillRect(pete.x-6, py-34, 12, 8);
  if (pete.hasAxe) {
    ctx.strokeStyle="#c9c9c9"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(pete.x+pete.facing*8, py-24); ctx.lineTo(pete.x+pete.facing*20, py-30); ctx.stroke();
  }

  ctx.textAlign="left"; ctx.fillStyle="#ffffff"; ctx.font="bold 20px monospace";
  ctx.fillText("SCORE "+String(pa.score).padStart(4,'0'), 30, 40);
  ctx.fillText("LEVEL "+pa.depth, W-160, 40);
  ctx.font="12px monospace"; ctx.fillStyle="#cfcfcf";
  ctx.fillText(pete.hasAxe ? "PICK "+pete.axeCharges : "PICK BROKEN — SPACE to jump", 30, 60);
  if (pete.hasKey) { ctx.fillStyle="#ffe98a"; ctx.fillText("KEY", W-160, 60); }

  ctx.textAlign="center";
  for (const f of paFloaters) {
    ctx.globalAlpha = clamp(f.life/60,0,1);
    ctx.fillStyle=f.color; ctx.font="bold 13px monospace";
    ctx.fillText(f.text, f.x, f.y - (60-f.life)*0.5);
  }
  ctx.globalAlpha=1;
  for (const pt of paParticles) {
    ctx.globalAlpha = clamp(pt.life/20,0,1);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, 4, 4);
  }
  ctx.globalAlpha=1;

  if (pa.introT > 0) {
    ctx.fillStyle="rgba(0,0,0,0.55)"; ctx.fillRect(0,0,W,H);
    ctx.textAlign="center"; ctx.fillStyle="#ffe98a"; ctx.font="bold 36px monospace";
    ctx.fillText("PICK AXE PETE!", W/2, H/2-20);
    ctx.font="13px monospace"; ctx.fillStyle="#cfcfcf";
    ctx.fillText("a secret homage \u2014 Magnavox Odyssey\u00B2, 1982", W/2, H/2+14);
    ctx.fillText("\u2190\u2192 walk  \u2191\u2193 ladders  SPACE swing/jump  ESC exit", W/2, H/2+38);
  }

  if (paState==='GAMEOVER') {
    ctx.fillStyle="rgba(0,0,0,0.7)"; ctx.fillRect(0,0,W,H);
    ctx.textAlign="center"; ctx.fillStyle="#ff8b6b"; ctx.font="bold 30px monospace";
    ctx.fillText("BOWLED OVER!", W/2, H/2-20);
    ctx.font="16px monospace"; ctx.fillStyle="#f2ead8";
    ctx.fillText("SCORE "+pa.score+"   DEPTH "+pa.depth, W/2, H/2+14);
    ctx.font="13px monospace"; ctx.fillStyle="#e8b23c";
    ctx.fillText("ENTER TO PLAY AGAIN   \u00B7   ESC FOR THE MAIL ROUTE", W/2, H/2+50);
  }
}

// ---------- MAIN LOOP ----------
let lastT = performance.now();
let enterLatch = false;
let lastAudioState = null;

function frame(now){
  const dt = clamp((now-lastT)/16.67, 0, 3);
  lastT = now;

  const enter = keys['Enter'];
  if (enter && !enterLatch) {
    enterLatch = true;
    if (state===STATE.TITLE && jukeboxOpen) {
      // handled by the keydown listener (downloads the selected track)
    } else {
      sfxMenu();
      if (state===STATE.TITLE) { resetGame(1, false); state = STATE.PLAY; }
      else if (state===STATE.INTERSTITIAL) { resetGame(world.levelIdx+1, true); state = STATE.PLAY; }
      else if (state===STATE.WIN) { resetGame(1, false); state = STATE.TITLE; }
      else if (state===STATE.DEAD) { resetGame(world.levelIdx, true); state = STATE.PLAY; }
      else if (state===STATE.PICKAXE && paState==='GAMEOVER') { paReset(); paState='PLAY'; }
    }
  }
  if (!enter) enterLatch = false;

  if (keys['Escape'] && (state===STATE.PICKAXE || state===STATE.WIN || state===STATE.DEAD)) state = STATE.TITLE;

  // music + one-shot stingers follow state changes, not individual events
  if (state !== lastAudioState) {
    if (state===STATE.TITLE) playMusic('title');
    else if (state===STATE.PLAY) { playMusic('l'+world.levelIdx); unlockTrack('l'+world.levelIdx); }
    else if (state===STATE.PICKAXE) { playMusic('pickaxe'); unlockTrack('pickaxe'); }
    else if (state===STATE.WIN) { stopMusic(); sfxWin(); }
    else if (state===STATE.DEAD) { stopMusic(); sfxDead(); }
    else if (state===STATE.INTERSTITIAL) stopMusic();
    lastAudioState = state;
  }

  if (state===STATE.PICKAXE) updatePA(dt); else update(dt);

  ctx.save();
  if (world && world.shakeT>0) {
    ctx.translate(rand(-4,4), rand(-3,3));
  }

  if (state===STATE.TITLE) { drawTitle(); if (jukeboxOpen) drawJukebox(); }
  else if (state===STATE.PLAY) {
    const mirrored = curLevel().mirrored;
    ctx.save();
    if (mirrored) { ctx.translate(W,0); ctx.scale(-1,1); }
    drawBackground(); drawGround(); drawObstacles();
    drawEnemies(); drawAvalanche(); drawPlayerSprite();
    drawParticles(); drawIcons(); drawSnow();
    ctx.restore();
    drawHUD(); // always drawn un-mirrored — the HUD reads normally regardless
  } else if (state===STATE.INTERSTITIAL) drawInterstitial();
  else if (state===STATE.WIN) drawWin();
  else if (state===STATE.DEAD) drawDead();
  else if (state===STATE.PICKAXE) drawPA();

  ctx.restore();
  requestAnimationFrame(frame);
}

resetGame(1, false);
requestAnimationFrame(frame);
</script>
