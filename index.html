  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    min-height: 100%;
    background: var(--ash);
  }

  body{
    background: var(--ash);
    color: #cfc9bd;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 7vh 1.25rem 4rem;
    overflow-x: hidden;
  }

  /* ---------- wordmark signature ---------- */

  .wordmark-stage{
    margin-bottom: 3.2rem;
  }

  .wordmark{
    width: min(520px, 82vw);
    aspect-ratio: 1483 / 362;
    background-image: var(--wordmark-img);
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    opacity: 0.92;
    filter: drop-shadow(0 0 14px rgba(190,90,30,0.16)) saturate(0.9) brightness(0.98);
    animation: wordmarkBreathe 6.5s ease-in-out infinite;
  }

  @keyframes wordmarkBreathe{
    0%, 100%{ opacity: 0.84; filter: drop-shadow(0 0 10px rgba(190,90,30,0.12)) saturate(0.86) brightness(0.96); }
    50%{      opacity: 1;    filter: drop-shadow(0 0 20px rgba(210,110,40,0.26)) saturate(1) brightness(1.03); }
  }

  /* ---------- gallery ---------- */

  .gallery{
    width: min(1180px, 94vw);
    display: grid;
    grid-template-columns: 1fr;
    gap: 2.6rem;
  }

  @media (min-width: 880px){
    .gallery{
      grid-template-columns: 1fr 1fr;
      gap: 2.2rem;
    }
  }

  .frame{
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
  }

  .frame-img{
    position: absolute;
    inset: 0;
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
  }

  .frame1 .frame-img{ background-image: var(--room1-img); }
  .frame2 .frame-img{ background-image: var(--room2-img); }

  /* soft light wave sweeping the blank wall — "every wave of light is flushed out" */
  .light-sweep{
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.5;
    background: linear-gradient(
      100deg,
      transparent 20%,
      rgba(255,246,222,0.0) 36%,
      rgba(255,249,235,0.5) 46%,
      rgba(255,246,222,0.0) 56%,
      transparent 72%
    );
    background-size: 260% 100%;
    animation: sweepFlow 9s ease-in-out infinite;
  }

  @keyframes sweepFlow{
    0%{   background-position: 120% 0; }
    45%{  background-position: -20% 0; }
    100%{ background-position: -20% 0; }
  }

  /* fine grain / dust drifting through the light */
  .dust{
    position: absolute;
    border-radius: 50%;
    background: rgba(230,224,206,0.55);
    pointer-events: none;
    filter: blur(0.3px);
    animation: drift linear infinite;
  }

  @keyframes drift{
    0%{   transform: translate(0,0); opacity: 0; }
    10%{  opacity: 0.6; }
    90%{  opacity: 0.4; }
    100%{ transform: translate(var(--dx, 14px), var(--dy, -60px)); opacity: 0; }
  }

  .frame1 .dust1{ left: 30%; top: 70%; width: 2.5px; height: 2.5px; --dx: 10px; --dy: -140px; animation-duration: 13s; animation-delay: 0s; }
  .frame1 .dust2{ left: 46%; top: 60%; width: 2px;   height: 2px; --dx: -8px; --dy: -120px; animation-duration: 16s; animation-delay: 3s; }
  .frame1 .dust3{ left: 60%; top: 75%; width: 3px;   height: 3px; --dx: 12px; --dy: -150px; animation-duration: 15s; animation-delay: 7s; }
  .frame1 .dust4{ left: 38%; top: 50%; width: 1.8px; height: 1.8px; --dx: -6px; --dy: -110px; animation-duration: 18s; animation-delay: 5s; }

  .frame2 .dust1{ left: 34%; top: 68%; width: 2.2px; height: 2.2px; --dx: 8px;  --dy: -130px; animation-duration: 14s; animation-delay: 1s; }
  .frame2 .dust2{ left: 52%; top: 58%; width: 2.6px; height: 2.6px; --dx: -10px;--dy: -140px; animation-duration: 17s; animation-delay: 4s; }
  .frame2 .dust3{ left: 44%; top: 78%; width: 1.9px; height: 1.9px; --dx: 6px;  --dy: -100px; animation-duration: 12s; animation-delay: 8s; }

  @media (prefers-reduced-motion: reduce){
    .wordmark, .light-sweep, .dust{ animation: none !important; }
    .light-sweep{ opacity: 0.25; }
  }

  /* ---------- back link to the ENGINEER archive ---------- */

  .archive-back{
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 3;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: .06em;
    text-decoration: none;
    color: #55585c;
    opacity: .55;
    transition: opacity .3s ease, color .3s ease;
  }
  .archive-back:hover,
  .archive-back:focus-visible{
    opacity: 1;
    color: #9C90D9;
  }

  /* ---------- corner seal (mark from THE INDIFFERENCE ENGINEER) ---------- */

  .corner-seal{
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 3;
    opacity: .62;
    transition: opacity .3s ease;
  }
  .corner-seal:hover, .corner-seal:focus-within{ opacity: 1; }
  .corner-seal svg{ display:block; width: 92px; height:auto; }

  .seal-ring{ fill:none; stroke:#3a342a; stroke-width:1; transition: stroke .3s ease; }
  .seal-mark{ stroke:#5a5346; stroke-width:1; }
  .seal-dot{ fill:#6C5EB5; transition: fill .3s ease, filter .3s ease; }

  .seal-text{
    font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px;
    letter-spacing: .14em;
    fill: #5a5346;
  }

  .seal-mail{ text-decoration:none; }
  .seal-mail tspan{ fill:#5a5346; transition: fill .3s ease, filter .3s ease; }
  .seal-mail:hover tspan,
  .seal-mail:focus tspan{
    fill: #9C90D9;
    filter: drop-shadow(0 0 3px rgba(156,144,217,.85));
  }
  .seal-mail:focus{ outline: none; }

  .corner-seal:has(.seal-mail:hover) .seal-ring,
  .corner-seal:has(.seal-mail:focus) .seal-ring{ stroke:#6C5EB5; }
  .corner-seal:has(.seal-mail:hover) .seal-dot,
  .corner-seal:has(.seal-mail:focus) .seal-dot{
    fill: #9C90D9;
    filter: drop-shadow(0 0 3px rgba(156,144,217,.85));
  }

  .seal-motto{
    font-family: "Unbounded", sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: .01em;
    fill: #211d16;
  }

  @media (max-width: 520px){
    .corner-seal{ right: 12px; bottom: 12px; }
    .corner-seal svg{ width: 72px; }
    .archive-back{ top: 12px; left: 12px; font-size: 10px; }
  }

  /* ---------- music ---------- */

  .music-wrap{
    width: min(660px, 92vw);
    margin-top: 4rem;
  }

  .music-frame{
    position: relative;
    border-radius: 16px;
    padding: 2px;

      0 0 0 1px rgba(255,255,255,0.04),
      0 20px 50px rgba(0,0,0,0.55),

  }

  .music-frame iframe{
    display: block;
    width: 100%;
    height: 450px;
    border-radius: 14px;
    background: #0b0a0d;
  }
</style>
