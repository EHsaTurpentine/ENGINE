<script>
  // Boot sequence: "LOAD"THE INDIFFERENCE ENGINE",8" -> "RUN" -> reveal content.
  // Skips straight to final state if the user prefers reduced motion,
  // or if JS never runs at all (the <noscript> below handles that case).
  var reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var bootEl = document.getElementById('boot');
  var contentEl = document.getElementById('content');
  document.body.classList.remove('no-js');

  function reveal() {
    bootEl.style.display = 'none';
    contentEl.hidden = false;
  }

  if (reduceMotion) {
    reveal();
  } else {
    var lines = [
      'LOAD"THE INDIFFERENCE ENGINE",8',
      'SEARCHING FOR THE INDIFFERENCE ENGINE',
      'LOADING',
      'READY.',
      'RUN'
    ];
    var i = 0;
    var typed = '';

    function typeLine() {
      if (i >= lines.length) {
        setTimeout(reveal, 400);
        return;
      }
      var line = lines[i];
      var c = 0;
      typed += (i > 0 ? '\n' : '');
      var interval = setInterval(function () {
        if (c < line.length) {
          typed += line[c];
          bootEl.textContent = typed;
          c++;
        } else {
          clearInterval(interval);
          i++;
          setTimeout(typeLine, 250);
        }
      }, 35);
    }
    typeLine();
  }

  // --- Countdown timer: public access ends at the start of next month ---
  // Edit the line below whenever the "public until" date changes.
  // Uses each visitor's own local time zone.
  var deadline = new Date('2026-08-01T00:00:00');

  var countdownEl = document.getElementById('countdown');

  function updateCountdown() {
    var now = new Date();
    var diff = deadline - now;

    if (diff <= 0) {
      countdownEl.textContent = 'PUBLIC ACCESS PERIOD HAS ENDED';
      clearInterval(countdownTick);
      return;
    }

    var totalSeconds = Math.floor(diff / 1000);
    var days = Math.floor(totalSeconds / 86400);
    var hours = Math.floor((totalSeconds % 86400) / 3600);
    var minutes = Math.floor((totalSeconds % 3600) / 60);
    var seconds = totalSeconds % 60;

    function pad(n) { return n < 10 ? '0' + n : n; }

    countdownEl.textContent =
      days + 'D ' + pad(hours) + 'H ' + pad(minutes) + 'M ' + pad(seconds) + 'S';
  }

  updateCountdown();
  var countdownTick = setInterval(updateCountdown, 1000);
</script>

<noscript>
  <style>
    #boot { display: none; }
    #content { display: block !important; }
  </style>
</noscript>
