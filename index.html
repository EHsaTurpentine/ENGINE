  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    min-height: 100%;
    background: var(--bg);
  }

  body{
    background:
      radial-gradient(ellipse 62% 40% at 50% 26%, rgba(255,150,60,0.22), transparent 65%),
      radial-gradient(ellipse 70% 55% at 50% 82%, rgba(20,60,80,0.16), transparent 70%),
      var(--bg);
    color: #d9d5cd;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6vh 1.25rem 4rem;
    overflow-x: hidden;
  }

  /* ---------- stage ---------- */

  .stage{
    position: relative;
    width: min(440px, 88vw);
    aspect-ratio: 1856 / 2304;
    filter: drop-shadow(0 26px 50px rgba(0,0,0,0.6));
  }

  .layer{
    position: absolute;
    inset: 0;
    background-image: var(--poster-img);
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
  }

  .poster-base{
    animation: bodyGlow 4.6s ease-in-out infinite;
  }

  /* duplicate of the art, cropped to the wordmark + sun-ray band,
     screen-blended on top so only that region visibly brightens */
  .text-glow{
    clip-path: inset(0% 0% 63% 0%);
    -webkit-clip-path: inset(0% 0% 63% 0%);
    mix-blend-mode: screen;
    filter: brightness(1.45) saturate(1.3);
    animation: signPulse 2.6s ease-in-out infinite;
    transform-origin: top center;
  }

  /* soft warm halo blooming behind the sun / wordmark */
  .halo{
    position: absolute;
    left: 50%;
    top: 0%;
    width: 80%;
    height: 34%;
    transform: translate(-50%, 0);
    background: radial-gradient(ellipse 55% 60% at 50% 62%, rgba(255,150,60,0.55), rgba(255,90,30,0.15) 55%, transparent 75%);
    filter: blur(16px);
    mix-blend-mode: screen;
    animation: haloPulse 2.6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes bodyGlow{
    0%, 100%{ filter: drop-shadow(0 0 8px rgba(255,120,40,0.18)); }
    50%{      filter: drop-shadow(0 0 20px rgba(255,140,60,0.4)); }
  }

  @keyframes signPulse{
    0%, 100%{ opacity: 0.5;  filter: brightness(1.25) saturate(1.15); }
    50%{      opacity: 0.95; filter: brightness(1.6) saturate(1.4); }
  }

  @keyframes haloPulse{
    0%, 100%{ opacity: 0.4; }
    50%{      opacity: 1; }
  }

  /* ---------- hub glints (flywheel + drive wheel) ---------- */

  .glint{
    position: absolute;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
    mix-blend-mode: soft-light;
    opacity: 0.85;
  }

  .glint::before{
    content: "";
    position: absolute;
    inset: -60%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(255,255,255,0.9) 12deg,
      transparent 30deg,
      transparent 170deg,
      rgba(255,255,255,0.5) 185deg,
      transparent 205deg,
      transparent 360deg
    );
    animation: spin 3.6s linear infinite;
  }

  .glint-left{
    width: 30%;
    height: 30%;
    left: 14%;
    top: 35%;
  }

  .glint-right{
    width: 26%;
    height: 26%;
    left: 51%;
    top: 39.5%;
  }

  .glint-mid{
    width: 12%;
    height: 12%;
    left: 39%;
    top: 57%;
  }

  .glint-right::before{ animation-duration: 2.6s; animation-direction: reverse; }
  .glint-mid::before{ animation-duration: 3.1s; }

  @keyframes spin{
    to{ transform: rotate(360deg); }
  }

  /* ---------- waterfall / rapids ---------- */

  .water-layer{
    clip-path: polygon(12% 63%, 9% 67%, 7% 72%, 6% 80%, 7% 88%, 10% 93%, 30% 96%, 50% 97%, 70% 96%, 88% 92%, 90% 85%, 90% 78%, 85% 72%, 80% 68%, 72% 64%, 60% 62%, 45% 61.5%, 30% 62%);
    -webkit-clip-path: polygon(12% 63%, 9% 67%, 7% 72%, 6% 80%, 7% 88%, 10% 93%, 30% 96%, 50% 97%, 70% 96%, 88% 92%, 90% 85%, 90% 78%, 85% 72%, 80% 68%, 72% 64%, 60% 62%, 45% 61.5%, 30% 62%);
  }

  .water-glow{
    mix-blend-mode: screen;
    filter: brightness(1.3) saturate(1.15);
    animation: waterGlow 1.9s ease-in-out infinite;
  }

  @keyframes waterGlow{
    0%, 100%{ opacity: 0.35; }
    50%{      opacity: 0.75; }
  }

  .water-shimmer{
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.55;
    background-image: repeating-linear-gradient(
      115deg,
      transparent 0px,
      transparent 16px,
      rgba(255,255,255,0.45) 16px,
      rgba(255,255,255,0.45) 20px,
      transparent 20px,
      transparent 40px
    );
    background-size: 160% 160%;
    animation: shimmerFlow 1.7s linear infinite;
  }

  @keyframes shimmerFlow{
    from{ background-position: 0px 0px; }
    to{   background-position: -70px 110px; }
  }

  .splash{
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #cdeffa 45%, transparent 75%);
    mix-blend-mode: screen;
    pointer-events: none;
    animation: splashFlicker 1.1s ease-in-out infinite;
  }

  .splash1{ left: 42%; top: 67%; width: 10px; height: 10px; animation-delay: 0s; }
  .splash2{ left: 50%; top: 65.5%; width: 7px; height: 7px; animation-delay: 0.3s; }
  .splash3{ left: 60%; top: 68%; width: 6px; height: 6px; animation-delay: 0.6s; }
  .splash4{ left: 55%; top: 66%; width: 8px; height: 8px; animation-delay: 0.15s; }

  @keyframes splashFlicker{
    0%, 100%{ opacity: 0; transform: scale(0.5); }
    50%{      opacity: 0.9; transform: scale(1.2); }
  }

  /* ---------- steam rising from the cloud vent + smokestack ---------- */

  .ember{
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #eaf3f6 45%, rgba(210,225,230,0.5) 75%, transparent 85%);
    opacity: 0;
    pointer-events: none;
    animation: rise 3.6s ease-out infinite;
  }

  .ember1{ left: 17%; top: 15%; animation-delay: 0s;    width:9px; height:9px; }
  .ember2{ left: 21%; top: 12%; animation-delay: 1.1s;  width:6px; height:6px; }
  .ember3{ left: 14%; top: 19%; animation-delay: 2.0s;  width:7px; height:7px; }
  .ember4{ left: 57%; top: 14%; animation-delay: 0.6s;  width:6px; height:6px; }
  .ember5{ left: 60%; top: 11%; animation-delay: 2.6s;  width:5px; height:5px; }

  @keyframes rise{
    0%{   opacity: 0;    transform: translate(0, 0) scale(0.6); }
    15%{  opacity: 0.85; }
    100%{ opacity: 0;    transform: translate(var(--drift, 8px), -90px) scale(1.4); }
  }

  .ember1{ --drift: 6px; }
  .ember2{ --drift: -8px; }
  .ember3{ --drift: 4px; }
  .ember4{ --drift: -5px; }
  .ember5{ --drift: 7px; }

  /* ---------- reduced motion ---------- */

  @media (prefers-reduced-motion: reduce){
    .text-glow, .halo, .poster-base, .glint::before, .ember,
    .water-glow, .water-shimmer, .splash{
      animation: none !important;
    }
    .water-shimmer{ opacity: 0; }
    .corner-seal, .seal-ring, .seal-dot, .seal-mail tspan, .archive-back{
      transition: none !important;
    }
  }

  /* ---------- back link to the ENGINEER archive ---------- */

  .archive-back{
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 3;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: .06em;
    text-decoration: none;
    color: #55585c;
    opacity: .55;
    transition: opacity .3s ease, color .3s ease;
  }
  .archive-back:hover,
  .archive-back:focus-visible{
    opacity: 1;
    color: #9C90D9;
  }

  /* ---------- corner seal (mark from THE INDIFFERENCE ENGINEER) ---------- */

  .corner-seal{
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 3;
    opacity: .62;
    transition: opacity .3s ease;
  }
  .corner-seal:hover, .corner-seal:focus-within{ opacity: 1; }
  .corner-seal svg{ display:block; width: 92px; height:auto; }

  .seal-ring{ fill:none; stroke:#2a2c2f; stroke-width:1; transition: stroke .3s ease; }
  .seal-mark{ stroke:#4c4e51; stroke-width:1; }
  .seal-dot{ fill:#6C5EB5; transition: fill .3s ease, filter .3s ease; }

  .seal-text{
    font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px;
    letter-spacing: .14em;
    fill: #83868a;
  }

  .seal-mail{ text-decoration:none; }
  .seal-mail tspan{ fill:#83868a; transition: fill .3s ease, filter .3s ease; }
  .seal-mail:hover tspan,
  .seal-mail:focus tspan{
    fill: #9C90D9;
    filter: drop-shadow(0 0 3px rgba(156,144,217,.85));
  }
  .seal-mail:focus{ outline: none; }

  /* the "circuit completes" moment — ring + mint marks light up together with the hidden link */
  .corner-seal:has(.seal-mail:hover) .seal-ring,
  .corner-seal:has(.seal-mail:focus) .seal-ring{ stroke:#6C5EB5; }
  .corner-seal:has(.seal-mail:hover) .seal-dot,
  .corner-seal:has(.seal-mail:focus) .seal-dot{
    fill: #9C90D9;
    filter: drop-shadow(0 0 3px rgba(156,144,217,.85));
  }

  .seal-motto{
    font-family: "Unbounded", sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: .01em;
    fill: #e9e7e1;
  }

  @media (max-width: 520px){
    .corner-seal{ right: 12px; bottom: 12px; }
    .corner-seal svg{ width: 72px; }
    .archive-back{ top: 12px; left: 12px; font-size: 10px; }
  }

  /* ---------- music ---------- */

  .music-wrap{
    width: min(660px, 92vw);
    margin-top: 3rem;
  }

  .music-frame{
    position: relative;
    border-radius: 16px;

  }

  .music-frame iframe{
    display: block;
    width: 100%;
    height: 450px;
    border-radius: 14px;
    background: #0b0a0d;
  }
</style>
