  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    min-height: 100%;
    background: var(--bg);
  }

  body{
    background:
      radial-gradient(ellipse 62% 40% at 50% 26%, rgba(255,150,60,0.22), transparent 65%),
      radial-gradient(ellipse 70% 55% at 50% 82%, rgba(20,60,80,0.16), transparent 70%),
      var(--bg);
    color: #d9d5cd;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6vh 1.25rem 4rem;
    overflow-x: hidden;
  }

  /* ---------- stage ---------- */

  .stage{
    position: relative;
    width: min(440px, 88vw);
    aspect-ratio: 912 / 1173;
    filter: drop-shadow(0 26px 50px rgba(0,0,0,0.6));
  }

  .layer{
    position: absolute;
    inset: 0;
    background-image: var(--poster-img);
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
  }

  .poster-base{
    animation: bodyGlow 4.6s ease-in-out infinite;
  }

  /* duplicate of the art, cropped to the wordmark + sun-ray band,
     screen-blended on top so only that region visibly brightens */
  .text-glow{
    clip-path: inset(0% 0% 62% 0%);
    -webkit-clip-path: inset(0% 0% 62% 0%);
    mix-blend-mode: screen;
    filter: brightness(1.45) saturate(1.3);
    animation: signPulse 2.6s ease-in-out infinite;
    transform-origin: top center;
  }

  /* soft warm halo blooming behind the sun / wordmark */
  .halo{
    position: absolute;
    left: 50%;
    top: 2%;
    width: 82%;
    height: 36%;
    transform: translate(-50%, 0);
    background: radial-gradient(ellipse 55% 60% at 50% 62%, rgba(255,150,60,0.55), rgba(255,90,30,0.15) 55%, transparent 75%);
    filter: blur(16px);
    mix-blend-mode: screen;
    animation: haloPulse 2.6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes bodyGlow{
    0%, 100%{ filter: drop-shadow(0 0 8px rgba(255,120,40,0.18)); }
    50%{      filter: drop-shadow(0 0 20px rgba(255,140,60,0.4)); }
  }

  @keyframes signPulse{
    0%, 100%{ opacity: 0.5;  filter: brightness(1.25) saturate(1.15); }
    50%{      opacity: 0.95; filter: brightness(1.6) saturate(1.4); }
  }

  @keyframes haloPulse{
    0%, 100%{ opacity: 0.4; }
    50%{      opacity: 1; }
  }

  /* ---------- twinkling stars ---------- */

  .star{
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    mix-blend-mode: screen;
    background: radial-gradient(circle, #fff 0%, #ffe9b8 40%, transparent 72%);
  }

  .star1{ left: 15.5%; top: 6.2%;  width: 14px; height: 14px; animation: twinkle 2.2s ease-in-out infinite; }
  .star2{ left: 48.5%; top: 3.4%;  width: 20px; height: 20px; animation: twinkle 3.1s ease-in-out infinite 0.4s; }
  .star3{ left: 69.8%; top: 5.6%;  width: 11px; height: 11px; animation: twinkle 1.8s ease-in-out infinite 0.9s; }

  @keyframes twinkle{
    0%, 100%{ opacity: 0.25; transform: scale(0.7); }
    50%{      opacity: 1;    transform: scale(1.15); }
  }

  /* ---------- hub glints (flywheel + drive wheel) ---------- */

  .glint{
    position: absolute;
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
    mix-blend-mode: soft-light;
    opacity: 0.85;
  }

  .glint::before{
    content: "";
    position: absolute;
    inset: -60%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(255,255,255,0.9) 12deg,
      transparent 30deg,
      transparent 170deg,
      rgba(255,255,255,0.5) 185deg,
      transparent 205deg,
      transparent 360deg
    );
    animation: spin 3.6s linear infinite;
  }

  .glint-flywheel{
    width: 14%;
    height: 14%;
    left: 45%;
    top: 53%;
  }

  .glint-drivewheel{
    width: 9%;
    height: 9%;
    left: 47.7%;
    top: 72%;
  }

  .glint-drivewheel::before{ animation-duration: 2.6s; animation-direction: reverse; }

  @keyframes spin{
    to{ transform: rotate(360deg); }
  }

  /* ---------- waterfall / rapids ---------- */

  .water-layer{
    clip-path: polygon(20% 56%, 15% 61%, 13% 66%, 9% 70%, 4% 75%, 0% 80%, 0% 92%, 6% 97%, 30% 98%, 50% 96%, 56% 89%, 58% 79%, 53% 71%, 49% 67%, 45% 63%, 42% 58%, 38% 55%);
    -webkit-clip-path: polygon(20% 56%, 15% 61%, 13% 66%, 9% 70%, 4% 75%, 0% 80%, 0% 92%, 6% 97%, 30% 98%, 50% 96%, 56% 89%, 58% 79%, 53% 71%, 49% 67%, 45% 63%, 42% 58%, 38% 55%);
  }

  .water-glow{
    mix-blend-mode: screen;
    filter: brightness(1.3) saturate(1.15);
    animation: waterGlow 1.9s ease-in-out infinite;
  }

  @keyframes waterGlow{
    0%, 100%{ opacity: 0.35; }
    50%{      opacity: 0.75; }
  }

  .water-shimmer{
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.55;
    background-image: repeating-linear-gradient(
      115deg,
      transparent 0px,
      transparent 16px,
      rgba(255,255,255,0.45) 16px,
      rgba(255,255,255,0.45) 20px,
      transparent 20px,
      transparent 40px
    );
    background-size: 160% 160%;
    animation: shimmerFlow 1.7s linear infinite;
  }

  @keyframes shimmerFlow{
    from{ background-position: 0px 0px; }
    to{   background-position: -70px 110px; }
  }

  .splash{
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, #cdeffa 45%, transparent 75%);
    mix-blend-mode: screen;
    pointer-events: none;
    animation: splashFlicker 1.1s ease-in-out infinite;
  }

  .splash1{ left: 24%; top: 70%; width: 10px; height: 10px; animation-delay: 0s; }
  .splash2{ left: 31%; top: 68.5%; width: 7px; height: 7px; animation-delay: 0.3s; }
  .splash3{ left: 18%; top: 72%; width: 6px; height: 6px; animation-delay: 0.6s; }
  .splash4{ left: 36%; top: 71%; width: 8px; height: 8px; animation-delay: 0.15s; }

  @keyframes splashFlicker{
    0%, 100%{ opacity: 0; transform: scale(0.5); }
    50%{      opacity: 0.9; transform: scale(1.2); }
  }

  /* ---------- embers rising from the smokestack ---------- */

  .ember{
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;

  @keyframes rise{
