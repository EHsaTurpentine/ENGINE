<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>THE INDIFFERENCE ENGINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="no-js">
<div class="screen">
  <pre id="boot" aria-hidden="true"></pre>

  <div id="content" hidden>
    <nav>
      <a href="/">HOME</a><a href="/archive/">ARCHIVE</a>
    </nav>
    <main>
      <h1>THE INDIFFERENCE ENGINE</h1>
      <p>A personal archive. Built by hand, one page at a time.</p>
    </main>
  </div>
</div>

<script>
  // Boot sequence: "LOAD"THE INDIFFERENCE ENGINE",8" -> "RUN" -> reveal content.
  // Skips straight to final state if the user prefers reduced motion,
  // or if JS never runs at all (the <noscript> below handles that case).
  var reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var bootEl = document.getElementById('boot');
  var contentEl = document.getElementById('content');
  document.body.classList.remove('no-js');

  function reveal() {
    bootEl.style.display = 'none';
    contentEl.hidden = false;
  }

  if (reduceMotion) {
    reveal();
  } else {
    var lines = [
      'LOAD"THE INDIFFERENCE ENGINE",8',
      'SEARCHING FOR THE INDIFFERENCE ENGINE',
      'LOADING',
      'READY.',
      'RUN'
    ];
    var i = 0;
    var typed = '';

    function typeLine() {
      if (i >= lines.length) {
        setTimeout(reveal, 400);
        return;
      }
      var line = lines[i];
      var c = 0;
      typed += (i > 0 ? '\n' : '');
      var interval = setInterval(function () {
        if (c < line.length) {
          typed += line[c];
          bootEl.textContent = typed;
          c++;
        } else {
          clearInterval(interval);
          i++;
          setTimeout(typeLine, 250);
        }
      }, 35);
    }
    typeLine();
  }
</script>

<noscript>
  <style>
    #boot { display: none; }
    #content { display: block !important; }
  </style>
</noscript>
</body>
</html>
