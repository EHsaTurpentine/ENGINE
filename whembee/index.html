<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>The Legend of Whembee</title>
<style>
  @font-face { font-family: "Press Start 2P"; src: url("fonts/PressStart2P.ttf") format("truetype"); font-display: block; }
  :root { --bg: #0e0b1a; --panel: #1b1530; --gold: #ffd84a; --ink: #f2e7c9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(ellipse at 50% 20%, #2a1f4d 0%, var(--bg) 70%) fixed; color: var(--ink);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 14px; }
  .frame { position: relative; width: min(1200px, 100%, calc((100vh - 150px) * 5 / 3)); min-width: 320px;
    padding: 10px; border-radius: 14px; background: linear-gradient(#3a2d63, #1b1530);
    box-shadow: 0 0 0 3px #0b0816, 0 0 0 5px var(--gold), 0 18px 50px #000a; }
  canvas#screen { width: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 4px; background: #000; aspect-ratio: 5 / 3; }
  #start { position: absolute; inset: 10px; display: flex; align-items: flex-end; justify-content: center; cursor: pointer;
    background: transparent; border: 0; padding: 0 0 5% 0; font: inherit; }
  #start span { font-family: "Press Start 2P", monospace; font-size: clamp(9px, 1.5vw, 16px); color: var(--gold); background: #0d0a1acc;
    padding: 10px 16px; border: 2px solid var(--gold); border-radius: 4px; animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  #error { display: none; position: absolute; inset: 10px; background: #000d; color: #ff9b8a;
    font: 12px/1.35 ui-monospace, Consolas, monospace; padding: 12px; overflow: auto; white-space: pre-wrap; }
  .row { display: flex; gap: 22px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; max-width: 1200px; }
  .help { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 4px 22px; flex: 1; color: #c9c0e0; font-size: 12px; }
  .help b { color: #fff; }
  kbd { background: #2c2350; border: 1px solid #4a3d7d; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 11px ui-monospace, Consolas, monospace; color: #fff; }
  #crank { width: 84px; height: 84px; border-radius: 50%; background: #2c2350; position: relative; cursor: grab; flex: none;
    box-shadow: inset 0 2px 8px #0008, 0 0 0 2px #4a3d7d; touch-action: none; }
  #crank:active { cursor: grabbing; }
  #crank .arm { position: absolute; left: 50%; top: 50%; width: 6px; height: 36px; margin-left: -3px; background: var(--gold);
    transform-origin: 50% 0; border-radius: 3px; }
  #crank .knob { position: absolute; left: 50%; bottom: -9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff3c4; }
  #crank .hub { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #8a6a0c; }
  .crank-col { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: #c9c0e0; }
  .menu { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: #c9c0e0; }
  .menu label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .touch { display: none; width: 100%; max-width: 560px; justify-content: space-between; align-items: center; user-select: none; -webkit-user-select: none; }
  .dpad { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); }
  .dpad button, .ab button { touch-action: none; border: 0; background: #2c2350; color: #fff; font-weight: 700; font-size: 18px; }
  .dpad button { border-radius: 8px; }
  .ab { display: flex; gap: 14px; }
  .ab button { width: 66px; height: 66px; border-radius: 50%; background: #6b2540; }
  .pressed { filter: brightness(1.7); }
  @media (pointer: coarse) { .touch { display: flex; } }
</style>
</head>
<body>
  <div class="frame">
    <canvas id="screen" width="1600" height="960"></canvas>
    <button id="start" aria-label="Start"><span id="startLabel">LOADING...</span></button>
    <div id="error"></div>
  </div>

  <div class="touch" id="touch">
    <div class="dpad">
      <span></span><button data-btn="4">&#9650;</button><span></span>
      <button data-btn="1">&#9664;</button><span></span><button data-btn="2">&#9654;</button>
      <span></span><button data-btn="8">&#9660;</button><span></span>
    </div>
    <div class="ab"><button data-btn="16">B</button><button data-btn="32">A</button></div>
  </div>

  <div class="row">
    <div class="crank-col">
      <div id="crank" title="Drag in circles to crank (or hold E, or use the mouse wheel)">
        <div class="arm" id="crankArm"><div class="knob"></div></div><div class="hub"></div>
      </div>
      CRANK
    </div>
    <div class="help">
      <div><b>Move</b> <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
      <div><b>A (kick / talk)</b> <kbd>X</kbd> <kbd>K</kbd> <kbd>Space</kbd> <kbd>Enter</kbd></div>
      <div><b>B (throw)</b> <kbd>Z</kbd> <kbd>J</kbd> <kbd>Shift</kbd></div>
      <div><b>Crank (helicopter!)</b> hold <kbd>E</kbd> (<kbd>Q</kbd> reverse), mouse wheel, or drag the wheel</div>
    </div>
  </div>
  <div class="menu" id="menu"></div>

<script src="lib/wasmoon.js"></script>
<script src="lib/glue_wasm.js"></script>
<script src="game_data.js"></script>
<script src="assets.js"></script>
<script src="engine.js"></script>
<script src="skin.js"></script>
<script>
(function () {
  const canvas = document.getElementById('screen');
  const startBtn = document.getElementById('start');
  const label = document.getElementById('startLabel');
  const errBox = document.getElementById('error');
  let ready = false, started = false;

  PD.onError = (msg) => {
    console.error(msg);
    errBox.style.display = 'block';
    errBox.textContent = 'The game hit an error:\n\n' + msg;
  };
  function start() {
    if (!ready || started) return;
    started = true;
    startBtn.remove();
    PD.start();
  }
  startBtn.addEventListener('click', start);
  window.addEventListener('keydown', (e) => { if (ready && !started) { e.preventDefault(); e.stopImmediatePropagation(); start(); } }, true);
  window.addEventListener('pointerdown', () => PD.ensureAudio());

  PD.init(canvas).then(() => { ready = true; label.textContent = 'CLICK OR PRESS ANY KEY'; })
    .catch((e) => { label.textContent = 'FAILED TO LOAD'; PD.onError(String(e && e.stack || e)); });

  const menuEl = document.getElementById('menu');
  const seen = new Set();
  PD.onMenu = (items) => {
    for (const it of items) {
      if (seen.has(it.i)) continue;
      seen.add(it.i);
      const l = document.createElement('label');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = it.value === 1;
      cb.addEventListener('change', () => PD.toggleMenu(it.i, cb.checked));
      l.append(cb, ' ' + it.title);
      menuEl.append(l);
    }
  };

  const crank = document.getElementById('crank'), arm = document.getElementById('crankArm');
  let dragAngle = null;
  const angleAt = (e) => {
    const r = crank.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
  };
  crank.addEventListener('pointerdown', (e) => { crank.setPointerCapture(e.pointerId); dragAngle = angleAt(e); });
  crank.addEventListener('pointermove', (e) => {
    if (dragAngle === null) return;
    const a = angleAt(e);
    let d = a - dragAngle;
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    dragAngle = a;
    PD.addCrank(d);
  });
  const endDrag = () => { dragAngle = null; };
  crank.addEventListener('pointerup', endDrag);
  crank.addEventListener('pointercancel', endDrag);
  document.querySelector('.frame').addEventListener('wheel', (e) => {
    e.preventDefault();
    PD.addCrank(Math.max(-90, Math.min(90, e.deltaY * 0.3)));
  }, { passive: false });
  PD.onCrankMoved = (pos) => { arm.style.transform = `rotate(${pos + 180}deg)`; };

  for (const b of document.querySelectorAll('[data-btn]')) {
    const m = Number(b.dataset.btn);
    const down = (e) => { e.preventDefault(); b.classList.add('pressed'); if (!started) start(); PD.press(m); };
    const up = (e) => { e.preventDefault(); b.classList.remove('pressed'); PD.release(m); };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('pointerleave', up);
  }
})();
</script>
</body>
</html>
